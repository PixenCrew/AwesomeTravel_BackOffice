plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kkjj'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-test'

	// dev
    // implementation 'org.springframework.boot:spring-boot-devtools'

	// lombok
	compileOnly 			group: 'org.projectlombok', name: 'lombok', version: '1.18.36'
	annotationProcessor 	group: 'org.projectlombok', name: 'lombok', version: '1.18.36'
	annotationProcessor 	group: 'org.projectlombok', name: 'lombok-mapstruct-binding', version: '0.2.0'

	// DB 연결
    implementation 			group: 'org.mariadb.jdbc',	name : 'mariadb-java-client'
	annotationProcessor 	group: 'jakarta.persistence', name: 'jakarta.persistence-api'

	// 템플릿 엔진
	implementation 			group: 'org.springframework.boot', name: 'spring-boot-starter-thymeleaf'

}

tasks.named('test') {
	useJUnitPlatform()
}
