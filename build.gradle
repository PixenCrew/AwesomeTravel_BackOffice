dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-test'

	// QueryDSL
	implementation "com.querydsl:querydsl-core:5.0.0"
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// lombok
	compileOnly 			group: 'org.projectlombok', name: 'lombok', version: '1.18.36'
	annotationProcessor 	group: 'org.projectlombok', name: 'lombok', version: '1.18.36'
	annotationProcessor 	group: 'org.projectlombok', name: 'lombok-mapstruct-binding', version: '0.2.0'

	// DB 연결
    implementation 			group: 'org.mariadb.jdbc',	name : 'mariadb-java-client'
    implementation 			group: 'com.h2database', name: 'h2'
	annotationProcessor 	group: 'jakarta.persistence', name: 'jakarta.persistence-api'

	// 템플릿 엔진
	implementation 			group: 'org.springframework.boot', name: 'spring-boot-starter-thymeleaf'
	
	// Apache POI for Excel processing
	implementation 'org.apache.poi:poi:5.2.4'
	implementation 'org.apache.poi:poi-ooxml:5.2.4'

	// Caffeine
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
	implementation 'org.springframework.boot:spring-boot-starter-cache'

}

tasks.named('test') {
	useJUnitPlatform()
	failOnNoDiscoveredTests = false
}
