spring.application.name=Awesome_Travel_BackOffice

# # backoffice 스키마 (관리자 계정용)
# spring.datasource.url=jdbc:mariadb://localhost:3306/backoffice
# spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# spring.datasource.username=awesomebackoffice
# spring.datasource.password=travelbackoffice
# #create,create-drop,update,validate,none
# spring.jpa.hibernate.ddl-auto=none
# spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# awesome 스키마 (기타 데이터용)
spring.datasource.url=jdbc:mariadb://localhost:3306/awesome
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=awesome
spring.datasource.password=travel
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# 기본 데이터 입력
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
# spring.sql.init.data-locations=classpath:mock/air.sql,classpath:mock/city_code.sql,classpath:mock/hotel.sql,classpath:mock/product.sql,classpath:mock/tour.sql,classpath:mock/menu_code.sql,classpath:mock/menu_code_details.sql
spring.sql.init.data-locations=classpath:mock/city_code.sql,classpath:mock/hotel.sql,classpath:mock/menu_code.sql,classpath:mock/menu_code_details.sql,classpath:mock/airline.sql,classpath:mock/tour.sql,classpath:mock/product.sql,classpath:mock/air.sql,classpath:mock/user.sql,classpath:mock/purchase_air.sql,classpath:mock/purchase_product.sql

# SQL 쿼리 콘솔 출력
spring.jpa.show-sql=false

# 디버깅 출력
logging.level.org.springframework.security=DEBUG

server.port=9090
# # 템플릿 실시간 반영
# spring.thymeleaf.cache=false
# spring.thymeleaf.prefix=classpath:/templates/
# spring.thymeleaf.suffix=.html
# spring.devtools.restart.enabled=true
# spring.devtools.livereload.enabled=true

# SSL 설정 (개발 환경: 비활성화하여 키스토어 누락 오류 방지)
# server.ssl.enabled=true
# server.ssl.key-store=certificate.p12
# server.ssl.key-store-type=PKCS12
# server.ssl.key-store-password=kyj0407

imageLocation=images
iconLocation=classpath:/static/icon

# JPA 디버깅 설정
# SQL 출력
spring.jpa.properties.hibernate.format_sql=true
# SQL 바인딩 파라미터 값 출력
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 파일 업로드 용량 상향설정
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# HTTP 메서드 오버라이드 활성화 (DELETE, PUT 등)
spring.mvc.hiddenmethod.filter.enabled=true

spring.cache.type=caffeine

spring.config.import=classpath:application-smtp.properties,classpath:application-google.properties