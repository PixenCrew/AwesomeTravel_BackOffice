<div th:fragment="content" class="flex flex-col h-full">
  <!-- 헤더 -->
  <div class="sm:flex sm:items-center flex-shrink-0 mb-6">
    <div class="sm:flex-auto">
      <h1 class="text-base font-semibold leading-6 text-gray-900">항공편 관리</h1>
      <p class="mt-2 text-sm text-gray-700">항공편을 검색하고 관리할 수 있습니다.</p>
    </div>
    <div class="mt-4 sm:ml-16 sm:mt-0 sm:flex-none">
      <a th:href="@{/air/new}" class="inline-flex items-center px-6 py-3 text-white font-semibold rounded-lg transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <i class="fas fa-plus mr-2"></i>새 항공편 등록
      </a>
    </div>
  </div>

  <!-- 필터 섹션 -->
  <div class="bg-slate-50 border border-slate-200 rounded-xl p-6 mb-6 flex-shrink-0">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-xl font-semibold text-gray-700">검색 필터 <span id="filterCountBadge" class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded-md text-xs font-semibold ml-2 hidden">0</span></h3>
      <button type="button" id="toggleFilterBtn" class="bg-blue-600 text-white border-0 px-4 py-2 rounded-md cursor-pointer text-sm transition-colors duration-200 hover:bg-blue-700" onclick="toggleFilter()"><i class="fas fa-filter mr-1"></i>필터</button>
    </div>
    <form id="filterForm" th:object="${filter}" class="hidden">
      <div class="grid grid-cols-1 gap-4 mb-4" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">항공편 코드</label>
          <input type="text" th:field="*{code}" placeholder="항공편 코드 입력" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
        </div>
        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">좌석등급</label>
          <select th:field="*{seatClassType}" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100">
            <option value="">전체</option>
            <option th:each="type : ${T(renewal.common.entity.SeatClass.SeatClassType).values()}" th:value="${type}" th:text="${type}"></option>
          </select>
        </div>
        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">비행 타입</label>
          <select th:field="*{flightType}" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100">
            <option value="">전체</option>
            <option th:each="type : ${T(renewal.common.entity.Air.FlightType).values()}" th:value="${type}" th:text="${type}"></option>
          </select>
        </div>
        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">상태</label>
          <select th:field="*{status}" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100">
            <option value="">전체</option>
            <option th:each="st : ${T(renewal.common.entity.Air.AirStatus).values()}" th:value="${st}" th:text="${st}"></option>
          </select>
        </div>

        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">출발일 (시작)</label>
          <input type="date" th:field="*{departDateFrom}" th:attr="readonly=${isSelectionPage} ? 'readonly' : null" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
        </div>
        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">출발일 (종료)</label>
          <input type="date" th:field="*{departDateTo}" th:attr="readonly=${isSelectionPage} ? 'readonly' : null" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
        </div>
        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">도착일 (시작)</label>
          <input type="date" th:field="*{arriveDateFrom}" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
        </div>
        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">도착일 (종료)</label>
          <input type="date" th:field="*{arriveDateTo}" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
        </div>

        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">출발지</label>
          <input type="text" th:field="*{departAirport}" placeholder="출발지 입력" list="airportList" onchange="stripAfterPipe(this)" th:attr="readonly=${isSelectionPage} ? 'readonly' : null" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
        </div>
        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">도착지</label>
          <input type="text" th:field="*{arriveAirport}" placeholder="도착지 입력" list="airportList" onchange="stripAfterPipe(this)" th:attr="readonly=${isSelectionPage} ? 'readonly' : null" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
        </div>

        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">경유지 수 (최소)</label>
          <input type="number" th:field="*{minStopovers}" min="0" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
        </div>
        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">경유지 수 (최대)</label>
          <input type="number" th:field="*{maxStopovers}" min="1" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
        </div>
        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">최소 가격</label>
          <input type="number" th:field="*{minPrice}" placeholder="0" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
        </div>
        <div class="flex flex-col">
          <label class="font-medium text-gray-700 mb-2 text-sm">최대 가격</label>
          <input type="number" th:field="*{maxPrice}" placeholder="999999999" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
        </div>

        <div class="flex flex-col" style="grid-column: 1 / -1;">
          <label class="font-medium text-gray-700 mb-2 text-sm">항공사 선택</label>
          <div class="p-3 border border-gray-300 rounded-lg text-sm" style="max-height: 8rem; overflow-y: auto;">
            <div th:each="airline : ${allAirlines}" class="flex items-center gap-2 mb-2">
              <input type="checkbox" th:field="*{airlines}" th:value="${airline.code}" />
              <img th:src="${airline.iconUrl}" alt="airline logo" class="w-5 h-5" />
              <label th:for="${'air_' + airline}" th:text="${airline.nameKor}"></label>
            </div>
          </div>
        </div>
      </div>

      <div class="flex gap-4 justify-end">
        <button type="button" class="bg-gray-500 text-white border-0 px-6 py-3 rounded-lg cursor-pointer font-semibold transition-colors duration-200 hover:bg-gray-600" onclick="resetFilterForm(event)"><i class="fas fa-undo mr-1"></i>초기화</button>
        <button type="button" class="bg-emerald-600 text-white border-0 px-6 py-3 rounded-lg cursor-pointer font-semibold transition-colors duration-200 hover:bg-emerald-700" onclick="performSearch(0, event)"><i class="fas fa-search mr-1"></i>검색</button>
      </div>

      <input type="hidden" name="sortField" th:value="${sortField}" />
      <input type="hidden" name="sortDir" th:value="${sortDir}" />
    </form>
  </div>

  <script>
    // toggleFilter, get, resetFilter 함수는 filter.js에서 전역으로 제공됨

    function countActiveFilters(form) {
      if (!form) return 0;
      const seenNames = new Set();
      let count = 0;
      const elements = Array.from(form.elements);
      const skip = new Set(['page', 'size', 'sort', 'sortField', 'sortDir', '_csrf']);
      elements.forEach(el => {
        if (!el.name || skip.has(el.name)) return;
        if (el.type === 'hidden') return;
        if (el.type === 'radio') {
          if (seenNames.has(el.name)) return;
          seenNames.add(el.name);
          const checked = form.querySelector(`input[name="${el.name}"]:checked`);
          if (checked && checked.value !== '' && checked.value != null) count++;
          return;
        }
        if (el.type === 'checkbox') {
          if (seenNames.has(el.name)) return;
          seenNames.add(el.name);
          const anyChecked = form.querySelectorAll(`input[name="${el.name}"]:checked`).length > 0;
          if (anyChecked) count++;
          return;
        }
        const val = (el.value || '').toString().trim();
        if (val !== '') count++;
      });
      return count;
    }

    function updateFilterCount() {
      const form = document.getElementById('filterForm');
      const badge = document.getElementById('filterCountBadge');
      if (!form || !badge) return;
      const n = countActiveFilters(form);
      if (n > 0) { badge.textContent = n; badge.classList.remove('hidden'); } else { badge.classList.add('hidden'); }
    }

    (function () {
      const form = document.getElementById('filterForm');
      if (form) {
        form.addEventListener('input', updateFilterCount, true);
        form.addEventListener('change', updateFilterCount, true);
        updateFilterCount();
      }
    })();
  </script>

  <!-- 결과 테이블 -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col">
    <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex-shrink-0">
      <h3 class="text-lg font-semibold text-gray-800">항공편 목록 <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 ml-2" th:text="'총 ' + ${airPage.totalElements} + '개'"></span></h3>
    </div>

    <div class="flex-1 overflow-auto table-responsive" style="max-height: calc(100vh - 500px); min-height: 200px;">
      <table class="min-w-full divide-y divide-gray-200" style="table-layout: fixed; width: 100%;">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 20%;">
              항공편 정보</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 12%;">
              <a href="#" data-sortfield="air.departDate"
                th:data-sortdir="${sortField=='air.departDate' and sortDir=='asc' ? 'asc' : 'desc'}"
                onclick="toggleSort(this, event)" class="group inline-flex">
                출발일시
                <span th:if="${sortField=='air.departDate'}" th:text="${sortDir=='asc' ? '▲' : '▼'}"
                  class="ml-2 flex-none rounded text-gray-400 group-hover:text-gray-500"></span>
              </a>
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 12%;">
              <a href="#" data-sortfield="air.arriveDate"
                th:data-sortdir="${sortField=='air.arriveDate' and sortDir=='asc' ? 'asc' : 'desc'}"
                onclick="toggleSort(this, event)" class="group inline-flex">
                도착일시
                <span th:if="${sortField=='air.arriveDate'}" th:text="${sortDir=='asc' ? '▲' : '▼'}"
                  class="ml-2 flex-none rounded text-gray-400 group-hover:text-gray-500"></span>
              </a>
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 18%;">
              항공사</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 15%;">
              좌석 정보</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 12%;">
              <a href="#" data-sortfield="price"
                th:data-sortdir="${sortField=='price' and sortDir=='asc' ? 'asc' : 'desc'}"
                onclick="toggleSort(this, event)" class="group inline-flex">
                가격
                <span th:if="${sortField=='price'}" th:text="${sortDir=='asc' ? '▲' : '▼'}"
                  class="ml-2 flex-none rounded text-gray-400 group-hover:text-gray-500"></span>
              </a>
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 10%;">
              상태</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <th:block th:each="seatClass : ${airPage.content}">
            <tr
              th:onclick="${isSelectionPage} ? |returnNumber(${seatClass.id})| : |window.location.href='@{/air/{id}(id=${seatClass.air.id})}'|"
              class="hover:bg-gray-50 cursor-pointer">
              <!-- 항공편 정보 -->
              <td class="px-6 py-4 whitespace-nowrap">
                <div class="flex items-center">
                  <div class="flex-shrink-0 h-10 w-10">
                    <div
                      class="relative h-10 w-10 rounded-full bg-blue-100 overflow-hidden flex items-center justify-center">

                      <img th:src="${seatClass.air.airline.iconUrl}" alt="airline logo"
                        class="absolute inset-0 w-full h-full object-cover opacity-80" />

                      <i class="fas fa-plane text-blue-600 text-sm relative z-10"></i>
                    </div>
                  </div>
                  <div class="ml-4">
                    <div class="text-sm font-medium text-gray-900" th:text="${seatClass.air.flightNumber}">AB123
                    </div>
                    <div class="text-sm text-gray-500">
                      <span th:text="${seatClass.air.departAirport.airportCode}">ICN</span>→
                      <span th:text="${seatClass.air.arriveAirport.airportCode}">NRT</span>
                    </div>
                  </div>
                </div>
              </td>

              <!-- 출발일시 -->
              <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-sm text-gray-900"
                  th:text="${#temporals.format(seatClass.air.departDateTime, 'yyyy-MM-dd HH:mm')}">
                </div>
              </td>

              <!-- 도착일시 -->
              <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-sm text-gray-900"
                  th:text="${#temporals.format(seatClass.air.arriveDateTime, 'yyyy-MM-dd HH:mm')}">
                </div>
              </td>

              <!-- 항공사 -->
              <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-sm font-medium text-gray-900" th:text="${seatClass.air.airline.nameKor}">좋은항공</div>
                <div class="text-sm text-gray-500" th:text="${seatClass.air.airline.nameEng}">GreatAir</div>
                <div class="text-xs text-gray-400" th:text="${seatClass.air.airline.code}">AAA</div>
              </td>

              <!-- 좌석 정보 -->
              <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-sm font-medium text-gray-900" th:text="${seatClass.classType}">FIRST</div>
                <div class="text-sm text-gray-500">
                  <span th:text="${seatClass.availableSeats}">10</span> / <span
                    th:text="${seatClass.maxSeats}">100</span>
                </div>
                <div class="text-xs text-gray-400">
                  경유: <span th:text="${seatClass.air.stopovers}">0</span>회
                </div>
              </td>

              <!-- 가격 -->
              <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-sm font-medium text-gray-900">
                  <span th:text="${#numbers.formatDecimal(seatClass.price, 0, 'COMMA', 0, 'POINT')}">50,000</span>원
                </div>
              </td>

              <!-- 상태 -->
              <td class="px-6 py-4 whitespace-nowrap">
                <span th:if="${seatClass.air.status.name() == 'ACTIVE'}"
                  class="inline-flex items-center rounded-md bg-green-50 px-2 py-1 text-xs font-medium text-green-700 ring-1 ring-inset ring-green-600/20">
                  활성
                </span>
                <span th:if="${seatClass.air.status.name() == 'INACTIVE'}"
                  class="inline-flex items-center rounded-md bg-red-50 px-2 py-1 text-xs font-medium text-red-700 ring-1 ring-inset ring-red-600/20">
                  비활성
                </span>
                <span th:if="${seatClass.air.status.name() == 'CANCELLED'}"
                  class="inline-flex items-center rounded-md bg-gray-50 px-2 py-1 text-xs font-medium text-gray-700 ring-1 ring-inset ring-gray-600/20">
                  취소
                </span>
              </td>

            </tr>
          </th:block>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 페이징 -->
  <div class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6 flex-shrink-0">
    <div class="flex-1 flex justify-between sm:hidden">
      <a th:if="${airPage.hasPrevious()}" href="#" th:onclick="|performSearch(${airPage.number - 1}, event)|" class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
        이전
      </a>
      <a th:if="${airPage.hasNext()}" href="#" th:onclick="|performSearch(${airPage.number + 1}, event)|" class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
        다음
      </a>
    </div>
    <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
      <div>
        <p class="text-sm text-gray-700">
          총 <span class="font-medium" th:text="${airPage.totalElements}">0</span>개 중
          <span class="font-medium" th:text="${airPage.number * airPage.size + 1}">1</span>-<span class="font-medium" th:text="${(airPage.number + 1) * airPage.size > airPage.totalElements ? airPage.totalElements : (airPage.number + 1) * airPage.size}">10</span>개 표시
        </p>
      </div>
      <div>
        <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
          <!-- 이전 페이지 버튼 -->
          <a th:if="${airPage.hasPrevious()}" th:href="@{/air(page=${airPage.number - 1}, sortField=${sortField}, sortDir=${sortDir})}" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
            <i class="fas fa-chevron-left"></i>
          </a>

          <!-- 페이지 번호들 (최대 10개만 표시) -->
          <th:block th:with="startPage=${airPage.number > 5 ? airPage.number - 5 : 0}, endPage=${airPage.number + 5 < airPage.totalPages ? airPage.number + 5 : airPage.totalPages - 1}">
            <a th:each="i : ${#numbers.sequence(startPage, endPage)}"
              th:href="@{/air(page=${i}, sortField=${sortField}, sortDir=${sortDir})}"
              th:class="${i == airPage.number} ? 'z-10 bg-blue-50 border-blue-500 text-blue-600 relative inline-flex items-center px-4 py-2 border text-sm font-medium' : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50 relative inline-flex items-center px-4 py-2 border text-sm font-medium'"
              th:text="${i + 1}">1</a>
          </th:block>

          <!-- 다음 페이지 버튼 -->
          <a th:if="${airPage.hasNext()}" th:href="@{/air(page=${airPage.number + 1}, sortField=${sortField}, sortDir=${sortDir})}" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
            <i class="fas fa-chevron-right"></i>
          </a>
        </nav>
      </div>
    </div>
  </div>
</div>

<script src="/js/util.js"></script>

<div th:replace="components/datalist/airportList :: airportDatalistFragment"></div>

<datalist id="seatClassList">
  <option value="ECONOMY">ECONOMY</option>
  <option value="PREMIUMECONOMY">PREMIUMECONOMY</option>
  <option value="BUSINESS">BUSINESS</option>
  <option value="FIRST">FIRST</option>
</datalist>

</div>
