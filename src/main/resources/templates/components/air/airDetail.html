<div th:fragment="content">
  <!-- 헤더 -->
  <div class="sm:flex sm:items-center">
    <div class="sm:flex-auto">
      <h1 class="text-base font-semibold leading-6 text-gray-900" th:text="${air.id == null} ? '항공 등록' : '항공 상세'">항공 상세
      </h1>
      <p class="mt-2 text-sm text-gray-700"
        th:text="${air.id == null} ? '새로운 항공편을 등록합니다.' : '항공편 정보를 확인하고 수정할 수 있습니다.'">항공편 정보를 확인하고 수정할 수 있습니다.</p>
    </div>
    <div class="mt-4 sm:ml-16 sm:mt-0 sm:flex-none" th:if="${air.id != null}">
      <button th:onclick="deleteAir([[${air.id}]])"
        class="inline-flex items-center rounded-md bg-red-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-red-500">
        <i class="fas fa-trash -ml-0.5 mr-1.5 h-4 w-4"></i>
        삭제
      </button>
    </div>
  </div>

  <!-- 에러 메시지 표시 -->
  <div th:if="${error}" class="mt-4 rounded-md bg-red-50 p-4">
    <div class="flex">
      <div class="flex-shrink-0">
        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
      </div>
      <div class="ml-3">
        <p class="text-sm font-medium text-red-800" th:text="${error}">오류 메시지</p>
      </div>
    </div>
  </div>

  <form th:object="${air}" th:action="${air.id == null} ? @{/air/new} : @{/air/{id}(id=${air.id})}" method="post"
    class="mt-6 space-y-8">
    <!-- 기본 정보 -->
    <div class="bg-white shadow rounded-lg">
      <div class="px-4 py-5 sm:p-6">
        <h3 class="text-base font-semibold leading-6 text-gray-900 mb-4">기본 정보</h3>

        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
          <div th:if="${air.id != null}">
            <label class="block text-sm font-medium leading-6 text-gray-900">ID</label>
            <input type="text" th:field="*{id}" readonly
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-500 shadow-sm ring-1 ring-inset ring-gray-300 bg-gray-50 sm:text-sm sm:leading-6" />
          </div>

          <div>
            <label class="block text-sm font-medium leading-6 text-gray-900">항공편 코드</label>
            <input type="text" th:field="*{flightNumber}" required
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
          </div>

          <div>
            <label for="airlineCode" class="block text-sm font-medium leading-6 text-gray-900">항공사</label>
            <select id="airlineCode" th:field="*{airline.code}" required
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6">
              <option value="" disabled>-- 항공사 선택 --</option>
              <option th:each="airline : ${allAirlines}" th:value="${airline.code}"
                th:text="${airline.nameKor} + ' (' + ${airline.code} + ')'"></option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium leading-6 text-gray-900">비행 유형</label>
            <input type="text" th:field="*{flightType}" readonly
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-500 shadow-sm ring-1 ring-inset ring-gray-300 bg-gray-50 sm:text-sm sm:leading-6" />
          </div>

          <div>
            <label class="block text-sm font-medium leading-6 text-gray-900">상태</label>
            <select th:field="*{status}"
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6">
              <option value="ACTIVE" th:selected="${air.status == T(renewal.common.entity.Air.AirStatus).ACTIVE}">활성</option>
              <option value="INACTIVE" th:selected="${air.status == T(renewal.common.entity.Air.AirStatus).INACTIVE}">비활성</option>
              <option value="HIDDEN" th:selected="${air.status == T(renewal.common.entity.Air.AirStatus).HIDDEN}">숨김</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium leading-6 text-gray-900">경유 횟수</label>
            <input type="number" th:field="*{stopovers}" id="stopovers" min="0" readonly
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-500 shadow-sm ring-1 ring-inset ring-gray-300 bg-gray-50 sm:text-sm sm:leading-6" />
          </div>
        </div>
      </div>
    </div>

    <!-- 출발/도착 정보 -->
    <div class="bg-white shadow rounded-lg">
      <div class="px-4 py-5 sm:p-6">
        <h3 class="text-base font-semibold leading-6 text-gray-900 mb-4">출발/도착 정보</h3>

        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
          <!-- 출발지 -->
          <div>
            <label class="block text-sm font-medium leading-6 text-gray-900">출발지</label>
            <input type="text" th:field="*{departAirport.airportCode}" list="airportList"
              onchange="stripAfterPipe(this);syncFirstLastReadonly(false)" required
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6"
              placeholder="출발지 입력" />
          </div>

          <!-- 도착지 -->
          <div>
            <label class="block text-sm font-medium leading-6 text-gray-900">도착지</label>
            <input type="text" th:field="*{arriveAirport.airportCode}" list="airportList"
              onchange="stripAfterPipe(this);syncFirstLastReadonly(false)" required
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6"
              placeholder="도착지 입력" />
          </div>

          <!-- 출발 터미널 -->
          <div>
            <label class="block text-sm font-medium leading-6 text-gray-900">출발지 터미널</label>
            <input type="text" th:field="*{departTerminal}" onchange="syncFirstLastReadonly(false)" required
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
          </div>

          <!-- 도착 터미널 -->
          <div>
            <label class="block text-sm font-medium leading-6 text-gray-900">도착지 터미널</label>
            <input type="text" th:field="*{arriveTerminal}" onchange="syncFirstLastReadonly(false)" required
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
          </div>

          <!-- 출발 일시 -->
          <div>
            <label class="block text-sm font-medium leading-6 text-gray-900">출발 일시</label>
            <input type="datetime-local" th:field="*{departDateTime}" onchange="syncFirstLastReadonly(false)" required
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
          </div>

          <!-- 도착 일시 -->
          <div>
            <label class="block text-sm font-medium leading-6 text-gray-900">도착 일시</label>
            <input type="datetime-local" th:field="*{arriveDateTime}" onchange="syncFirstLastReadonly(false)" required
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
          </div>

          <!-- 비행 시간 (분) -->
          <div>
            <label class="block text-sm font-medium leading-6 text-gray-900">총 비행시간</label>
            <input type="number" th:field="*{flightDuration}" readonly
              class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-500 shadow-sm ring-1 ring-inset ring-gray-300 bg-gray-50 sm:text-sm sm:leading-6" />
          </div>
        </div>
      </div>
    </div>

    <!-- 경유지 정보 -->
    <div class="bg-white shadow rounded-lg">
      <div class="px-4 py-5 sm:p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-base font-semibold leading-6 text-gray-900">경유지 정보</h3>
          <button type="button" onclick="addSegment()"
            class="inline-flex items-center rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500">
            <i class="fas fa-plus -ml-0.5 mr-1.5 h-4 w-4"></i>
            세그먼트 추가
          </button>
        </div>

        <div id="segmentContainer" class="space-y-4">
          <div th:each="seg, iterStat : *{flightSegments}" class="segment-entry border rounded-lg p-4">
            <div class="flex items-center justify-between mb-3">
              <h4 class="text-sm font-medium text-gray-900">구간 <span th:text="${iterStat.index + 1}">1</span></h4>
              <button type="button" th:if="${iterStat.index > 0}" onclick="removeSegment(this)"
                class="inline-flex items-center rounded-md bg-red-600 px-2 py-1 text-xs font-semibold text-white shadow-sm hover:bg-red-500">
                <i class="fas fa-trash h-3 w-3"></i>
              </button>
            </div>

            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
              <!-- 출발 공항 -->
              <div>
                <label class="block text-xs font-medium text-gray-700">출발 공항</label>
                <input type="text" th:field="*{flightSegments[__${iterStat.index}__].departAirport}" list="airportList"
                  onchange="stripAfterPipe(this);onAirportChange(this)" required th:readonly="${iterStat.index == 0}"
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6"
                  placeholder="출발 공항 입력" />
              </div>

              <!-- 도착 공항 -->
              <div>
                <label class="block text-xs font-medium text-gray-700">도착 공항</label>
                <input type="text" th:field="*{flightSegments[__${iterStat.index}__].arriveAirport}" list="airportList"
                  onchange="stripAfterPipe(this);onAirportChange(this)" required
                  th:readonly="${iterStat.index == (air.flightSegments.size() - 1)}"
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6"
                  placeholder="도착 공항 입력" />
              </div>

              <!-- 출발 터미널 -->
              <div>
                <label class="block text-xs font-medium text-gray-700">출발 터미널</label>
                <input type="text" th:field="*{flightSegments[__${iterStat.index}__].departTerminal}" required
                  th:readonly="${iterStat.index == 0}"
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
              </div>

              <!-- 도착 터미널 -->
              <div>
                <label class="block text-xs font-medium text-gray-700">도착 터미널</label>
                <input type="text" th:field="*{flightSegments[__${iterStat.index}__].arriveTerminal}" required
                  th:readonly="${iterStat.index == (air.flightSegments.size() - 1)}"
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
              </div>

              <!-- 출발 일시 -->
              <div>
                <label class="block text-xs font-medium text-gray-700">출발 일시</label>
                <input type="datetime-local" th:field="*{flightSegments[__${iterStat.index}__].departDateTime}" required
                  th:readonly="${iterStat.index == 0}"
                  onchange="validateSegmentDateTime(this)"
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
                <p class="text-xs text-red-600 mt-1 hidden" th:attr="data-error='depart'"></p>
              </div>

              <!-- 도착 일시 -->
              <div>
                <label class="block text-xs font-medium text-gray-700">도착 일시</label>
                <input type="datetime-local" th:field="*{flightSegments[__${iterStat.index}__].arriveDateTime}" required
                  th:readonly="${iterStat.index == (air.flightSegments.size() - 1)}"
                  onchange="validateSegmentDateTime(this)"
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
                <p class="text-xs text-red-600 mt-1 hidden" th:attr="data-error='arrive'"></p>
              </div>

              <!-- 비행 시간 -->
              <div>
                <label class="block text-xs font-medium text-gray-700">비행 시간(분)</label>
                <input type="number" th:field="*{flightSegments[__${iterStat.index}__].flightDuration}" min="0"
                  placeholder='등록완료시 계산' readonly
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-500 shadow-sm ring-1 ring-inset ring-gray-300 bg-gray-50 sm:text-sm sm:leading-6" />
              </div>

              <!-- 대기 시간 -->
              <div>
                <label class="block text-xs font-medium text-gray-700">대기 시간(분)</label>
                <input type="number" th:field="*{flightSegments[__${iterStat.index}__].waitDuration}"
                  placeholder='등록완료시 계산' readonly
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-500 shadow-sm ring-1 ring-inset ring-gray-300 bg-gray-50 sm:text-sm sm:leading-6" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 좌석 등급 정보 -->
    <div class="bg-white shadow rounded-lg">
      <div class="px-4 py-5 sm:p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-base font-semibold leading-6 text-gray-900">좌석 등급 정보</h3>
          <div class="text-sm text-gray-600" th:if="${air.id == null}">등록할 좌석 등급을 선택하세요</div>
        </div>
        
        <!-- 좌석 등급 선택 체크박스 (새 항공 등록 시에만 표시) -->
        <div th:if="${air.id == null}" class="mb-6 p-4 bg-gray-50 rounded-lg">
          <label class="block text-sm font-medium text-gray-700 mb-2">좌석 등급 선택</label>
          <div class="flex flex-wrap gap-4">
            <label th:each="seatType : ${seatClassTypes}" class="flex items-center">
              <input type="checkbox" 
                     th:value="${seatType.name()}" 
                     th:id="'seatTypeCheck_' + ${seatType.name()}"
                     th:checked="${air.id != null && air.seatClasses != null && air.seatClasses.?[classType == seatType].size() > 0}"
                     onchange="toggleSeatClass(this)"
                     class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
              <span class="ml-2 text-sm text-gray-700" 
                    th:text="${seatType.name() == 'ECONOMY' ? '이코노미' : (seatType.name() == 'PREMIUMECONOMY' ? '프리미엄 이코노미' : (seatType.name() == 'BUSINESS' ? '비즈니스' : '퍼스트'))}">등급</span>
            </label>
          </div>
        </div>

        <div class="space-y-4">
          <div th:each="seat, iterStat : ${air.seatClasses}" 
               th:attr="data-seat-type=${seat.classType?.name()}"
               th:class="${air.id == null ? 'seat-class-entry border rounded-lg p-4' : 'border rounded-lg p-4'}"
               th:style="${air.id == null ? 'display: none;' : ''}">
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
              <div>
                <label class="block text-sm font-medium text-gray-700">등급</label>
                <input type="text" th:field="*{seatClasses[__${iterStat.index}__].classType}" readonly
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-500 shadow-sm ring-1 ring-inset ring-gray-300 bg-gray-50 sm:text-sm sm:leading-6" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">가격[성인]</label>
                <input type="number" 
                  th:field="*{seatClasses[__${iterStat.index}__].priceAdult}" 
                  th:id="'priceAdult_' + ${iterStat.index}"
                  min="0" 
                  max="100000000"
                  required
                  oninput="removeLeadingZeros(this); validatePriceLimit(this)"
                  onblur="removeLeadingZeros(this); validatePriceLimit(this)"
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
                <p th:id="'priceAdultError_' + ${iterStat.index}" class="text-xs text-red-600 mt-1 hidden">가격은 1억원을 넘을 수 없습니다.</p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">가격[청소년]</label>
                <input type="number" 
                  th:field="*{seatClasses[__${iterStat.index}__].priceYouth}" 
                  th:id="'priceYouth_' + ${iterStat.index}"
                  min="0" 
                  max="100000000"
                  required
                  oninput="removeLeadingZeros(this); validatePriceLimit(this)"
                  onblur="removeLeadingZeros(this); validatePriceLimit(this)"
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
                <p th:id="'priceYouthError_' + ${iterStat.index}" class="text-xs text-red-600 mt-1 hidden">가격은 1억원을 넘을 수 없습니다.</p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">가격[영유아]</label>
                <input type="number" 
                  th:field="*{seatClasses[__${iterStat.index}__].priceInfant}" 
                  th:id="'priceInfant_' + ${iterStat.index}"
                  min="0" 
                  max="100000000"
                  required
                  oninput="removeLeadingZeros(this); validatePriceLimit(this)"
                  onblur="removeLeadingZeros(this); validatePriceLimit(this)"
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
                <p th:id="'priceInfantError_' + ${iterStat.index}" class="text-xs text-red-600 mt-1 hidden">가격은 1억원을 넘을 수 없습니다.</p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">최대 좌석 수</label>
                <input type="number" 
                  th:field="*{seatClasses[__${iterStat.index}__].maxSeats}" 
                  th:id="'maxSeats_' + ${iterStat.index}"
                  min="0" 
                  max="1000"
                  required
                  oninput="validateMaxSeatsLimit(this); validateAvailableSeatsForMaxSeats(this)"
                  onblur="validateMaxSeatsLimit(this); validateAvailableSeatsForMaxSeats(this)"
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
                <p th:id="'maxSeatsError_' + ${iterStat.index}" class="text-xs text-red-600 mt-1 hidden">최대 좌석 수는 1000을 넘을 수 없습니다.</p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">잔여 좌석 수</label>
                <input type="number" 
                  th:field="*{seatClasses[__${iterStat.index}__].availableSeats}" 
                  th:id="'availableSeats_' + ${iterStat.index}"
                  min="0" 
                  required
                  oninput="validateAvailableSeats(this)"
                  onblur="adjustAvailableSeats(this); validateAvailableSeats(this)"
                  class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6" />
                <p th:id="'availableSeatsError_' + ${iterStat.index}" class="text-xs text-red-600 mt-1 hidden">잔여 좌석 수는 최대 좌석 수를 넘을 수 없습니다.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 저장 버튼 -->
    <div class="mt-6 flex items-center justify-end gap-x-6">
      <button type="button" onclick="location.href='/air'"
        class="text-sm font-semibold leading-6 text-gray-900">취소</button>
      <button type="submit" th:text="${air.id == null} ? '등록' : '수정'"
        class="rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"></button>
    </div>
  </form>

  <div th:replace="components/datalist/airportList :: airportDatalistFragment"></div>


  <script>

    function deleteAir(id) {
      if (confirm('정말로 삭제하시겠습니까?')) {
        fetch('/air/' + id, { method: 'DELETE' })
          .then(res => res.ok ? location.href = '/air' : alert('삭제 실패'));
      }
    }

    function addSegment() {
      const container = document.getElementById('segmentContainer');
      const segmentIdx = document.querySelectorAll('.segment-entry').length;

      const wrapper = document.createElement('div');
      wrapper.className = 'segment-entry border rounded-lg p-4';
      wrapper.style.marginBottom = '1rem';

      // 헤더
      const header = document.createElement('div');
      header.className = 'flex items-center justify-between mb-3';

      const title = document.createElement('h4');
      title.className = 'text-sm font-medium text-gray-900';
      title.textContent = `구간 ${segmentIdx + 1}`;
      header.appendChild(title);

      if (segmentIdx > 0) {
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'inline-flex items-center rounded-md bg-red-600 px-2 py-1 text-xs font-semibold text-white shadow-sm hover:bg-red-500';
        removeBtn.innerHTML = '<i class="fas fa-trash h-3 w-3"></i>';
        removeBtn.addEventListener('click', () => {
          wrapper.remove();
          reindexSegments();
          syncFirstLastReadonly();
          updateStopovers();
        });
        header.appendChild(removeBtn);
      }
      wrapper.appendChild(header);

      // 폼 필드들
      const fieldsContainer = document.createElement('div');
      fieldsContainer.className = 'grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4';

      // 출발 공항
      const departAirDiv = createFieldDiv('출발 공항', 'text');
      const departInput = createInput('text', `flightSegments[${segmentIdx}].departAirport`, true);
      departInput.setAttribute('list', 'airportList');
      departInput.placeholder = '출발 공항 입력';
      departInput.onchange = function () { stripAfterPipe(this); onAirportChange(this); };
      departAirDiv.appendChild(departInput);
      fieldsContainer.appendChild(departAirDiv);

      // 도착 공항
      const arriveAirDiv = createFieldDiv('도착 공항', 'text');
      const arriveInput = createInput('text', `flightSegments[${segmentIdx}].arriveAirport`, true);
      arriveInput.setAttribute('list', 'airportList');
      arriveInput.placeholder = '도착 공항 입력';
      arriveInput.onchange = function () { stripAfterPipe(this); onAirportChange(this); };
      arriveAirDiv.appendChild(arriveInput);
      fieldsContainer.appendChild(arriveAirDiv);

      // 출발 터미널
      const departTermDiv = createFieldDiv('출발 터미널', 'text');
      const departTermInput = createInput('text', `flightSegments[${segmentIdx}].departTerminal`, true);
      departTermDiv.appendChild(departTermInput);
      fieldsContainer.appendChild(departTermDiv);

      // 도착 터미널
      const arriveTermDiv = createFieldDiv('도착 터미널', 'text');
      const arriveTermInput = createInput('text', `flightSegments[${segmentIdx}].arriveTerminal`, true);
      arriveTermDiv.appendChild(arriveTermInput);
      fieldsContainer.appendChild(arriveTermDiv);

      // 출발 일시
      const departTimeDiv = createFieldDiv('출발 일시', 'datetime-local');
      const departTimeInput = createInput('datetime-local', `flightSegments[${segmentIdx}].departDateTime`, true);
      departTimeInput.addEventListener('change', function() {
        validateSegmentDateTime(this);
      });
      departTimeDiv.appendChild(departTimeInput);
      // 에러 메시지 영역 추가
      const departTimeError = document.createElement('p');
      departTimeError.className = 'text-xs text-red-600 mt-1 hidden';
      departTimeError.setAttribute('data-error', 'depart');
      departTimeDiv.appendChild(departTimeError);
      fieldsContainer.appendChild(departTimeDiv);

      // 도착 일시
      const arriveTimeDiv = createFieldDiv('도착 일시', 'datetime-local');
      const arriveTimeInput = createInput('datetime-local', `flightSegments[${segmentIdx}].arriveDateTime`, true);
      arriveTimeInput.addEventListener('change', function() {
        validateSegmentDateTime(this);
      });
      arriveTimeDiv.appendChild(arriveTimeInput);
      // 에러 메시지 영역 추가
      const arriveTimeError = document.createElement('p');
      arriveTimeError.className = 'text-xs text-red-600 mt-1 hidden';
      arriveTimeError.setAttribute('data-error', 'arrive');
      arriveTimeDiv.appendChild(arriveTimeError);
      fieldsContainer.appendChild(arriveTimeDiv);

      // 비행 시간
      const flightDurationDiv = createFieldDiv('비행 시간(분)', 'number');
      const flightDurationInput = createInput('number', `flightSegments[${segmentIdx}].flightDuration`, false);
      flightDurationInput.min = 0;
      flightDurationInput.readOnly = true;
      flightDurationInput.placeholder = '등록완료시 계산';
      flightDurationDiv.appendChild(flightDurationInput);
      fieldsContainer.appendChild(flightDurationDiv);

      // 대기 시간
      const waitDurationDiv = createFieldDiv('대기 시간(분)', 'number');
      const waitDurationInput = createInput('number', `flightSegments[${segmentIdx}].waitDuration`, false);
      waitDurationInput.placeholder = '등록완료시 계산';
      waitDurationInput.readOnly = true;
      waitDurationDiv.appendChild(waitDurationInput);
      fieldsContainer.appendChild(waitDurationDiv);

      wrapper.appendChild(fieldsContainer);
      container.appendChild(wrapper);

      syncFirstLastReadonly();
      updateStopovers();
      
      // 새로 추가된 구간에 날짜 유효성 검사 이벤트 리스너 추가
      attachDateTimeValidation();
    }

    function createFieldDiv(labelText, inputType) {
      const div = document.createElement('div');
      const label = document.createElement('label');
      label.className = 'block text-xs font-medium text-gray-700';
      label.textContent = labelText;
      div.appendChild(label);
      return div;
    }

    function createInput(type, name, required) {
      const input = document.createElement('input');
      input.type = type;
      input.name = name;
      input.required = required;
      input.className = 'mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6';
      return input;
    }

    // 세그먼트 삭제
    function removeSegment(button) {
      const wrapper = button.closest('.segment-entry');
      wrapper.remove();
      reindexSegments();
      syncFirstLastReadonly();
      updateStopovers();
    }

    // 재인덱싱
    function reindexSegments() {
      const container = document.getElementById('segmentContainer');
      container.querySelectorAll('.segment-entry').forEach((entry, i) => {
        entry.querySelectorAll('input[name]').forEach(input => {
          input.name = input.name.replace(/\[\d+\]/g, `[${i}]`);
        });
      });
    }

    // 첫/마지막 segment의 출발·도착 정보를 기본 출발·도착으로 동기화 & readonly
    function syncFirstLastReadonly(reset = true) {
      const entries = document.querySelectorAll('#segmentContainer .segment-entry');

      // 마지막 전 segment의 도착 정보 초기화
      if (reset && entries.length > 1) {
        const lastBefore = entries[entries.length - 2];
        if (lastBefore) {
          const arriveAirPrev = lastBefore.querySelector('input[name$=".arriveAirport"]');
          const arriveTimePrev = lastBefore.querySelector('input[name$=".arriveDateTime"]');
          const arriveTermPrev = lastBefore.querySelector('input[name$=".arriveTerminal"]');
          if (arriveAirPrev) arriveAirPrev.value = '';
          if (arriveTimePrev) arriveTimePrev.value = '';
          if (arriveTermPrev) arriveTermPrev.value = '';
        }
      }

      entries.forEach((entry, idx) => {
        const departAir = entry.querySelector('input[name$=".departAirport"]');
        const departTime = entry.querySelector('input[name$=".departDateTime"]');
        const departTerm = entry.querySelector('input[name$=".departTerminal"]');

        const arriveAir = entry.querySelector('input[name$=".arriveAirport"]');
        const arriveTime = entry.querySelector('input[name$=".arriveDateTime"]');
        const arriveTerm = entry.querySelector('input[name$=".arriveTerminal"]');

        if (idx === 0) {
          departAir.readOnly = true;
          departTime.readOnly = true;
          departTerm.readOnly = true;

          departAir.value = document.querySelector('[name="departAirport.airportCode"]').value;
          departTime.value = document.querySelector('[name="departDateTime"]').value;
          departTerm.value = document.querySelector('[name="departTerminal"]').value;
        } else {
          departAir.readOnly = false;
          departTime.readOnly = false;
          departTerm.readOnly = false;
        }

        if (idx === entries.length - 1) {
          arriveAir.readOnly = true;
          arriveTime.readOnly = true;
          arriveTerm.readOnly = true;
          arriveAir.value = document.querySelector('[name="arriveAirport.airportCode"]').value;
          arriveTime.value = document.querySelector('[name="arriveDateTime"]').value;
          arriveTerm.value = document.querySelector('[name="arriveTerminal"]').value;
        } else {
          arriveAir.readOnly = false;
          arriveTime.readOnly = false;
          arriveTerm.readOnly = false;
        }
      });
    }

    function onAirportChange(input) {
      const container = document.getElementById('segmentContainer');
      const entries = Array.from(container.querySelectorAll('.segment-entry'));
      const currentSegment = input.closest('.segment-entry');
      const idx = entries.indexOf(currentSegment);

      if (input.name.endsWith('.departAirport')) {
        // 출발공항 input 변경 → 이전 segment 도착공항 수정
        if (idx > 0) {
          const prevSegment = entries[idx - 1];
          const prevArriveInput = prevSegment.querySelector('input[name$=".arriveAirport"]');
          prevArriveInput.value = input.value;
        }
      } else if (input.name.endsWith('.arriveAirport')) {
        // 도착공항 input 변경 → 다음 segment 출발공항 수정
        if (idx < entries.length - 1) {
          const nextSegment = entries[idx + 1];
          const nextDepartInput = nextSegment.querySelector('input[name$=".departAirport"]');
          nextDepartInput.value = input.value;
        }
      }
    }

    // stopovers 반영
    function updateStopovers() {
      const stopoversInput = document.getElementById('stopovers');
      const count = document.querySelectorAll('#segmentContainer .segment-entry').length;
      stopoversInput.value = count > 0 ? count - 1 : 0;
    }

    // 페이지 로딩 시 segment 없으면 기본 추가
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('segmentContainer');
      const airIdInput = document.getElementById('id');
      if (container && (!airIdInput || !airIdInput.value)) {
        addSegment();
      }
      // 기존 구간에 이벤트 리스너 추가
      attachDateTimeValidation();
    });

    // 구간의 출발일시와 도착일시 유효성 검사
    function validateSegmentDateTime(input) {
      const segmentEntry = input.closest('.segment-entry');
      const container = document.getElementById('segmentContainer');
      const allSegments = Array.from(container.querySelectorAll('.segment-entry'));
      const currentIndex = allSegments.indexOf(segmentEntry);

      const departTimeInput = segmentEntry.querySelector('input[name$=".departDateTime"]');
      const arriveTimeInput = segmentEntry.querySelector('input[name$=".arriveDateTime"]');
      const departTimeError = segmentEntry.querySelector('[data-error="depart"]');
      const arriveTimeError = segmentEntry.querySelector('[data-error="arrive"]');

      // 에러 메시지 초기화
      if (departTimeError) {
        departTimeError.classList.add('hidden');
        departTimeError.textContent = '';
      }
      if (arriveTimeError) {
        arriveTimeError.classList.add('hidden');
        arriveTimeError.textContent = '';
      }
      if (departTimeInput) {
        departTimeInput.classList.remove('border-red-500', 'ring-red-500');
      }
      if (arriveTimeInput) {
        arriveTimeInput.classList.remove('border-red-500', 'ring-red-500');
      }

      const departTime = departTimeInput ? departTimeInput.value : null;
      const arriveTime = arriveTimeInput ? arriveTimeInput.value : null;

      let hasError = false;

      // 1. 같은 구간 내에서 도착일시가 출발일시보다 이후여야 함
      if (departTime && arriveTime) {
        const depart = new Date(departTime);
        const arrive = new Date(arriveTime);
        
        if (arrive <= depart) {
          if (arriveTimeError) {
            arriveTimeError.textContent = '도착 일시는 출발 일시보다 이후여야 합니다.';
            arriveTimeError.classList.remove('hidden');
          }
          if (arriveTimeInput) {
            arriveTimeInput.classList.add('border-red-500', 'ring-red-500');
          }
          hasError = true;
        }
      }

      // 2. 이전 구간과의 관계 검증 (현재 구간의 출발일시가 이전 구간의 도착일시보다 이후여야 함)
      if (currentIndex > 0 && departTime) {
        const prevSegment = allSegments[currentIndex - 1];
        const prevArriveTimeInput = prevSegment.querySelector('input[name$=".arriveDateTime"]');
        if (prevArriveTimeInput && prevArriveTimeInput.value) {
          const prevArrive = new Date(prevArriveTimeInput.value);
          const currentDepart = new Date(departTime);
          
          if (currentDepart <= prevArrive) {
            if (departTimeError) {
              departTimeError.textContent = '출발 일시는 이전 구간의 도착 일시보다 이후여야 합니다.';
              departTimeError.classList.remove('hidden');
            }
            if (departTimeInput) {
              departTimeInput.classList.add('border-red-500', 'ring-red-500');
            }
            hasError = true;
          }
        }
      }

      // 3. 다음 구간과의 관계 검증 (다음 구간의 출발일시가 현재 구간의 도착일시보다 이후여야 함)
      if (currentIndex < allSegments.length - 1 && arriveTime) {
        const nextSegment = allSegments[currentIndex + 1];
        const nextDepartTimeInput = nextSegment.querySelector('input[name$=".departDateTime"]');
        if (nextDepartTimeInput && nextDepartTimeInput.value) {
          const currentArrive = new Date(arriveTime);
          const nextDepart = new Date(nextDepartTimeInput.value);
          
          if (nextDepart <= currentArrive) {
            if (arriveTimeError) {
              arriveTimeError.textContent = '도착 일시는 다음 구간의 출발 일시보다 이전이어야 합니다.';
              arriveTimeError.classList.remove('hidden');
            }
            if (arriveTimeInput) {
              arriveTimeInput.classList.add('border-red-500', 'ring-red-500');
            }
            hasError = true;
          }
        }
      }

      return !hasError;
    }

    // 기존 구간에 날짜 유효성 검사 이벤트 리스너 추가
    function attachDateTimeValidation() {
      const container = document.getElementById('segmentContainer');
      if (!container) return;
      
      container.querySelectorAll('input[name$=".departDateTime"], input[name$=".arriveDateTime"]').forEach(input => {
        if (!input.hasAttribute('data-validated')) {
          input.addEventListener('change', function() {
            validateSegmentDateTime(this);
          });
          input.setAttribute('data-validated', 'true');
        }
      });
    }

    // 잔여 좌석 수 검증 (최대 좌석 수를 넘지 않도록)
    function validateAvailableSeats(input) {
      const index = input.id.replace('availableSeats_', '');
      const maxSeatsInput = document.getElementById('maxSeats_' + index);
      const errorElement = document.getElementById('availableSeatsError_' + index);
      
      if (!maxSeatsInput || !errorElement) return true;
      
      const availableSeats = parseInt(input.value) || 0;
      const maxSeats = parseInt(maxSeatsInput.value) || 0;
      
      // 최대 좌석 수가 0이거나 입력되지 않은 경우는 검증하지 않음
      if (maxSeats <= 0) {
        input.classList.remove('border-red-500', 'ring-red-500');
        errorElement.classList.add('hidden');
        return true;
      }
      
      // 잔여 좌석 수가 최대 좌석 수를 넘는 경우
      if (availableSeats > maxSeats) {
        input.classList.add('border-red-500', 'ring-red-500');
        errorElement.classList.remove('hidden');
        errorElement.textContent = `잔여 좌석 수는 최대 좌석 수(${maxSeats})를 넘을 수 없습니다.`;
        return false;
      } else {
        input.classList.remove('border-red-500', 'ring-red-500');
        errorElement.classList.add('hidden');
        return true;
      }
    }
    
    // 최대 좌석 수 1000 제한 검증
    function validateMaxSeatsLimit(input) {
      const index = input.id.replace('maxSeats_', '');
      const errorElement = document.getElementById('maxSeatsError_' + index);
      
      if (!errorElement) return true;
      
      const maxSeats = parseInt(input.value) || 0;
      
      // 최대 좌석 수가 1000을 넘는 경우
      if (maxSeats > 1000) {
        input.classList.add('border-red-500', 'ring-red-500');
        errorElement.classList.remove('hidden');
        // 자동으로 1000으로 조정
        input.value = 1000;
        return false;
      } else {
        input.classList.remove('border-red-500', 'ring-red-500');
        errorElement.classList.add('hidden');
        return true;
      }
    }
    
    // 최대 좌석 수 변경 시 잔여 좌석 수 검증 및 자동 조정
    function validateAvailableSeatsForMaxSeats(input) {
      const index = input.id.replace('maxSeats_', '');
      const availableSeatsInput = document.getElementById('availableSeats_' + index);
      
      if (availableSeatsInput) {
        const maxSeats = parseInt(input.value) || 0;
        const availableSeats = parseInt(availableSeatsInput.value) || 0;
        
        // 최대 좌석 수가 변경되었을 때, 잔여 좌석 수가 최대 좌석 수를 넘으면 자동으로 조정
        if (maxSeats > 0 && availableSeats > maxSeats) {
          availableSeatsInput.value = maxSeats;
          // 조정 후 검증 수행
          validateAvailableSeats(availableSeatsInput);
        } else {
          validateAvailableSeats(availableSeatsInput);
        }
      }
    }
    
    // 잔여 좌석 수 입력 시 자동 조정 (blur 이벤트에서)
    function adjustAvailableSeats(input) {
      const index = input.id.replace('availableSeats_', '');
      const maxSeatsInput = document.getElementById('maxSeats_' + index);
      
      if (!maxSeatsInput) return;
      
      const maxSeats = parseInt(maxSeatsInput.value) || 0;
      const availableSeats = parseInt(input.value) || 0;
      
      // 최대 좌석 수가 설정되어 있고, 잔여 좌석 수가 최대 좌석 수를 넘으면 자동 조정
      if (maxSeats > 0 && availableSeats > maxSeats) {
        input.value = maxSeats;
        // 조정 후 검증 수행
        validateAvailableSeats(input);
      }
    }
    
    // 앞의 0 제거 함수 (가격, 좌석 수 입력 필드용)
    function removeLeadingZeros(input) {
      if (input.value && input.value.trim() !== '') {
        // 숫자로 변환하여 앞의 0 제거
        const numValue = parseInt(input.value, 10);
        if (!isNaN(numValue)) {
          input.value = numValue.toString();
        } else {
          // 숫자가 아닌 경우 빈 문자열로 설정
          input.value = '';
        }
      }
    }
    
    // 가격 1억원 제한 검증
    function validatePriceLimit(input) {
      const maxPrice = 100000000; // 1억원
      const price = parseInt(input.value) || 0;
      const inputId = input.id;
      const errorElementId = inputId.replace(/_/, '_Error_');
      const errorElement = document.getElementById(errorElementId);
      
      if (!errorElement) return true;
      
      // 가격이 1억원을 넘는 경우
      if (price > maxPrice) {
        input.classList.add('border-red-500', 'ring-red-500');
        errorElement.classList.remove('hidden');
        // 자동으로 1억원으로 조정
        input.value = maxPrice;
        return false;
      } else {
        input.classList.remove('border-red-500', 'ring-red-500');
        errorElement.classList.add('hidden');
        return true;
      }
    }

    // 좌석 등급 체크박스 토글
    function toggleSeatClass(checkbox) {
      const seatType = checkbox.value;
      const seatClassEntries = document.querySelectorAll('.seat-class-entry');
      
      seatClassEntries.forEach(entry => {
        const entrySeatType = entry.getAttribute('data-seat-type');
        if (entrySeatType === seatType) {
          if (checkbox.checked) {
            entry.style.display = 'block';
            // 필수 필드 활성화
            entry.querySelectorAll('input').forEach(input => {
              if (input.name && (input.name.includes('priceAdult') || input.name.includes('priceYouth') || 
                  input.name.includes('priceInfant') || input.name.includes('maxSeats') || 
                  input.name.includes('availableSeats'))) {
                input.required = true;
                input.disabled = false;
              }
            });
          } else {
            entry.style.display = 'none';
            // 필수 필드 비활성화 및 값 초기화 (제출 시 제외하기 위해)
            entry.querySelectorAll('input').forEach(input => {
              if (input.name && (input.name.includes('priceAdult') || input.name.includes('priceYouth') || 
                  input.name.includes('priceInfant') || input.name.includes('maxSeats') || 
                  input.name.includes('availableSeats'))) {
                input.required = false;
                input.disabled = true;
                // 값 초기화
                if (input.type === 'number') {
                  input.value = '';
                }
              }
            });
          }
        }
      });
    }
    
    // 페이지 로드 시 체크박스 상태에 따라 좌석 등급 섹션 표시/숨김
    document.addEventListener('DOMContentLoaded', function() {
      const checkboxes = document.querySelectorAll('input[type="checkbox"][id^="seatTypeCheck_"]');
      checkboxes.forEach(checkbox => {
        toggleSeatClass(checkbox);
      });
    });
    
    // 폼 제출 시 모든 구간의 날짜 유효성 검사 및 좌석 수 검증
    document.querySelector('form').addEventListener('submit', function(e) {
      const container = document.getElementById('segmentContainer');
      let isValid = true;
      
      // 선택되지 않은 SeatClass의 입력 필드 비활성화 (제출 시 제외)
      const checkboxes = document.querySelectorAll('input[type="checkbox"][id^="seatTypeCheck_"]:not(:checked)');
      const seatClassEntries = document.querySelectorAll('.seat-class-entry');
      
      checkboxes.forEach(checkbox => {
        const seatType = checkbox.value;
        seatClassEntries.forEach(entry => {
          const entrySeatType = entry.getAttribute('data-seat-type');
          if (entrySeatType === seatType) {
            // 선택되지 않은 SeatClass의 모든 입력 필드를 비활성화하여 제출되지 않도록 함
            entry.querySelectorAll('input').forEach(input => {
              input.disabled = true;
            });
          }
        });
      });
      
      // 구간 날짜 유효성 검사
      if (container) {
        const allSegments = container.querySelectorAll('.segment-entry');
        
        allSegments.forEach(segment => {
          const departTimeInput = segment.querySelector('input[name$=".departDateTime"]');
          const arriveTimeInput = segment.querySelector('input[name$=".arriveDateTime"]');
          
          if (departTimeInput && !validateSegmentDateTime(departTimeInput)) {
            isValid = false;
          }
          if (arriveTimeInput && !validateSegmentDateTime(arriveTimeInput)) {
            isValid = false;
          }
        });
      }
      
      // 좌석 수 유효성 검사 (표시된 SeatClass만)
      const visibleSeatClassEntries = document.querySelectorAll('.seat-class-entry[style*="block"], .seat-class-entry:not([style*="none"])');
      let seatValidationErrors = [];
      visibleSeatClassEntries.forEach(entry => {
        const availableSeatsInput = entry.querySelector('input[id^="availableSeats_"]');
        const maxSeatsInput = entry.querySelector('input[id^="maxSeats_"]');
        
        if (maxSeatsInput) {
          // 최대 좌석 수 1000 제한 검증
          if (!validateMaxSeatsLimit(maxSeatsInput)) {
            isValid = false;
            seatValidationErrors.push('최대 좌석 수는 1000을 넘을 수 없습니다.');
          }
        }
        
        if (availableSeatsInput && maxSeatsInput) {
          const availableSeats = parseInt(availableSeatsInput.value) || 0;
          const maxSeats = parseInt(maxSeatsInput.value) || 0;
          
          if (maxSeats > 0 && availableSeats > maxSeats) {
            isValid = false;
            // 자동으로 최대 좌석 수로 조정
            availableSeatsInput.value = maxSeats;
            validateAvailableSeats(availableSeatsInput);
            seatValidationErrors.push(`잔여 좌석 수가 최대 좌석 수를 초과하여 ${maxSeats}로 조정되었습니다.`);
          } else if (!validateAvailableSeats(availableSeatsInput)) {
            isValid = false;
          }
        }
      });
      
      if (seatValidationErrors.length > 0) {
        alert(seatValidationErrors.join('\n'));
      }
      
      // 최소 1개 이상의 좌석 등급이 선택되었는지 확인 (새 항공 등록 시)
      const checkedCheckboxes = document.querySelectorAll('input[type="checkbox"][id^="seatTypeCheck_"]:checked');
      const airIdInput = document.querySelector('input[name="id"]');
      if (!airIdInput || !airIdInput.value) {
        if (checkedCheckboxes.length === 0) {
          isValid = false;
          alert('최소 1개 이상의 좌석 등급을 선택해주세요.');
        }
      }
      
      if (!isValid) {
        e.preventDefault();
        alert('입력한 정보를 확인해주세요.\n- 구간의 출발 일시와 도착 일시가 올바른지 확인해주세요.\n- 잔여 좌석 수는 최대 좌석 수를 넘을 수 없습니다.\n- 최소 1개 이상의 좌석 등급을 선택해주세요.');
        return false;
      }
    });
  </script>
</div>
