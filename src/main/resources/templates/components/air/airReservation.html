<div th:fragment="content" class="min-h-screen bg-gray-50 py-6">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- 헤더 -->
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-900">항공 예약 조회</h1>
      <p class="mt-2 text-sm text-gray-600">해당 좌석의 예약 현황을 확인할 수 있습니다.</p>
    </div>

    <!-- 예약 목록 -->
    <div class="bg-white shadow rounded-lg">
      <div class="px-4 py-5 sm:p-6">
        <div class="flow-root">
          <div class="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
            <div class="inline-block min-w-full py-2 align-middle sm:px-6 lg:px-8">
              <div class="overflow-hidden shadow ring-1 ring-black ring-opacity-5 md:rounded-lg">
                <table class="min-w-full divide-y divide-gray-300">
                  <thead class="bg-gray-50">
                    <tr>
                      <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">예약 ID</th>
                      <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">투어 ID</th>
                      <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">좌석 수</th>
                      <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">상태</th>
                      <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">예약일</th>
                    </tr>
                  </thead>
                  <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="reservation : ${reservations}" class="hover:bg-gray-50">
                      <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${reservation.id}">1</td>
                      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${reservation.tourId}">1</td>
                      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${reservation.seatCount}">1</td>
                      <td class="px-6 py-4 whitespace-nowrap">
                        <span th:if="${reservation.status.name() == 'CONFIRMED'}" 
                              class="inline-flex items-center rounded-md bg-green-50 px-2 py-1 text-xs font-medium text-green-700 ring-1 ring-inset ring-green-600/20">
                          확정
                        </span>
                        <span th:if="${reservation.status.name() == 'PENDING'}" 
                              class="inline-flex items-center rounded-md bg-yellow-50 px-2 py-1 text-xs font-medium text-yellow-700 ring-1 ring-inset ring-yellow-600/20">
                          대기
                        </span>
                        <span th:if="${reservation.status.name() == 'CANCELLED'}" 
                              class="inline-flex items-center rounded-md bg-red-50 px-2 py-1 text-xs font-medium text-red-700 ring-1 ring-inset ring-red-600/20">
                          취소
                        </span>
                        <span th:if="${reservation.status.name() == 'COMPLETED'}" 
                              class="inline-flex items-center rounded-md bg-blue-50 px-2 py-1 text-xs font-medium text-blue-700 ring-1 ring-inset ring-blue-600/20">
                          완료
                        </span>
                      </td>
                      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(reservation.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01 10:00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(reservations)}">
                      <td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">예약이 없습니다.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 통계 정보 -->
    <div class="mt-6 grid grid-cols-1 gap-5 sm:grid-cols-3">
      <div class="bg-white overflow-hidden shadow rounded-lg">
        <div class="p-5">
          <div class="flex items-center">
            <div class="flex-shrink-0">
              <i class="fas fa-calendar-check h-6 w-6 text-green-600"></i>
            </div>
            <div class="ml-5 w-0 flex-1">
              <dl>
                <dt class="text-sm font-medium text-gray-500 truncate">총 예약 수</dt>
                <dd class="text-lg font-medium text-gray-900" th:text="${#lists.size(reservations)}">0</dd>
              </dl>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white overflow-hidden shadow rounded-lg">
        <div class="p-5">
          <div class="flex items-center">
            <div class="flex-shrink-0">
              <i class="fas fa-chair h-6 w-6 text-blue-600"></i>
            </div>
            <div class="ml-5 w-0 flex-1">
              <dl>
                <dt class="text-sm font-medium text-gray-500 truncate">총 좌석 수</dt>
                <dd class="text-lg font-medium text-gray-900" th:text="${#lists.size(reservations) > 0 ? #aggregates.sum(reservations.![seatCount]) : 0}">0</dd>
              </dl>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white overflow-hidden shadow rounded-lg">
        <div class="p-5">
          <div class="flex items-center">
            <div class="flex-shrink-0">
              <i class="fas fa-check-circle h-6 w-6 text-green-600"></i>
            </div>
            <div class="ml-5 w-0 flex-1">
              <dl>
                <dt class="text-sm font-medium text-gray-500 truncate">확정된 예약</dt>
                <dd class="text-lg font-medium text-gray-900" th:text="${#lists.size(reservations.?[status.name() == 'CONFIRMED'])}">0</dd>
              </dl>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 닫기 버튼 -->
    <div class="mt-6 flex justify-end">
      <button onclick="window.close()" 
              class="inline-flex items-center rounded-md bg-gray-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-gray-500">
        <i class="fas fa-times -ml-0.5 mr-1.5 h-4 w-4"></i>
        닫기
      </button>
    </div>
  </div>
</div>
