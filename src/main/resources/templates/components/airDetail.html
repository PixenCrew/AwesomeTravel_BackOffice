<div th:fragment="content">
    <h1 th:text="${air.id == null} ? '항공 등록' : '항공 상세' "></h1>

    <form th:object="${air}" th:action="${air.id == null} ? @{/air/new} : @{/air/{id}(id=${air.id})}" method="post">

        <div th:if="${air.id != null}">
            <label>ID:</label>
            <input type="text" th:field="*{id}" readonly /><br>
        </div>

        <div>
            <label>항공편 코드:</label>
            <input type="text" th:field="*{flightNumber}" required />
        </div>

        <div>
            <label for="airlineCode">항공사 코드:</label>
            <select id="airlineCode" th:field="*{airline}" required>
                <option value="" disabled>-- 항공사 선택 --</option>
                <option th:each="airline : ${allAirlines}" th:value="${airline.code}" th:text="${airline.code}">
                </option>
            </select>
        </div>

        <div>
            <label>출발지:</label>
            <input type="text" th:field="*{departAirport}" list="cityList" onchange="stripAfterPipe(this)" required />
        </div>

        <div>
            <label>출발 일:</label>
            <input type="date" th:field="*{departDate}" required />
        </div>

        <div>
            <label>출발 시간:</label>
            <input type="time" th:field="*{departTime}" required />
        </div>

        <div>
            <label>도착지:</label>
            <input type="text" th:field="*{arriveAirport}" list="cityList" onchange="stripAfterPipe(this)" required />
        </div>

        <div>
            <label>도착일:</label>
            <input type="date" th:field="*{arriveDate}" required />
        </div>

        <div>
            <label>도착 시간:</label>
            <input type="time" th:field="*{arriveTime}" required />
        </div>

        <div>
            <label>비행 유형:</label>
            <input type="text" th:field="*{flightType}" readonly />
        </div>

        <div>
            <label>경유 횟수:</label>
            <input type="number" th:field="*{stopovers}" id="stopovers" min="0" readonly />
        </div>

        <div id="stopoverContainer">
            <div th:each="stop, iterStat : *{stopoverList}" style="border: 1px solid black;">
                <div class="stopover-entry">
                    <label>경유지 코드:</label>
                    <input type="text" th:field="*{stopoverList[__${iterStat.index}__].arriveAirportCode}"
                        list="cityList" onchange="stripAfterPipe(this)" required /><br />
                    <label>경유지 도착시간:</label>
                    <input type="datetime" th:field="*{stopoverList[__${iterStat.index}__].arriveTime}"
                        onchange="calculateDuration(this)" required /><br />
                    <label>대기시간 [분]:</label>
                    <input type="number" th:field="*{stopoverList[__${iterStat.index}__].stopDurationMin}" required
                        readonly /><br />
                    <label>경유지 출발시간:</label>
                    <input type="datetime" th:field="*{stopoverList[__${iterStat.index}__].departTime}"
                        onchange="calculateDuration(this)" required /><br />
                    <button type="button" onclick="removeStopover(this)">삭제</button>
                </div>
            </div>
        </div>
        <button type="button" onclick="addStopover()">경유지 추가</button>

        <div>
            <label>상태:</label>
            <select th:field="*{status}">
                <option th:each="st : ${T(renewal.common.entity.Air.AirStatus).values()}" th:value="${st}"
                    th:text="${st}">STATUS</option>
            </select>
            <br />
        </div>

        <hr />

        <h3>좌석 등급 정보</h3>

        <div th:each="seat, iterStat : ${air.seatClasses}" style="border: 1px solid black;">
            <label>등급:</label>
            <input type="text" th:field="*{seatClasses[__${iterStat.index}__].classType}" readonly /><br>

            <label>가격[성인]:</label>
            <input type="number" th:field="*{seatClasses[__${iterStat.index}__].priceAdult}" min="0" required /><br>

            <label>가격[청소년]:</label>
            <input type="number" th:field="*{seatClasses[__${iterStat.index}__].priceYouth}" min="0" required /><br>

            <label>가격[영유아]:</label>
            <input type="number" th:field="*{seatClasses[__${iterStat.index}__].priceInfant}" min="0" required /><br>

            <label>최대 좌석 수:</label>
            <input type="number" th:field="*{seatClasses[__${iterStat.index}__].maxSeats}" min="0" required />

            <label>잔여 좌석 수:</label>
            <input type="number" th:field="*{seatClasses[__${iterStat.index}__].availableSeats}" min="0" required /><br>

            <button type="button" th:onclick="window.open('/air/seat/[[${seat.id}]]', 'popup', 'width=400,height=600')">
                예약 조회
            </button>
        </div>

        <button type="submit" th:text="${air.id == null} ? '등록' : '수정' "></button>
    </form>

    <button th:if="${air.id != null}" th:onclick="deleteAir([[${air.id}]])">삭제</button>

    <script src="/js/util.js"></script>
    <script>
        function deleteAir(id) {
            if (confirm('정말로 삭제하시겠습니까?')) {
                fetch('/air/' + id, { method: 'DELETE' })
                    .then(res => {
                        if (res.ok) {
                            alert('삭제 성공');
                            window.location.href = '/air';
                        } else {
                            alert('삭제 실패');
                        }
                    });
            }
        }

        // 페이지 로딩 시 stopovers 값으로 초기화
        let stopoverCount = parseInt(document.getElementById("stopovers").value) || 0;

        function addStopover() {
            const container = document.getElementById("stopoverContainer");
            const idx = stopoverCount;

            const stopoverDiv = document.createElement("div");
            stopoverDiv.className = "stopover-entry";
            stopoverDiv.style = "border: 1px solid black";

            // === 경유지 코드 ===
            const labelCode = document.createElement("label");
            labelCode.textContent = "경유지 코드:";
            const arriveInput = document.createElement("input");
            arriveInput.type = "text";
            arriveInput.name = `stopoverList[${idx}].arriveAirportCode`;
            arriveInput.required = true;
            arriveInput.setAttribute("list", "cityList");
            arriveInput.addEventListener("change", () => stripAfterPipe(arriveInput));

            // === 도착시간 ===
            const labelArriveTime = document.createElement("label");
            labelArriveTime.textContent = "경유지 도착시간:";
            const arriveTimeInput = document.createElement("input");
            arriveTimeInput.type = "datetime-local";
            arriveTimeInput.name = `stopoverList[${idx}].arriveTime`;
            arriveTimeInput.required = true;
            arriveTimeInput.addEventListener("change", () => calculateDuration(arriveTimeInput));

            // === 대기시간 ===
            const labelDuration = document.createElement("label");
            labelDuration.textContent = "대기시간 [분]:";
            const durationInput = document.createElement("input");
            durationInput.type = "number";
            durationInput.name = `stopoverList[${idx}].stopDurationMin`;
            durationInput.required = true;
            durationInput.readOnly = true;

            // === 출발시간 ===
            const labelDepartTime = document.createElement("label");
            labelDepartTime.textContent = "경유지 출발시간:";
            const departTimeInput = document.createElement("input");
            departTimeInput.type = "datetime-local";
            departTimeInput.name = `stopoverList[${idx}].departTime`;
            departTimeInput.required = true;
            departTimeInput.addEventListener("change", () => calculateDuration(departTimeInput));

            // === 삭제 버튼 ===
            const removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.textContent = "삭제";
            removeBtn.addEventListener("click", () => removeStopover(removeBtn));

            // DOM 조립
            stopoverDiv.append(
                labelCode, arriveInput, document.createElement("br"),
                labelArriveTime, arriveTimeInput, document.createElement("br"),
                labelDuration, durationInput, document.createElement("br"),
                labelDepartTime, departTimeInput, document.createElement("br"),
                removeBtn
            );

            container.appendChild(stopoverDiv);
            stopoverCount++;
            updateStopoverCountField();
        }

        function removeStopover(button) {
            button.parentElement.remove();
            stopoverCount--;
            updateStopoverCountField();
            reIndexStopovers();
        }

        function updateStopoverCountField() {
            document.getElementById("stopovers").value = stopoverCount;
        }

        function reIndexStopovers() {
            const entries = document.querySelectorAll("#stopoverContainer .stopover-entry");
            entries.forEach((entry, idx) => {
                entry.querySelectorAll("input").forEach(input => {
                    input.name = input.name.replace(/stopoverList\[\d+\]/,
                        `stopoverList[${idx}]`);
                });
            });
        }

        function searchAir(button) {
            const locPoint = button.closest('.location-point');
            const from = locPoint.querySelector('input[list="cityList"]').value;
            const to = locPoint.querySelectorAll('input[list="cityList"]')[1].value;
            const count = document.querySelector('input[name="count"]').value;
            window.open(
                `/air/search?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&count=${encodeURIComponent(count)}`,
                'airSearchPopup',
                'width=800,height=600,scrollbars=yes'
            );
            window.__lastSeatInput__ = locPoint.querySelector('input[data-role="seatClass"]');
        }

        function __fillSelectedAirId__(selectedId) {
            if (window.__lastSeatInput__) {
                window.__lastSeatInput__.value = selectedId;
            }
        }

        function calculateDuration(changedInput) {
            const entry = changedInput.closest('.stopover-entry');
            if (!entry) return;

            const arriveEl = entry.querySelector('input[name$=".arriveTime"]');
            const departEl = entry.querySelector('input[name$=".departTime"]');
            const durationEl = entry.querySelector('input[name$=".stopDurationMin"]');

            if (!arriveEl?.value || !departEl?.value) return;

            // 브라우저 호환성을 위해 type="datetime-local"을 권장
            const arriveDate = new Date(arriveEl.value);
            const departDate = new Date(departEl.value);

            if (isNaN(arriveDate) || isNaN(departDate)) return;

            // 출발 - 도착 (분 단위)
            let diffMin = Math.round((departDate - arriveDate) / 60000);

            // 출발이 도착보다 빠르거나 같으면 0으로 고정
            if (diffMin < 0) diffMin = 0;

            durationEl.value = diffMin;
        }

    </script>

    <datalist id="cityList">
        <option th:each="cc : ${cityCode}"
            th:value="${cc.airportCode} + ' | ' + ${cc.countryCode} + ' | ' + ${cc.countryEng} + ' | ' + ${cc.countryKor}">
        </option>
    </datalist>
</div>
