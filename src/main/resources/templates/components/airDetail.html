<div th:fragment="content">
    <h1 th:text="${air.id == null} ? '항공 등록' : '항공 상세' "></h1>

    <form th:object="${air}" th:action="${air.id == null} ? @{/air/new} : @{/air/{id}(id=${air.id})}" method="post">

        <div th:if="${air.id != null}">
            <label>ID:</label>
            <input type="text" th:field="*{id}" readonly /><br>
        </div>

        <div>
            <label>항공편 코드:</label>
            <input type="text" th:field="*{flightNumber}" required />
        </div>

        <div>
            <label for="airlineCode">항공사 코드:</label>
            <select id="airlineCode" th:field="*{airline.code}" required>
                <option value="" disabled>-- 항공사 선택 --</option>
                <option th:each="code : ${allAirlines}" th:value="${code}" th:text="${code}">
                </option>
            </select>
        </div>

        <div>
            <label>출발지:</label>
            <input type="text" th:field="*{departAirport}" list="cityList" onchange="stripAfterPipe(this)" required />
        </div>

        <div>
            <label>출발 일:</label>
            <input type="date" th:field="*{departDate}" required />
        </div>

        <div>
            <label>출발 시간:</label>
            <input type="time" th:field="*{departTime}" required />
        </div>

        <div>
            <label>도착지:</label>
            <input type="text" th:field="*{arriveAirport}" list="cityList" onchange="stripAfterPipe(this)" required />
        </div>

        <div>
            <label>도착일:</label>
            <input type="date" th:field="*{arriveDate}" required />
        </div>

        <div>
            <label>도착 시간:</label>
            <input type="time" th:field="*{arriveTime}" required />
        </div>

        <div>
            <label>비행 유형:</label>
            <input type="text" th:field="*{flightType}" readonly />
        </div>

        <div>
            <label>경유 횟수:</label>
            <input type="number" th:field="*{stopovers}" id="stopovers" min="0" readonly />
        </div>

        <div id="stopoverContainer">
            <div th:each="stop, iterStat : *{stopoverList}">
                <div class="stopover-entry">
                    <input type="text" th:field="*{stopoverList[__${iterStat.index}__]}" list="cityList" onchange="stripAfterPipe(this)" required />
                    <button type="button" onclick="removeStopover(this)">삭제</button>
                </div>
            </div>
        </div>
        <button type="button" onclick="addStopover()">경유지 추가</button>

        <div>
            <label>상태:</label>
            <select th:field="*{status}">
                <option th:each="st : ${T(renewal.awesome_travel_backoffice.air.utiles.AirStatus).values()}" th:value="${st}" th:text="${st}">STATUS</option>
            </select>
            <br />
        </div>

        <hr />

        <h3>좌석 등급 정보</h3>

        <div th:each="seat, iterStat : ${air.seatClasses}">
            <label>등급:</label>
            <input type="text" th:field="*{seatClasses[__${iterStat.index}__].classType}" readonly />

            <label>가격:</label>
            <input type="number" th:field="*{seatClasses[__${iterStat.index}__].price}" min="0" required />

            <label>최대 좌석 수:</label>
            <input type="number" th:field="*{seatClasses[__${iterStat.index}__].maxSeats}" min="0" required />

            <label>잔여 좌석 수:</label>
            <input type="number" th:field="*{seatClasses[__${iterStat.index}__].availableSeats}" min="0" required />

            <button type="button" th:onclick="window.open('/air/seat/[[${seat.id}]]', 'popup', 'width=400,height=600')">
                예약 조회
            </button>
        </div>

        <button type="submit" th:text="${air.id == null} ? '등록' : '수정' "></button>
    </form>

    <button th:if="${air.id != null}" th:onclick="deleteAir([[${air.id}]])">삭제</button>

    <script src="/js/util.js"></script>
    <script>
        function deleteAir(id) {
            if (confirm('정말로 삭제하시겠습니까?')) {
                fetch('/air/' + id, { method: 'DELETE' })
                    .then(res => {
                        if (res.ok) {
                            alert('삭제 성공');
                            window.location.href = '/air';
                        } else {
                            alert('삭제 실패');
                        }
                    });
            }
        }

        // 페이지 로딩 시 stopovers 값으로 초기화
        let stopoverCount = parseInt(document.getElementById("stopovers").value) || 0;

        function addStopover() {
            const container = document.getElementById("stopoverContainer");
            const stopoverDiv = document.createElement("div");
            stopoverDiv.className = "stopover-entry";

            stopoverDiv.innerHTML = `
            <input type="text"
                   name="stopoverList[${stopoverCount}]"
                   list="cityList"
                   onchange="stripAfterPipe(this)"
                   required />
            <button type="button" onclick="removeStopover(this)">삭제</button>
            `;

            container.appendChild(stopoverDiv);
            stopoverCount++;
            updateStopoverCount();
        }

        function removeStopover(button) {
            button.parentElement.remove();
            stopoverCount = Math.max(0, stopoverCount - 1);
            updateStopoverCount();
        }

        function updateStopoverCount() {
            document.getElementById("stopovers").value = stopoverCount;
        }

        function searchAir(button) {
            const locPoint = button.closest('.location-point');
            const from = locPoint.querySelector('input[list="cityList"]').value;
            const to = locPoint.querySelectorAll('input[list="cityList"]')[1].value;
            const count = document.querySelector('input[name="count"]').value;
            window.open(
                `/air/search?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&count=${encodeURIComponent(count)}`,
                'airSearchPopup',
                'width=800,height=600,scrollbars=yes'
            );
            window.__lastSeatInput__ = locPoint.querySelector('input[data-role="seatClass"]');
        }

        function __fillSelectedAirId__(selectedId) {
            if (window.__lastSeatInput__) {
                window.__lastSeatInput__.value = selectedId;
            }
        }
    </script>

    <datalist id="cityList">
        <option th:each="cc : ${cityCode}" th:value="${cc.code} + ' | ' + ${cc.country} + ' | ' + ${cc.eng} + ' | ' + ${cc.kor}"></option>
    </datalist>
</div>
