<div th:fragment="content">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e5e7eb;
        }

        .page-title {
            font-size: 1.875rem;
            font-weight: 700;
            color: #1f2937;
            margin: 0;
        }

        .filter-section {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .filter-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #374151;
            margin: 0;
        }

        .toggle-filter-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .toggle-filter-btn:hover {
            background: #2563eb;
        }

        .filter-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .filter-input {
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }

        .filter-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .filter-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .results-section {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            overflow: hidden;
        }

        .results-header {
            background: #f9fafb;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .results-title {
            font-size: 1rem;
            font-weight: 600;
            color: #374151;
            margin: 0;
        }

        .table-container {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            background: #f9fafb;
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            border-bottom: 1px solid #e5e7eb;
        }

        .data-table td {
            padding: 1rem;
            border-bottom: 1px solid #f3f4f6;
            font-size: 0.875rem;
            color: #374151;
        }

        .data-row:hover {
            background: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-holding {
            background: #fef3c7;
            color: #92400e;
        }

        .status-paid {
            background: #d1fae5;
            color: #065f46;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.75rem;
        }

        .btn-outline-primary {
            background: transparent;
            color: #3b82f6;
            border: 1px solid #3b82f6;
        }

        .btn-outline-primary:hover {
            background: #3b82f6;
            color: white;
        }

        .btn-outline-danger {
            background: transparent;
            color: #dc2626;
            border: 1px solid #dc2626;
        }

        .btn-outline-danger:hover {
            background: #dc2626;
            color: white;
        }

        .pagination-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            gap: 1rem;
        }

        .pagination-info {
            font-size: 0.875rem;
            color: #6b7280;
        }

        .pagination-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .pagination-btn {
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination-btn:hover:not(:disabled) {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .sort-link {
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .sort-link:hover {
            color: #3b82f6;
        }

        .sort-icon {
            font-size: 0.75rem;
        }

        .hidden {
            display: none;
        }
    </style>

    <!-- 페이지 헤더 -->
    <div class="page-header">
        <h1 class="page-title">항공 주문 관리</h1>
    </div>

    <!-- 필터 섹션 -->
    <div class="filter-section">
        <div class="filter-header">
            <h3 class="filter-title">검색 필터</h3>
            <button class="toggle-filter-btn" onclick="toggleFilter()">
                <i class="fas fa-filter"></i> 필터 토글
            </button>
        </div>
        
        <form id="filterForm" class="filter-form" method="get">
            <div class="filter-group">
                <label class="filter-label">주문 상태</label>
                <select name="status" class="filter-input">
                    <option value="">전체</option>
                    <option th:each="statusOption : ${purchaseStatuses}" 
                            th:value="${statusOption}" 
                            th:text="${statusOption}"
                            th:selected="${statusOption == status}">HOLDING</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label class="filter-label">예약자명</label>
                <input type="text" name="name" class="filter-input" th:value="${name}" placeholder="예약자명 입력">
            </div>
            
            <div class="filter-group">
                <label class="filter-label">이메일</label>
                <input type="email" name="email" class="filter-input" th:value="${email}" placeholder="이메일 입력">
            </div>
            
            <div class="filter-group">
                <label class="filter-label">시작일</label>
                <input type="date" name="startDate" class="filter-input" th:value="${startDate}">
            </div>
            
            <div class="filter-group">
                <label class="filter-label">종료일</label>
                <input type="date" name="endDate" class="filter-input" th:value="${endDate}">
            </div>
            
            <div class="filter-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-search"></i> 검색
                </button>
                <button type="button" class="btn btn-secondary" onclick="resetFilter()">
                    <i class="fas fa-undo"></i> 초기화
                </button>
            </div>
        </form>
    </div>

    <!-- 결과 섹션 -->
    <div class="results-section">
        <div class="results-header">
            <h3 class="results-title">
                총 <span th:text="${airPurchasePage.totalElements}">0</span>건의 주문
            </h3>
        </div>
        
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>주문번호</th>
                        <th>
                            <a href="#" data-sortfield="purchaseDate" onclick="toggleSort(this, event)" class="sort-link">
                                주문일
                                <i th:if="${sortField=='purchaseDate'}" th:class="${sortDir=='asc'} ? 'fas fa-sort-up sort-icon' : 'fas fa-sort-down sort-icon'"></i>
                            </a>
                        </th>
                        <th>예약자</th>
                        <th>연락처</th>
                        <th>항공편</th>
                        <th>좌석등급</th>
                        <th>승객수</th>
                        <th>
                            <a href="#" data-sortfield="price" onclick="toggleSort(this, event)" class="sort-link">
                                결제금액
                                <i th:if="${sortField=='price'}" th:class="${sortDir=='asc'} ? 'fas fa-sort-up sort-icon' : 'fas fa-sort-down sort-icon'"></i>
                            </a>
                        </th>
                        <th>상태</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${airPurchasePage.content.isEmpty()}" class="empty-state">
                        <td colspan="10">
                            <div class="empty-state">
                                <div class="empty-icon">📋</div>
                                <p>검색 조건에 맞는 주문이 없습니다.</p>
                            </div>
                        </td>
                    </tr>
                    <tr th:each="purchase : ${airPurchasePage.content}">
                        <td class="font-mono text-sm" th:text="${purchase.id}">#12345</td>
                        <td th:text="${#temporals.format(purchase.purchaseDate, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</td>
                        <td>
                            <div class="font-medium" th:text="${purchase.name}">홍길동</div>
                            <div class="text-sm text-gray-500" th:text="${purchase.email}">hong@example.com</div>
                        </td>
                        <td th:text="${purchase.number}">010-1234-5678</td>
                        <td>
                            <div class="font-medium" th:text="${purchase.airDto.code}">AA123</div>
                            <div class="text-sm text-gray-500">
                                <span th:text="${purchase.airDto.depart}">ICN</span> → 
                                <span th:text="${purchase.airDto.arrive}">LAX</span>
                            </div>
                        </td>
                        <td>
                            <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded-full text-xs" 
                                  th:text="${purchase.airDto.seatClassType}">ECONOMY</span>
                        </td>
                        <td class="text-center">
                            <div th:text="${purchase.airPassengers != null ? purchase.airPassengers.size() : 0}">2</div>
                            <div class="text-xs text-gray-500" th:text="'/' + ${purchase.expectedPassengerCount}">/4</div>
                        </td>
                        <td class="font-medium" th:text="${#numbers.formatInteger(purchase.price, 3, 'COMMA')} + '원'">550,000원</td>
                        <td>
                            <div class="space-y-1">
                                <span class="status-badge" 
                                      th:classappend="'status-' + ${purchase.status.name().toLowerCase()}"
                                      th:text="${purchase.status}">HOLDING</span>
                                <div th:if="${!purchase.isPassengerInfoComplete}" 
                                     class="text-xs text-orange-600 font-medium">
                                    승객정보 미완료
                                </div>
                                <div th:if="${purchase.isPassengerInfoComplete}" 
                                     class="text-xs text-green-600 font-medium">
                                    승객정보 완료
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <a th:href="@{/air-purchase/{id}(id=${purchase.id})}" 
                                   class="btn btn-sm btn-outline-primary" title="상세보기">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <button th:onclick="|changeStatus(${purchase.id})|" 
                                        class="btn btn-sm btn-outline-primary" title="상태변경">
                                    <i class="fas fa-edit"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 페이지네이션 -->
    <div class="pagination-section" th:if="${airPurchasePage.totalPages > 1}">
        <div class="pagination-info">
            <span th:text="${airPurchasePage.number + 1}">1</span> / 
            <span th:text="${airPurchasePage.totalPages}">10</span> 페이지 
            (총 <span th:text="${airPurchasePage.totalElements}">100</span>건)
        </div>
        
        <div class="pagination-buttons">
            <button class="pagination-btn" 
                    th:disabled="${airPurchasePage.first}"
                    th:onclick="|goToPage(${airPurchasePage.number - 1})|">
                <i class="fas fa-chevron-left"></i>
            </button>
            
            <th:block th:each="pageNum : ${#numbers.sequence(0, airPurchasePage.totalPages - 1)}">
                <button class="pagination-btn" 
                        th:classappend="${pageNum == airPurchasePage.number} ? 'active' : ''"
                        th:onclick="|goToPage(${pageNum})|"
                        th:text="${pageNum + 1}">1</button>
            </th:block>
            
            <button class="pagination-btn" 
                    th:disabled="${airPurchasePage.last}"
                    th:onclick="|goToPage(${airPurchasePage.number + 1})|">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <script>
        function toggleFilter() {
            const form = document.getElementById('filterForm');
            form.style.display = form.style.display === 'none' ? 'grid' : 'none';
        }

        function resetFilter() {
            document.getElementById('filterForm').reset();
            window.location.href = '/air-purchase';
        }

        function toggleSort(element, event) {
            event.preventDefault();
            const sortField = element.dataset.sortfield;
            const currentSortField = '[[${sortField}]]';
            const currentSortDir = '[[${sortDir}]]';
            
            let newSortDir = 'asc';
            if (sortField === currentSortField && currentSortDir === 'asc') {
                newSortDir = 'desc';
            }
            
            const url = new URL(window.location);
            url.searchParams.set('sortField', sortField);
            url.searchParams.set('sortDir', newSortDir);
            url.searchParams.set('page', '0');
            
            window.location.href = url.toString();
        }

        function goToPage(page) {
            const url = new URL(window.location);
            url.searchParams.set('page', page);
            window.location.href = url.toString();
        }

        function changeStatus(purchaseId) {
            const newStatus = prompt('새로운 상태를 선택하세요:\n1. HOLDING\n2. PAID\n3. CANCELLED');
            if (newStatus) {
                // 상태값 검증
                const validStatuses = ['HOLDING', 'PAID', 'CANCELLED'];
                if (!validStatuses.includes(newStatus.toUpperCase())) {
                    alert('올바른 상태를 입력해주세요: HOLDING, PAID, CANCELLED');
                    return;
                }

                // AJAX로 상태 변경 API 호출
                fetch(`/api/admin/air-purchases/${purchaseId}/status?status=${newStatus.toUpperCase()}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => {
                    if (response.ok) {
                        alert('상태가 성공적으로 변경되었습니다.');
                        location.reload(); // 페이지 새로고침
                    } else {
                        response.text().then(text => alert('상태 변경 실패: ' + text));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('상태 변경 중 오류가 발생했습니다.');
                });
            }
        }


    </script>
</div>
