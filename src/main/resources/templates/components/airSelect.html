<!DOCTYPE html>

<head>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <meta charset="UTF-8">
    <title>항공편 검색</title>
</head>

<body>
    <h2>항공편 검색 결과</h2>

    <!-- 2) 결과 테이블 (메인 화면 헤더와 동일하게) -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>출발지</th>
                <th>
                    <a href="#" th:attr="data-sortfield=|'departDate'|, data-sortdir=|${sortField=='departDate' and sortDir=='asc' ? 'desc':'asc'}|" onclick="reloadWithSort(this, event)">
                        출발일
                        <span th:if="${sortField=='departDate'}" th:text="${sortDir=='asc'?'▲':'▼'}"></span>
                    </a>
                </th>
                <th>도착지</th>
                <th>
                    <a href="#" th:attr="data-sortfield=|'arriveDate'|, data-sortdir=|${sortField=='arriveDate' and sortDir=='asc' ? 'desc':'asc'}|" onclick="reloadWithSort(this, event)">
                        도착일
                        <span th:if="${sortField=='arriveDate'}" th:text="${sortDir=='asc'?'▲':'▼'}"></span>
                    </a>
                </th>
                <th>코드</th>
                <th>가격</th>
                <th>총 좌석</th>
                <th>잔여 좌석</th>
                <th>선택</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="air : ${airPage.content}" th:onclick="|selectAndClose(${air.id})|">
                <td th:text="${air.id}">1</td>
                <td th:text="${air.depart}">ICN</td>
                <td th:text="${air.depart_time}">08:00</td>
                <td th:text="${air.arrive}">JFK</td>
                <td th:text="${air.arrive_time}">14:00</td>
                <td th:text="${air.code}">AA101</td>
                <td th:text="${air.seatClasses[0].price}">100000</td>
                <td th:text="${air.seatClasses[0].maxSeats}">200</td>
                <td th:text="${air.seatClasses[0].availableSeats}">180</td>
                <td>▶ 선택</td>
            </tr>
            <tr th:if="${#lists.isEmpty(results)}">
                <td colspan="10">검색 결과 없음</td>
            </tr>
        </tbody>
    </table>

    <script th:inline="javascript">
        /* 팝업에서 클릭된 항공편 ID를 부모 창의 마지막 입력란에 채우고 닫기 */
        function selectAndClose(id) {
            window.opener.__fillSelectedAirId__(id);
            window.close();
        }

        /* 정렬 링크 클릭 시, 동일 파라미터로 재로딩 */
        function reloadWithSort(a, ev) {
            ev.preventDefault();
            const from = /*[[${#httpServletRequest.getParameter('from')}]]*/ '';
            const to = /*[[${#httpServletRequest.getParameter('to')}]]*/ '';
            const count = /*[[${#httpServletRequest.getParameter('count')}]]*/ '';
            const sf = a.getAttribute('data-sortfield');
            const sd = a.getAttribute('data-sortdir');
            const url = `/air/search-popup?from=${from}&to=${to}&count=${count}&sortField=${sf}&sortDir=${sd}`;
            window.location.href = url;
        }
    </script>
</body>

</html>
