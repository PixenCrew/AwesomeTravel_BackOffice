<div th:fragment="content">
    <div class="space-y-6">
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">공항 관리</h2>
                <p class="text-sm text-gray-600 mt-1">공항 코드를 등록하고 관리합니다.</p>
            </div>
            <div class="flex space-x-3">
                <a href="/airport/download-template" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">
                    <i class="fas fa-download mr-2"></i>템플릿
                </a>
                <a href="/airport/download" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                    <i class="fas fa-file-excel mr-2"></i>Excel
                </a>
                <button onclick="document.getElementById('excelUpload').click()" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                    <i class="fas fa-upload mr-2"></i>업로드
                </button>
                <a href="/airport/new" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    <i class="fas fa-plus mr-2"></i>등록
                </a>
            </div>
        </div>

        <form id="excelUploadForm" action="/airport/upload" method="POST" enctype="multipart/form-data" style="display: none;">
            <input type="file" id="excelUpload" name="file" accept=".xlsx, .xls" onchange="handleExcelUpload(this)">
        </form>

        <div th:if="${param.message}" class="p-4 bg-green-100 text-green-800 rounded-lg">
            <span th:text="${param.message}">성공</span>
        </div>
        <div th:if="${param.error}" class="p-4 bg-red-100 text-red-800 rounded-lg">
            <span th:text="${param.error}">오류</span>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-6">
            <form method="GET" action="/airport" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">국가</label>
                    <select name="countryCode" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                        <option value="">전체</option>
                        <option th:each="c : ${countryList}" th:value="${c.code}" th:text="|${c.code} - ${c.nameKor}|" th:selected="${countryCode == c.code}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">도시</label>
                    <select name="cityCode" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                        <option value="">전체</option>
                        <option th:each="c : ${cityList}" th:value="${c.code}" th:text="|${c.code} - ${c.kor}|" th:selected="${cityCode == c.code}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">검색 유형</label>
                    <select name="searchType" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                        <option value="code" th:selected="${searchType == 'code'}">공항 코드</option>
                        <option value="nameKor" th:selected="${searchType == 'nameKor'}">공항명 (한글)</option>
                        <option value="nameEng" th:selected="${searchType == 'nameEng'}">공항명 (영문)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">검색어</label>
                    <input type="text" name="searchKeyword" th:value="${searchKeyword}" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                </div>
                <div class="flex items-end gap-2">
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"><i class="fas fa-search mr-2"></i>검색</button>
                    <a href="/airport" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700"><i class="fas fa-refresh mr-2"></i>초기화</a>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">공항 코드</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">국가</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">도시</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">공항명 (한글)</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">공항명 (영문)</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">유형</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">작업</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="airport : ${airportPage.content}" class="hover:bg-gray-50 cursor-pointer airport-row" th:data-code="${airport.code}">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${airport.code}">ICN</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${airport.countryCode}">KR</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${airport.cityCode}">SEL</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${airport.nameKor}">인천국제공항</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${airport.nameEng}">Incheon International</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span th:if="${airport.airportType?.name() == 'INTERNATIONAL'}" class="px-2 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800">국제</span>
                            <span th:if="${airport.airportType?.name() == 'DOMESTIC'}" class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">국내</span>
                            <span th:if="${airport.airportType?.name() == 'BOTH'}" class="px-2 py-1 text-xs font-semibold rounded-full bg-purple-100 text-purple-800">국제/국내</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <div class="flex items-center space-x-2" onclick="event.stopPropagation()">
                                <a th:href="@{/airport/{code}(code=${airport.code})}" class="inline-flex items-center px-3 py-1.5 bg-blue-100 text-blue-700 rounded hover:bg-blue-200" title="상세"><i class="fas fa-eye text-sm"></i></a>
                                <a th:href="@{/airport/edit/{code}(code=${airport.code})}" class="inline-flex items-center px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded hover:bg-indigo-200" title="수정"><i class="fas fa-edit text-sm"></i></a>
                                <button th:data-code="${airport.code}" onclick="deleteAirport(this.dataset.code)" class="inline-flex items-center px-3 py-1.5 bg-red-100 text-red-700 rounded hover:bg-red-200" title="삭제" type="button"><i class="fas fa-trash text-sm"></i></button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div th:if="${airportPage.content.isEmpty()}" class="text-center py-12">
                <i class="fas fa-plane-departure text-4xl text-gray-400 mb-4"></i>
                <h3 class="text-lg font-medium text-gray-900 mb-2">등록된 공항이 없습니다</h3>
                <a href="/airport/new" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"><i class="fas fa-plus mr-2"></i>새 공항 등록</a>
            </div>
        </div>

        <div th:if="${airportPage.totalPages > 1}" class="flex justify-between">
            <div class="text-sm text-gray-700"><span th:text="${airportPage.number + 1}">1</span> / <span th:text="${airportPage.totalPages}">1</span> (총 <span th:text="${airportPage.totalElements}">0</span>개)</div>
            <div class="flex space-x-2">
                <a th:if="${airportPage.hasPrevious()}" th:href="@{/airport(page=${airportPage.number - 1})}" class="px-3 py-2 border rounded-lg hover:bg-gray-50">이전</a>
                <a th:if="${airportPage.hasNext()}" th:href="@{/airport(page=${airportPage.number + 1})}" class="px-3 py-2 border rounded-lg hover:bg-gray-50">다음</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.airport-row').forEach(row => {
                row.addEventListener('click', function() {
                    location.href = '/airport/' + this.dataset.code;
                });
            });
        });

        function handleExcelUpload(input) {
            if (input.files && input.files[0]) {
                if (confirm('Excel 파일을 업로드하시겠습니까?')) {
                    document.getElementById('excelUploadForm').submit();
                } else {
                    input.value = '';
                }
            }
        }

        function deleteAirport(code) {
            if (confirm('공항을 삭제하시겠습니까?\n코드: ' + code)) {
                fetch(`/airport/${code}`, { method: 'DELETE' })
                .then(response => response.ok ? location.reload() : alert('삭제 실패'))
                .catch(() => alert('오류 발생'));
            }
        }
    </script>
</div>
