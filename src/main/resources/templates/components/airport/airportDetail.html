<div th:fragment="content">
    <div class="space-y-6">
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold text-gray-900">공항 상세</h2>
            <div class="flex space-x-3">
                <a href="/airport" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700"><i class="fas fa-arrow-left mr-2"></i>목록</a>
                <a th:href="@{/airport/edit/{code}(code=${airport.code})}" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"><i class="fas fa-edit mr-2"></i>수정</a>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b"><h3 class="text-lg font-medium">기본 정보</h3></div>
            <div class="px-6 py-4">
                <dl class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><dt class="text-sm font-medium text-gray-500">공항 코드</dt><dd class="mt-1 text-lg font-semibold" th:text="${airport.code}">ICN</dd></div>
                    <div><dt class="text-sm font-medium text-gray-500">공항 유형</dt>
                        <dd class="mt-1">
                            <span th:if="${airport.airportType?.name() == 'INTERNATIONAL'}" class="px-3 py-1 text-sm rounded-full bg-blue-100 text-blue-800">국제</span>
                            <span th:if="${airport.airportType?.name() == 'DOMESTIC'}" class="px-3 py-1 text-sm rounded-full bg-green-100 text-green-800">국내</span>
                            <span th:if="${airport.airportType?.name() == 'BOTH'}" class="px-3 py-1 text-sm rounded-full bg-purple-100 text-purple-800">국제/국내</span>
                        </dd>
                    </div>
                    <div><dt class="text-sm font-medium text-gray-500">국가 코드</dt><dd class="mt-1 text-lg" th:text="${airport.countryCode}">KR</dd></div>
                    <div><dt class="text-sm font-medium text-gray-500">도시 코드</dt><dd class="mt-1 text-lg" th:text="${airport.cityCode}">SEL</dd></div>
                    <div><dt class="text-sm font-medium text-gray-500">공항명 (한글)</dt><dd class="mt-1 text-lg" th:text="${airport.nameKor}">인천국제공항</dd></div>
                    <div><dt class="text-sm font-medium text-gray-500">공항명 (영문)</dt><dd class="mt-1 text-lg" th:text="${airport.nameEng}">Incheon International Airport</dd></div>
                </dl>
            </div>
        </div>

        <div class="flex justify-center">
            <button th:data-code="${airport.code}" onclick="deleteAirport(this.dataset.code)" class="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700"><i class="fas fa-trash mr-2"></i>삭제</button>
        </div>
    </div>

    <script>
        function deleteAirport(code) {
            if (confirm('공항을 삭제하시겠습니까?\n코드: ' + code)) {
                fetch(`/airport/${code}`, { method: 'DELETE' })
                .then(response => response.ok ? location.href = '/airport?message=success' : alert('삭제 실패'))
                .catch(() => alert('오류 발생'));
            }
        }
    </script>
</div>
