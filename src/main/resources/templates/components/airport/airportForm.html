<div th:fragment="content">
    <div class="space-y-6">
        <!-- 페이지 헤더 -->
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900" th:text="${airport.airportCode != null && !airport.airportCode.isEmpty() ? '공항 수정' : '새 공항 등록'}">새 공항 등록</h2>
                <p class="text-sm text-gray-600 mt-1">공항 정보를 입력하세요.</p>
            </div>
            <a href="/airport" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">
                <i class="fas fa-arrow-left mr-2"></i>목록으로
            </a>
        </div>

        <!-- 메시지 표시 -->
        <div th:if="${error}" class="p-4 bg-red-100 text-red-800 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${error}">오류 메시지</span>
            </div>
        </div>

        <!-- 공항 등록/수정 폼 -->
        <div class="bg-white rounded-lg shadow-sm p-6">
            <form th:action="@{/airport}" method="POST" class="space-y-6">
                <!-- 원본 코드 (수정시에만) -->
                <input th:if="${airport.airportCode != null && !airport.airportCode.isEmpty()}" 
                       type="hidden" name="originalCode" th:value="${airport.airportCode}">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 공항 코드 -->
                    <div>
                        <label for="airportCode" class="block text-sm font-medium text-gray-700 mb-2">공항 코드 * (IATA 코드)</label>
                        <input type="text" 
                               id="airportCode" 
                               name="airportCode" 
                               th:value="${airport.airportCode}"
                               placeholder="예: ICN, JFK, NRT"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase">
                        <p class="text-xs text-gray-500 mt-1">대문자 영문 코드를 입력하세요 (예: ICN, JFK, NRT)</p>
                    </div>

                    <!-- 국가 코드 -->
                    <div>
                        <label for="countryCode" class="block text-sm font-medium text-gray-700 mb-2">국가 코드 *</label>
                        <select id="countryCode" 
                                name="countryCode" 
                                required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">국가를 선택하세요</option>
                            <option th:each="c : ${countryList}" 
                                    th:value="${c.countryCode}" 
                                    th:text="|${c.countryCode} - ${c.countryKor} (${c.countryEng})|" 
                                    th:selected="${
                                        (airport.cityCode != null && airport.cityCode.countryCode != null
                                            ? airport.cityCode.countryCode.countryCode
                                            : selectedCountryCode) == c.countryCode
                                    }"></option>
                        </select>
                        <p class="text-xs text-gray-500 mt-1">이 공항이 위치한 국가를 선택하세요</p>
                    </div>

                    <!-- 도시 코드 -->
                    <div>
                        <label for="cityCode" class="block text-sm font-medium text-gray-700 mb-2">도시 코드 *</label>
                        <select id="cityCode" 
                                name="cityCode" 
                                required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">도시를 선택하세요</option>
                            <option th:each="c : ${cityList}" 
                                    th:value="${c.cityCode}" 
                                    th:text="|${c.cityCode} - ${c.cityKor} (${c.cityEng})|" 
                                    th:selected="${
                                        (airport.cityCode != null
                                            ? airport.cityCode.cityCode
                                            : selectedCityCode) == c.cityCode
                                    }"></option>
                        </select>
                        <p class="text-xs text-gray-500 mt-1">이 공항이 위치한 도시를 선택하세요</p>
                    </div>

                    <!-- 공항명 (한글) -->
                    <div>
                        <label for="airportKor" class="block text-sm font-medium text-gray-700 mb-2">공항명 (한글) *</label>
                        <input type="text" 
                               id="airportKor" 
                               name="airportKor" 
                               th:value="${airport.airportKor}"
                               placeholder="예: 인천국제공항"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <!-- 공항명 (영문) -->
                    <div>
                        <label for="airportEng" class="block text-sm font-medium text-gray-700 mb-2">공항명 (영문) *</label>
                        <input type="text" 
                               id="airportEng" 
                               name="airportEng" 
                               th:value="${airport.airportEng}"
                               placeholder="예: Incheon International Airport"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <!-- 폼 버튼 -->
                <div class="flex justify-end space-x-4 pt-6 border-t border-gray-200">
                    <a href="/airport" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                        취소
                    </a>
                    <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        <i class="fas fa-save mr-2"></i>
                        <span th:text="${airport.airportCode != null && !airport.airportCode.isEmpty() ? '수정' : '등록'}">등록</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 공항 코드 입력 시 대문자로 자동 변환
        document.getElementById('airportCode').addEventListener('input', function(e) {
            this.value = this.value.toUpperCase();
        });
    </script>
</div>
