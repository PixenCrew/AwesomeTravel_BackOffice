<div th:fragment="content">
    <div class="space-y-6">
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold" th:text="${airport.code != null && !airport.code.isEmpty() ? '공항 수정' : '새 공항 등록'}">새 공항 등록</h2>
            <a href="/airport" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700"><i class="fas fa-arrow-left mr-2"></i>목록</a>
        </div>

        <div th:if="${error}" class="p-4 bg-red-100 text-red-800 rounded-lg"><span th:text="${error}"></span></div>

        <div class="bg-white rounded-lg shadow-sm p-6">
            <form th:action="@{/airport}" method="POST" class="space-y-6">
                <input th:if="${airport.code != null && !airport.code.isEmpty()}" type="hidden" name="originalCode" th:value="${airport.code}">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">공항 코드 *</label>
                        <input type="text" name="code" th:value="${airport.code}" placeholder="ICN" required class="w-full px-4 py-2 border rounded-lg uppercase">
                        <p class="text-xs text-gray-500 mt-1">IATA 3자리 코드</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">공항 유형 *</label>
                        <select name="airportType" required class="w-full px-4 py-2 border rounded-lg">
                            <option value="INTERNATIONAL" th:selected="${airport.airportType?.name() == 'INTERNATIONAL'}">국제</option>
                            <option value="DOMESTIC" th:selected="${airport.airportType?.name() == 'DOMESTIC'}">국내</option>
                            <option value="BOTH" th:selected="${airport.airportType?.name() == 'BOTH'}">국제/국내</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">국가 코드 *</label>
                        <select name="countryCode" required class="w-full px-4 py-2 border rounded-lg">
                            <option value="">선택</option>
                            <option th:each="c : ${countryList}" th:value="${c.code}" th:text="|${c.code} - ${c.nameKor}|" th:selected="${airport.countryCode == c.code}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">도시 코드 *</label>
                        <select name="cityCode" required class="w-full px-4 py-2 border rounded-lg">
                            <option value="">선택</option>
                            <option th:each="c : ${cityList}" th:value="${c.code}" th:text="|${c.code} - ${c.kor}|" th:selected="${airport.cityCode == c.code}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">공항명 (한글) *</label>
                        <input type="text" name="nameKor" th:value="${airport.nameKor}" placeholder="인천국제공항" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">공항명 (영문) *</label>
                        <input type="text" name="nameEng" th:value="${airport.nameEng}" placeholder="Incheon International Airport" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                </div>

                <div class="flex justify-end space-x-4 pt-6 border-t">
                    <a href="/airport" class="px-6 py-2 border rounded-lg hover:bg-gray-50">취소</a>
                    <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        <i class="fas fa-save mr-2"></i><span th:text="${airport.code != null && !airport.code.isEmpty() ? '수정' : '등록'}">등록</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
