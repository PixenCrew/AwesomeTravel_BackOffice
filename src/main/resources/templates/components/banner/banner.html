<div th:fragment="content">
    <div class="space-y-6">
        <!-- 페이지 헤더 -->
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">배너 관리</h2>
                <p class="text-sm text-gray-600 mt-1">메인 페이지에 표시될 배너를 관리합니다.</p>
            </div>
            <a href="/banner/new" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200">
                <i class="fas fa-plus mr-2"></i>새 배너 등록
            </a>
        </div>

        <!-- 메시지 표시 -->
        <div th:if="${message}" class="p-4 bg-green-100 text-green-800 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${message}">성공 메시지</span>
            </div>
        </div>
        
        <div th:if="${error}" class="p-4 bg-red-100 text-red-800 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${error}">오류 메시지</span>
            </div>
        </div>

        <!-- 검색 필터 -->
        <div class="bg-white rounded-lg shadow-sm p-6">
            <form method="GET" action="/banner" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">제목 검색</label>
                    <input type="text" name="title" th:value="${param.title}" 
                           placeholder="배너 제목을 입력하세요"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">활성 상태</label>
                    <select name="active" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">전체</option>
                        <option value="true" th:selected="${param.active == 'true'}">활성</option>
                        <option value="false" th:selected="${param.active == 'false'}">비활성</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">시작 날짜</label>
                    <input type="date" name="startDate" th:value="${param.startDate}" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">종료 날짜</label>
                    <input type="date" name="endDate" th:value="${param.endDate}" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="md:col-span-4 flex gap-2">
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        <i class="fas fa-search mr-2"></i>검색
                    </button>
                    <a href="/banner" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">
                        <i class="fas fa-refresh mr-2"></i>초기화
                    </a>
                </div>
            </form>
        </div>

        <!-- 배너 목록 -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                <a th:href="@{/banner(sortField='displayOrder', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}" 
                                   class="hover:text-gray-700">
                                    순서
                                    <i th:class="${sortField == 'displayOrder'} ? (${sortDir == 'asc'} ? 'fas fa-sort-up' : 'fas fa-sort-down') : 'fas fa-sort'"></i>
                                </a>
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                <a th:href="@{/banner(sortField='title', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}" 
                                   class="hover:text-gray-700">
                                    제목
                                    <i th:class="${sortField == 'title'} ? (${sortDir == 'asc'} ? 'fas fa-sort-up' : 'fas fa-sort-down') : 'fas fa-sort'"></i>
                                </a>
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">이미지</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">기간</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">상태</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">작업</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="banner : ${bannerPage.content}" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                                <span th:text="${banner.displayOrder}">1</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm font-medium text-gray-900" th:text="${banner.title}">배너 제목</div>
                                <div class="text-sm text-gray-500" th:text="${banner.url}">URL</div>
                                <div class="text-xs text-gray-400 mt-1">
                                    <span th:switch="${banner.locationType}">
                                        <span th:case="HOME">홈</span>
                                        <span th:case="SUB_MENU">서브메뉴</span>
                                        <span th:case="AIR_SEARCH">항공선택</span>
                                        <span th:case="PRODUCT_LIST">상품목록</span>
                                        <span th:case="PRODUCT_DETAIL">상품상세</span>
                                        <span th:case="*" th:text="${banner.locationType}">위치</span>
                                    </span>
                                    <span th:if="${banner.locationIdentifier != null && !banner.locationIdentifier.isEmpty()}" 
                                          th:text="' (' + ${banner.locationIdentifier} + ')'"> (101)</span>
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <img th:if="${banner.file != null && !banner.file.isEmpty()}" 
                                     th:src="@{${banner.file}}" 
                                     alt="배너 이미지" 
                                     class="h-16 w-24 object-cover rounded">
                                <span th:unless="${banner.file != null && !banner.file.isEmpty()}" 
                                      class="text-gray-400 text-sm">이미지 없음</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                <div th:text="${#temporals.format(banner.startDate, 'yyyy-MM-dd')}">2024-01-01</div>
                                <div class="text-gray-500">~</div>
                                <div th:text="${#temporals.format(banner.endDate, 'yyyy-MM-dd')}">2024-12-31</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span th:if="${banner.active}" 
                                      class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">
                                    활성
                                </span>
                                <span th:unless="${banner.active}" 
                                      class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800">
                                    비활성
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <div class="flex items-center space-x-2">
                                    <a th:href="@{/banner/{id}(id=${banner.id})}" 
                                       class="inline-flex items-center justify-center px-3 py-1.5 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition-colors" 
                                       title="상세보기">
                                        <i class="fas fa-eye text-sm"></i>
                                    </a>
                                    <a th:href="@{/banner/edit/{id}(id=${banner.id})}" 
                                       class="inline-flex items-center justify-center px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded hover:bg-indigo-200 transition-colors" 
                                       title="수정">
                                        <i class="fas fa-edit text-sm"></i>
                                    </a>
                                    <button th:onclick="|toggleBanner(${banner.id})|" 
                                            th:class="${banner.active} ? 'inline-flex items-center justify-center px-3 py-1.5 bg-orange-100 text-orange-700 rounded hover:bg-orange-200 transition-colors' : 'inline-flex items-center justify-center px-3 py-1.5 bg-green-100 text-green-700 rounded hover:bg-green-200 transition-colors'"
                                            th:title="${banner.active} ? '비활성화' : '활성화'"
                                            type="button">
                                        <i th:class="${banner.active} ? 'fas fa-pause text-sm' : 'fas fa-play text-sm'"></i>
                                    </button>
                                    <button th:onclick="|deleteBanner(${banner.id})|" 
                                            class="inline-flex items-center justify-center px-3 py-1.5 bg-red-100 text-red-700 rounded hover:bg-red-200 transition-colors" 
                                            title="삭제"
                                            type="button">
                                        <i class="fas fa-trash text-sm"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 빈 상태 -->
            <div th:if="${bannerPage.content.isEmpty()}" class="text-center py-12">
                <i class="fas fa-image text-4xl text-gray-400 mb-4"></i>
                <h3 class="text-lg font-medium text-gray-900 mb-2">등록된 배너가 없습니다</h3>
                <p class="text-gray-500 mb-4">새로운 배너를 등록해보세요.</p>
                <a href="/banner/new" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    <i class="fas fa-plus mr-2"></i>새 배너 등록
                </a>
            </div>
        </div>

        <!-- 페이징 -->
        <div th:if="${bannerPage.totalPages > 1}" class="flex items-center justify-between">
            <div class="text-sm text-gray-700">
                <span th:text="${bannerPage.number + 1}">1</span> / <span th:text="${bannerPage.totalPages}">1</span> 페이지
                (총 <span th:text="${bannerPage.totalElements}">0</span>개)
            </div>
            <div class="flex space-x-2">
                <a th:if="${bannerPage.hasPrevious()}" 
                   th:href="@{/banner(page=${bannerPage.number - 1}, sortField=${sortField}, sortDir=${sortDir})}" 
                   class="px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                    이전
                </a>
                <a th:if="${bannerPage.hasNext()}" 
                   th:href="@{/banner(page=${bannerPage.number + 1}, sortField=${sortField}, sortDir=${sortDir})}" 
                   class="px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                    다음
                </a>
            </div>
        </div>
    </div>

    <script>
        function toggleBanner(id) {
            if (confirm('배너 상태를 변경하시겠습니까?')) {
                fetch(`/banner/${id}/toggle`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        return response.text().then(text => {
                            alert('상태 변경에 실패했습니다: ' + text);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                });
            }
        }

        function deleteBanner(id) {
            if (confirm('정말로 이 배너를 삭제하시겠습니까?')) {
                fetch(`/banner/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        return response.text().then(text => {
                            alert('삭제에 실패했습니다: ' + text);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                });
            }
        }
    </script>
</div>
