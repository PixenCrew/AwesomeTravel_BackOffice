<div th:fragment="content">
    <div class="space-y-6">
        <!-- 페이지 헤더 -->
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900" th:text="${banner.id != null ? '배너 수정' : '새 배너 등록'}">새 배너 등록</h2>
                <p class="text-sm text-gray-600 mt-1">배너 정보를 입력하고 이미지를 업로드하세요.</p>
            </div>
            <a href="/banner" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">
                <i class="fas fa-arrow-left mr-2"></i>목록으로
            </a>
        </div>

        <!-- 메시지 표시 -->
        <div th:if="${message}" class="p-4 bg-green-100 text-green-800 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${message}">성공 메시지</span>
            </div>
        </div>
        
        <div th:if="${error}" class="p-4 bg-red-100 text-red-800 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${error}">오류 메시지</span>
            </div>
        </div>

        <!-- 배너 등록/수정 폼 -->
        <div class="bg-white rounded-lg shadow-sm p-6">
            <form th:action="${banner.id != null ? '/banner' : '/banner'}" 
                  method="POST" 
                  enctype="multipart/form-data"
                  class="space-y-6">
                
                <!-- ID (수정 시에만) -->
                <input th:if="${banner.id != null}" type="hidden" name="id" th:value="${banner.id}">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 제목 -->
                    <div class="md:col-span-2">
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-2">제목 *</label>
                        <input type="text" 
                               id="title" 
                               name="title" 
                               th:value="${banner.title}"
                               placeholder="배너 제목을 입력하세요"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <!-- 표시 순서 -->
                    <div>
                        <label for="displayOrder" class="block text-sm font-medium text-gray-700 mb-2">표시 순서 *</label>
                        <input type="number" 
                               id="displayOrder" 
                               name="displayOrder" 
                               th:value="${banner.displayOrder}"
                               placeholder="1"
                               min="1"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <p class="text-xs text-gray-500 mt-1">숫자가 작을수록 먼저 표시됩니다.</p>
                    </div>

                    <!-- 활성 상태 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">활성 상태</label>
                        <div class="flex items-center space-x-4">
                            <label class="flex items-center">
                                <input type="radio" 
                                       name="active" 
                                       value="true" 
                                       th:checked="${banner.active == null || banner.active == true}"
                                       class="mr-2">
                                <span class="text-sm text-gray-700">활성</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" 
                                       name="active" 
                                       value="false" 
                                       th:checked="${banner.active == false}"
                                       class="mr-2">
                                <span class="text-sm text-gray-700">비활성</span>
                            </label>
                        </div>
                    </div>

                    <!-- 시작 날짜 -->
                    <div>
                        <label for="startDate" class="block text-sm font-medium text-gray-700 mb-2">시작 날짜 *</label>
                        <input type="date" 
                               id="startDate" 
                               name="startDate" 
                               th:value="${banner.startDate != null ? #temporals.format(banner.startDate, 'yyyy-MM-dd') : ''}"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <!-- 종료 날짜 -->
                    <div>
                        <label for="endDate" class="block text-sm font-medium text-gray-700 mb-2">종료 날짜 *</label>
                        <input type="date" 
                               id="endDate" 
                               name="endDate" 
                               th:value="${banner.endDate != null ? #temporals.format(banner.endDate, 'yyyy-MM-dd') : ''}"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <!-- 배너 위치 타입 -->
                    <div>
                        <label for="locationType" class="block text-sm font-medium text-gray-700 mb-2">배너 위치 타입 *</label>
                        <select id="locationType" 
                                name="locationType" 
                                required
                                onchange="updateLocationIdentifierField()"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">선택하세요</option>
                            <option value="HOME" th:selected="${banner.locationType != null && banner.locationType.name() == 'HOME'}">홈페이지 메인</option>
                            <option value="SUB_MENU" th:selected="${banner.locationType != null && banner.locationType.name() == 'SUB_MENU'}">서브메뉴 페이지</option>
                            <option value="AIR_SEARCH" th:selected="${banner.locationType != null && banner.locationType.name() == 'AIR_SEARCH'}">항공선택 페이지</option>
                            <option value="PRODUCT_LIST" th:selected="${banner.locationType != null && banner.locationType.name() == 'PRODUCT_LIST'}">상품 목록 페이지</option>
                            <option value="PRODUCT_DETAIL" th:selected="${banner.locationType != null && banner.locationType.name() == 'PRODUCT_DETAIL'}">상품 상세 페이지</option>
                        </select>
                        <p class="text-xs text-gray-500 mt-1">배너가 표시될 위치를 선택하세요.</p>
                    </div>

                    <!-- 위치 식별자 -->
                    <div id="locationIdentifierGroup">
                        <label for="locationIdentifier" class="block text-sm font-medium text-gray-700 mb-2">
                            위치 식별자
                            <span id="locationIdentifierLabel" class="text-xs text-gray-500">(선택사항)</span>
                        </label>
                        <input type="text" 
                               id="locationIdentifier" 
                               name="locationIdentifier" 
                               th:value="${banner.locationIdentifier}"
                               placeholder="예: 101, 201, air_search 등"
                               maxlength="50"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <p id="locationIdentifierHelp" class="text-xs text-gray-500 mt-1">
                            서브메뉴 페이지인 경우 메뉴 코드(예: 101, 201)를 입력하세요.
                        </p>
                    </div>

                    <!-- URL -->
                    <div class="md:col-span-2">
                        <label for="url" class="block text-sm font-medium text-gray-700 mb-2">연결 URL *</label>
                        <input type="url" 
                               id="url" 
                               name="url" 
                               th:value="${banner.url}"
                               placeholder="https://example.com"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <p class="text-xs text-gray-500 mt-1">배너 클릭 시 이동할 URL을 입력하세요.</p>
                    </div>

                    <!-- 이미지 업로드 -->
                    <div class="md:col-span-2">
                        <label for="file" class="block text-sm font-medium text-gray-700 mb-2">배너 이미지 *</label>
                        <div class="mt-1">
                            <input type="text" id="fileUrl" name="fileUrl" th:value="${banner?.file}" placeholder="이미지 URL (자동 입력)" readonly
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-2" />
                            <input type="file" id="file" name="file" onchange="uploadImage(this, 'banner')" accept="image/*" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg" th:required="${banner.id == null}" />
                        </div>
                        
                        <!-- 현재 이미지 (수정 시) -->
                        <div th:if="${banner.id != null && banner.file != null && !banner.file.isEmpty()}" class="mt-4">
                            <p class="text-sm font-medium text-gray-700 mb-2">현재 이미지:</p>
                            <img th:src="@{${banner.file}}" 
                                 alt="현재 배너 이미지" 
                                 class="h-32 w-48 object-cover rounded-lg border">
                        </div>
                    </div>
                </div>

                <!-- 폼 버튼 -->
                <div class="flex justify-end space-x-4 pt-6 border-t border-gray-200">
                    <a href="/banner" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                        취소
                    </a>
                    <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        <i class="fas fa-save mr-2"></i>
                        <span th:text="${banner.id != null ? '수정' : '등록'}">등록</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 파일 업로드 미리보기
        document.getElementById('file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // 기존 미리보기 제거
                    const existingPreview = document.querySelector('.image-preview');
                    if (existingPreview) {
                        existingPreview.remove();
                    }
                    
                    // 새 미리보기 추가
                    const preview = document.createElement('div');
                    preview.className = 'image-preview mt-4';
                    preview.innerHTML = `
                        <p class="text-sm font-medium text-gray-700 mb-2">미리보기:</p>
                        <img src="${e.target.result}" alt="미리보기" class="h-32 w-48 object-cover rounded-lg border">
                    `;
                    document.getElementById('file').parentNode.parentNode.appendChild(preview);
                };
                reader.readAsDataURL(file);
            }
        });

        // 날짜 유효성 검사
        document.getElementById('startDate').addEventListener('change', function() {
            const startDate = new Date(this.value);
            const endDateInput = document.getElementById('endDate');
            const endDate = new Date(endDateInput.value);
            
            if (endDateInput.value && endDate < startDate) {
                alert('종료 날짜는 시작 날짜보다 늦어야 합니다.');
                endDateInput.value = '';
            }
        });

        document.getElementById('endDate').addEventListener('change', function() {
            const endDate = new Date(this.value);
            const startDateInput = document.getElementById('startDate');
            const startDate = new Date(startDateInput.value);
            
            if (startDateInput.value && endDate < startDate) {
                alert('종료 날짜는 시작 날짜보다 늦어야 합니다.');
                this.value = '';
            }
        });

        // 배너 위치 타입에 따라 위치 식별자 필드 업데이트
        function updateLocationIdentifierField() {
            const locationType = document.getElementById('locationType').value;
            const locationIdentifierGroup = document.getElementById('locationIdentifierGroup');
            const locationIdentifierInput = document.getElementById('locationIdentifier');
            const locationIdentifierLabel = document.getElementById('locationIdentifierLabel');
            const locationIdentifierHelp = document.getElementById('locationIdentifierHelp');

            if (locationType === 'SUB_MENU') {
                locationIdentifierGroup.style.display = 'block';
                locationIdentifierInput.required = true;
                locationIdentifierLabel.textContent = '(필수)';
                locationIdentifierHelp.textContent = '서브메뉴 페이지인 경우 메뉴 코드를 입력해야 합니다. 예: 101, 201, 601 등';
            } else if (locationType === 'AIR_SEARCH') {
                locationIdentifierGroup.style.display = 'block';
                locationIdentifierInput.required = true;
                locationIdentifierLabel.textContent = '(필수)';
                locationIdentifierInput.value = 'air_search';
                locationIdentifierHelp.textContent = '항공배너의 경우 "air_search"를 입력해야 합니다.';
            } else if (locationType === 'PRODUCT_LIST' || locationType === 'PRODUCT_DETAIL') {
                locationIdentifierGroup.style.display = 'block';
                locationIdentifierInput.required = false;
                locationIdentifierLabel.textContent = '(선택사항)';
                locationIdentifierHelp.textContent = '상품 목록/상세 페이지의 경우 특별한 식별자가 필요하지 않습니다.';
            } else if (locationType === 'HOME') {
                locationIdentifierGroup.style.display = 'block';
                locationIdentifierInput.required = false;
                locationIdentifierLabel.textContent = '(선택사항)';
                locationIdentifierHelp.textContent = '홈페이지 메인 배너의 경우 특별한 식별자가 필요하지 않습니다. 입력하지 않아도 됩니다.';
            } else {
                locationIdentifierGroup.style.display = 'block';
                locationIdentifierInput.required = false;
                locationIdentifierLabel.textContent = '(선택사항)';
                locationIdentifierHelp.textContent = '';
            }
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            updateLocationIdentifierField();
        });
    </script>
</div>
