<div th:fragment="content">
  <div class="px-4 sm:px-6 lg:px-8">
    <!-- 성공/오류 메시지 -->
    <div th:if="${message}" class="mb-4 rounded-md bg-green-50 p-4">
      <div class="flex">
        <div class="ml-3">
          <h3 class="text-sm font-medium text-green-800" th:text="${message}"></h3>
        </div>
      </div>
    </div>
    
    <div th:if="${error}" class="mb-4 rounded-md bg-red-50 p-4">
      <div class="flex">
        <div class="ml-3">
          <h3 class="text-sm font-medium text-red-800" th:text="${error}"></h3>
        </div>
      </div>
    </div>

    <div class="sm:flex sm:items-center">
      <div class="sm:flex-auto">
        <h1 class="text-base font-semibold leading-6 text-gray-900">상품카테고리 관리</h1>
        <p class="mt-2 text-sm text-gray-700">엑셀 업로드로 지역 카테고리를 등록할 수 있습니다.</p>
      </div>
      <div class="mt-4 sm:ml-16 sm:mt-0 sm:flex-none">
        <form th:action="@{/category/upload}" method="post" enctype="multipart/form-data" class="flex items-center space-x-2">
          <th:block th:if="${_csrf != null}">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
          </th:block>
          <input type="file" name="file" accept=".xlsx,.xls" class="text-sm" required />
          
          <!-- 업로드 방식 선택 -->
          <div class="flex items-center space-x-2">
            <label class="flex items-center">
              <input type="radio" name="replaceAll" value="false" checked class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300">
              <span class="ml-2 text-sm text-gray-700">추가</span>
            </label>
            <label class="flex items-center">
              <input type="radio" name="replaceAll" value="true" class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300">
              <span class="ml-2 text-sm text-gray-700">교체</span>
            </label>
          </div>
          
          <button class="inline-flex items-center rounded-md bg-purple-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-purple-500">엑셀 업로드</button>
        </form>
      </div>
    </div>

    <form th:action="@{/category}" method="get" class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-6">
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium leading-6 text-gray-900">이름</label>
        <input type="text" name="name" th:value="${searchName}" class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-purple-600 sm:text-sm sm:leading-6" />
      </div>
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium leading-6 text-gray-900">타입</label>
        <input type="text" name="type" th:value="${searchType}" class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-purple-600 sm:text-sm sm:leading-6" />
      </div>
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium leading-6 text-gray-900">국가코드</label>
        <input type="text" name="countryCode" th:value="${searchCountryCode}" class="mt-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-purple-600 sm:text-sm sm:leading-6" />
      </div>
      <div class="sm:col-span-1 flex items-end">
        <button class="w-full rounded-md bg-gray-800 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-gray-700">검색</button>
      </div>
    </form>

    <div class="mt-6 flow-root">
      <div class="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
        <div class="inline-block min-w-full py-2 align-middle sm:px-6 lg:px-8">
          <table class="min-w-full divide-y divide-gray-300">
            <thead>
              <tr>
                <th class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-0">ID</th>
                <th class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">이름</th>
                <th class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">타입</th>
                <th class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">국가코드</th>
                <th class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">작업</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
              <tr th:each="c : ${categories}">
                <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-0" th:text="${c.id}">1</td>
                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500" th:text="${c.name}">서울</td>
                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500" th:text="${c.type}">CITY</td>
                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500" th:text="${c.countryCode}">KR</td>
                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                  <div class="flex space-x-2">
                    <button type="button" 
                            th:data-id="${c.id}"
                            th:data-name="${c.name}"
                            th:data-type="${c.type}"
                            th:data-country-code="${c.countryCode}"
                            onclick="editCategoryFromData(this)"
                            class="text-indigo-600 hover:text-indigo-900">수정</button>
                    <button type="button" 
                            th:data-id="${c.id}"
                            onclick="deleteCategoryFromData(this)"
                            class="text-red-600 hover:text-red-900">삭제</button>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="5" class="px-3 py-6 text-center text-sm text-gray-500">표시할 카테고리가 없습니다.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div th:if="${totalPages > 1}" class="mt-6 flex justify-center">
      <nav class="flex items-center space-x-1">
        <!-- 첫 페이지로 -->
        <a th:if="${currentPage > 0}" th:href="@{/category(page=0, name=${searchName}, type=${searchType}, countryCode=${searchCountryCode})}" class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50">처음</a>
        
        <!-- 이전 페이지 -->
        <a th:if="${currentPage > 0}" th:href="@{/category(page=${currentPage - 1}, name=${searchName}, type=${searchType}, countryCode=${searchCountryCode})}" class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50">이전</a>
        
        <!-- 페이지 번호들 -->
        <div class="flex space-x-1">
          <!-- 시작 페이지 계산 -->
          <th:block th:with="startPage=${T(java.lang.Math).max(0, currentPage - 2)}">
            <!-- 끝 페이지 계산 -->
            <th:block th:with="endPage=${T(java.lang.Math).min(totalPages - 1, currentPage + 2)}">
              <!-- 페이지 번호 표시 -->
              <a th:each="p : ${#numbers.sequence(startPage, endPage)}" 
                 th:href="@{/category(page=${p}, name=${searchName}, type=${searchType}, countryCode=${searchCountryCode})}" 
                 th:text="${p + 1}" 
                 th:class="${p == currentPage ? 'bg-purple-600 text-white' : 'bg-white text-gray-700'} + ' px-3 py-2 text-sm font-medium border border-gray-300 rounded-md hover:bg-gray-50'">1</a>
            </th:block>
          </th:block>
        </div>
        
        <!-- 다음 페이지 -->
        <a th:if="${currentPage < totalPages - 1}" th:href="@{/category(page=${currentPage + 1}, name=${searchName}, type=${searchType}, countryCode=${searchCountryCode})}" class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50">다음</a>
        
        <!-- 마지막 페이지로 -->
        <a th:if="${currentPage < totalPages - 1}" th:href="@{/category(page=${totalPages - 1}, name=${searchName}, type=${searchType}, countryCode=${searchCountryCode})}" class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50">마지막</a>
      </nav>
    </div>
    
    <!-- 페이지 정보 표시 -->
    <div th:if="${totalPages > 1}" class="mt-2 text-center text-sm text-gray-500">
      <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span> 페이지
    </div>
  </div>

  <!-- 수정 모달 -->
  <div id="editModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
      <div class="mt-3">
        <h3 class="text-lg font-medium text-gray-900 mb-4">카테고리 수정</h3>
        <form id="editForm" method="post">
          <th:block th:if="${_csrf != null}">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
          </th:block>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">이름</label>
            <input type="text" id="editName" name="name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" required>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">타입</label>
            <input type="text" id="editType" name="type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" required>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">국가코드</label>
            <input type="text" id="editCountryCode" name="countryCode" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
          </div>
          <div class="flex justify-end space-x-2">
            <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">취소</button>
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">수정</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function editCategoryFromData(button) {
      var id = button.getAttribute('data-id');
      var name = button.getAttribute('data-name');
      var type = button.getAttribute('data-type');
      var countryCode = button.getAttribute('data-country-code');
      
      document.getElementById('editName').value = name;
      document.getElementById('editType').value = type;
      document.getElementById('editCountryCode').value = countryCode || '';
      document.getElementById('editForm').action = '/category/' + id + '/update';
      document.getElementById('editModal').classList.remove('hidden');
    }

    function deleteCategoryFromData(button) {
      var id = button.getAttribute('data-id');
      
      if (confirm('정말로 삭제하시겠습니까?')) {
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '/category/' + id + '/delete';
        
        var csrfToken = document.querySelector('input[name="_csrf"]');
        if (csrfToken) {
          var csrfInput = document.createElement('input');
          csrfInput.type = 'hidden';
          csrfInput.name = '_csrf';
          csrfInput.value = csrfToken.value;
          form.appendChild(csrfInput);
        }
        
        document.body.appendChild(form);
        form.submit();
      }
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    // 모달 외부 클릭 시 닫기
    document.getElementById('editModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeEditModal();
      }
    });
  </script>
</div>
