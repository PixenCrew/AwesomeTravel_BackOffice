<div th:fragment="content">
    <div class="space-y-6">
        <!-- 페이지 헤더 -->
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900" th:text="${countryCode.code != null && !countryCode.code.isEmpty() ? '국가 코드 수정' : '새 국가 코드 등록'}">새 국가 코드 등록</h2>
                <p class="text-sm text-gray-600 mt-1">국가 코드 정보를 입력하세요.</p>
            </div>
            <a href="/country-code" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">
                <i class="fas fa-arrow-left mr-2"></i>목록으로
            </a>
        </div>

        <!-- 메시지 표시 -->
        <div th:if="${error}" class="p-4 bg-red-100 text-red-800 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${error}">오류 메시지</span>
            </div>
        </div>

        <!-- 국가 코드 등록/수정 폼 -->
        <div class="bg-white rounded-lg shadow-sm p-6">
            <form th:action="@{/country-code}" method="POST" class="space-y-6">
                <!-- 원본 코드 (수정시에만) -->
                <input th:if="${countryCode.code != null && !countryCode.code.isEmpty()}" 
                       type="hidden" name="originalCode" th:value="${countryCode.code}">

                <div class="grid grid-cols-1 gap-6">
                    <!-- 국가 코드 -->
                    <div>
                        <label for="code" class="block text-sm font-medium text-gray-700 mb-2">국가 코드 * (ISO 3166)</label>
                        <input type="text" 
                               id="code" 
                               name="code" 
                               th:value="${countryCode.code}"
                               placeholder="예: KR, US, JP"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase">
                        <p class="text-xs text-gray-500 mt-1">대문자 영문 코드를 입력하세요 (예: KR, US, JP)</p>
                    </div>

                    <!-- 국가명 (한글) -->
                    <div>
                        <label for="nameKor" class="block text-sm font-medium text-gray-700 mb-2">국가명 (한글) *</label>
                        <input type="text" 
                               id="nameKor" 
                               name="nameKor" 
                               th:value="${countryCode.nameKor}"
                               placeholder="예: 대한민국"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <!-- 국가명 (영문) -->
                    <div>
                        <label for="nameEng" class="block text-sm font-medium text-gray-700 mb-2">국가명 (영문) *</label>
                        <input type="text" 
                               id="nameEng" 
                               name="nameEng" 
                               th:value="${countryCode.nameEng}"
                               placeholder="예: South Korea"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <!-- 폼 버튼 -->
                <div class="flex justify-end space-x-4 pt-6 border-t border-gray-200">
                    <a href="/country-code" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                        취소
                    </a>
                    <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        <i class="fas fa-save mr-2"></i>
                        <span th:text="${countryCode.code != null && !countryCode.code.isEmpty() ? '수정' : '등록'}">등록</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 국가 코드 입력 시 대문자로 자동 변환
        document.getElementById('code').addEventListener('input', function(e) {
            this.value = this.value.toUpperCase();
        });
    </script>
</div>
