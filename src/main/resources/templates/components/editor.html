<div th:fragment="content">
    <!-- Quill CSS & JS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <!-- 툴바 + 토글 버튼 -->
    <div style="margin-bottom: 10px;">
        <div id="toolbar">
            <!-- 툴바 버튼들 -->
            <button class="ql-bold"></button>
            <button class="ql-italic"></button>
            <button class="ql-underline"></button>
            <button class="ql-image"></button>
        </div>
        <button id="toggleView" style="margin-top: 10px;">HTML 보기</button>
    </div>

    <!-- 에디터 -->
    <div id="editor" style="height: 300px;"></div>

    <!-- HTML 코드 보기용 textarea -->
    <textarea id="htmlView" style="display: none; width: 100%; height: 300px;"></textarea>

    <script>
        // 이미지 핸들러: 이미지 → base64 삽입
        function imageHandler() {
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();

            input.onchange = () => {
                const file = input.files[0];
                const reader = new FileReader();

                reader.onload = (e) => {
                    const base64 = e.target.result;
                    const range = quill.getSelection();
                    quill.insertEmbed(range.index, 'image', base64);
                };

                reader.readAsDataURL(file);
            };
        }

        // Quill 초기화
        const quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: {
                    container: '#toolbar',
                    handlers: {
                        image: imageHandler
                    }
                }
            }
        });

        // HTML 보기/편집기 보기 전환 버튼
        const toggleBtn = document.getElementById('toggleView');
        const htmlView = document.getElementById('htmlView');
        const editor = document.getElementById('editor');

        let showingHtml = false;

        toggleBtn.addEventListener('click', () => {
            if (!showingHtml) {
                // Quill → HTML 보기
                const html = quill.root.innerHTML;
                htmlView.value = html;
                htmlView.style.display = 'block';
                editor.style.display = 'none';
                toggleBtn.innerText = '편집기로 돌아가기';
                showingHtml = true;
            } else {
                // HTML → Quill 다시 편집
                const html = htmlView.value;
                quill.root.innerHTML = html;
                htmlView.style.display = 'none';
                editor.style.display = 'block';
                toggleBtn.innerText = 'HTML 보기';
                showingHtml = false;
            }
        });
    </script>
</div>
