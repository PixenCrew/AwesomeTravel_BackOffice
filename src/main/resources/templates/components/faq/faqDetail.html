<div th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- 성공/실패 메시지 알림 -->
    <div th:if="${message}" class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-md">
      <div class="flex items-center">
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${message}">성공 메시지</span>
      </div>
    </div>
    <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-md">
      <div class="flex items-center">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}">오류 메시지</span>
      </div>
    </div>

    <div class="max-w-4xl mx-auto">
      <!-- 헤더 -->
      <div class="mb-6 flex justify-between items-center">
        <div>
          <h2 class="text-2xl font-bold text-gray-900">FAQ 상세</h2>
          <p class="text-gray-600 mt-2">FAQ 정보를 확인할 수 있습니다.</p>
        </div>
        <div class="flex space-x-3">
          <a th:href="@{/faq/edit/{id}(id=${faq.id})}" 
             class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
            <i class="fas fa-edit mr-2"></i>수정
          </a>
          <a href="/faq" 
             class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600">
            <i class="fas fa-list mr-2"></i>목록
          </a>
        </div>
      </div>

      <!-- FAQ 정보 -->
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <!-- 기본 정보 -->
        <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-medium text-gray-900">기본 정보</h3>
            <div class="flex items-center space-x-2">
              <span class="text-sm text-gray-500">등록일:</span>
              <span class="text-sm font-medium text-gray-900" th:text="${#temporals.format(faq.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</span>
            </div>
          </div>
        </div>

        <div class="px-6 py-4 space-y-6">
          <!-- 질문 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">질문</label>
            <div class="p-4 bg-gray-50 rounded-md">
              <p class="text-gray-900" th:text="${faq.question}">FAQ 질문</p>
            </div>
          </div>

          <!-- 답변 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">답변</label>
            <div class="p-4 bg-gray-50 rounded-md">
              <div class="prose max-w-none" th:utext="${faq.answer}">FAQ 답변</div>
            </div>
          </div>

          <!-- 카테고리 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">카테고리</label>
            <div class="flex items-center">
              <span th:switch="${faq.category}">
                <span th:case="'MEMBER'" class="inline-flex px-3 py-1 text-sm font-semibold rounded-full bg-blue-100 text-blue-800" th:text="${faq.category.getDisplayName()}">회원</span>
                <span th:case="'PAYMENT'" class="inline-flex px-3 py-1 text-sm font-semibold rounded-full bg-yellow-100 text-yellow-800" th:text="${faq.category.getDisplayName()}">결제</span>
                <span th:case="'RESERVATION'" class="inline-flex px-3 py-1 text-sm font-semibold rounded-full bg-green-100 text-green-800" th:text="${faq.category.getDisplayName()}">예약</span>
                <span th:case="*" class="inline-flex px-3 py-1 text-sm font-semibold rounded-full bg-gray-100 text-gray-800" th:text="${faq.category.getDisplayName()}">기타</span>
              </span>
            </div>
          </div>

          <!-- 상태 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">상태</label>
            <div class="flex items-center">
              <span class="inline-flex px-3 py-1 text-sm font-semibold rounded-full" 
                    th:class="${faq.visible} ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'"
                    th:text="${faq.visible} ? '공개' : '숨김'">공개</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 액션 버튼 -->
      <div class="mt-6 flex justify-between">
        <a href="/faq" 
           class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <i class="fas fa-arrow-left mr-2"></i>목록으로
        </a>
        <div class="flex space-x-3">
          <a th:href="@{/faq/edit/{id}(id=${faq.id})}" 
             class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <i class="fas fa-edit mr-2"></i>수정
          </a>
          <button type="button" 
                  onclick="deleteFaq([[${faq.id}]])" 
                  class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500">
            <i class="fas fa-trash mr-2"></i>삭제
          </button>
        </div>
      </div>

      <!-- 삭제 폼 (숨김) -->
      <form th:id="'deleteForm' + ${faq.id}" 
            method="POST" 
            th:action="@{/faq/delete/{id}(id=${faq.id})}" 
            style="display: none;">
        <th:block th:if="${_csrf != null}">
          <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        </th:block>
      </form>
    </div>

    <script th:inline="javascript">
      function deleteFaq(faqId) {
        if(confirm('정말 삭제하시겠습니까?')) {
          var form = document.getElementById('deleteForm' + faqId);
          if(form) form.submit();
          else alert('삭제 폼이 존재하지 않습니다.');
        }
      }
    </script>
</div>
