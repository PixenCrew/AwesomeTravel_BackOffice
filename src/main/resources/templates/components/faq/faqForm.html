<div th:fragment="content">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- 성공/실패 메시지 알림 -->
    <div th:if="${message}" class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-md">
      <div class="flex items-center">
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${message}">성공 메시지</span>
      </div>
    </div>
    <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-md">
      <div class="flex items-center">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}">오류 메시지</span>
      </div>
    </div>

    <div class="max-w-4xl mx-auto">
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900" th:text="${faqId != null ? 'FAQ 수정' : 'FAQ 등록'}">FAQ 등록</h2>
        <p class="text-gray-600 mt-2" th:text="${faqId != null ? 'FAQ 정보를 수정할 수 있습니다.' : '새로운 FAQ를 등록할 수 있습니다.'}">새로운 FAQ를 등록할 수 있습니다.</p>
      </div>

      <div class="bg-white rounded-lg shadow-sm border border-gray-200">
        <form th:action="${faqId != null ? '/faq/edit/' + faqId : '/faq/new'}" 
              method="POST" 
              class="p-6 space-y-6">
          
          <!-- CSRF 토큰 -->
          <th:block th:if="${_csrf != null}">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
          </th:block>

          <!-- 질문 -->
          <div>
            <label for="question" class="block text-sm font-medium text-gray-700 mb-2">
              질문 <span class="text-red-500">*</span>
            </label>
            <input type="text" 
                   id="question" 
                   name="question" 
                   th:value="${faq.question}"
                   placeholder="FAQ 질문을 입력하세요"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                   required>
          </div>

          <!-- 답변 -->
          <div>
            <label for="answer" class="block text-sm font-medium text-gray-700 mb-2">
              답변 <span class="text-red-500">*</span>
            </label>
            <textarea id="answer" 
                      name="answer" 
                      rows="8"
                      placeholder="FAQ 답변을 입력하세요"
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                      required
                      th:text="${faq.answer}"></textarea>
          </div>

          <!-- 카테고리 -->
          <div>
            <label for="category" class="block text-sm font-medium text-gray-700 mb-2">
              카테고리 <span class="text-red-500">*</span>
            </label>
            <select id="category" 
                    name="category" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    required>
              <option value="">카테고리를 선택하세요</option>
              <option value="MEMBER" th:selected="${faq.category == 'MEMBER'}">회원</option>
              <option value="PAYMENT" th:selected="${faq.category == 'PAYMENT'}">결제</option>
              <option value="RESERVATION" th:selected="${faq.category == 'RESERVATION'}">예약</option>
              <option value="ETC" th:selected="${faq.category == 'ETC'}">기타</option>
            </select>
          </div>

          <!-- 상태 -->
          <div>
            <label class="flex items-center">
              <input type="checkbox" 
                     name="visible" 
                     value="true"
                     th:checked="${faq.visible}"
                     class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
              <span class="ml-2 text-sm text-gray-700">공개 상태</span>
            </label>
            <p class="mt-1 text-xs text-gray-500">체크 해제하면 FAQ가 숨김 처리됩니다.</p>
          </div>

          <!-- 버튼 -->
          <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
            <a href="/faq" 
               class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <i class="fas fa-times mr-2"></i>취소
            </a>
            <button type="submit" 
                    class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <i class="fas fa-save mr-2"></i>
              <span th:text="${faqId != null ? '수정' : '등록'}">등록</span>
            </button>
          </div>
        </form>
      </div>
    </div>
</div>
