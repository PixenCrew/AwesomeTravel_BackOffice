<div th:fragment="content">
    <div class="space-y-6">
        <!-- 페이지 헤더 -->
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">파일 관리</h2>
                <p class="text-sm text-gray-600 mt-1">업로드된 파일들을 조회하고 관리합니다.</p>
            </div>
            <div class="flex space-x-3">
                <button onclick="runCleanup()" class="px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 transition-colors duration-200">
                    <i class="fas fa-broom mr-2"></i>깨진 파일 정리
                </button>
                <a href="/test-upload.html" target="_blank" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors duration-200">
                    <i class="fas fa-upload mr-2"></i>업로드 테스트
                </a>
            </div>
        </div>

        <!-- 메시지 표시 -->
        <div id="message" class="hidden p-4 bg-green-100 text-green-800 rounded-lg">
            <div class="flex items-center">
                <i class="fas fa-check-circle mr-2"></i>
                <span id="messageText"></span>
            </div>
        </div>
        
        <div id="error" class="hidden p-4 bg-red-100 text-red-800 rounded-lg">
            <div class="flex items-center">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span id="errorText"></span>
            </div>
        </div>

        <!-- 파일 목록 -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="overflow-x-auto -mx-4 sm:mx-0">
                <div class="inline-block min-w-full align-middle">
                    <div class="overflow-hidden">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-20">ID</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider min-w-[150px] max-w-[200px]">파일명</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-24">타입</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-28">업로드 방식</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-24">크기</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-24">이미지</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-32">등록일</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-40">작업</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <tr th:each="file : ${files}" class="hover:bg-gray-50">
                                    <td class="px-4 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${file.id}">
                                    </td>
                                    <td class="px-4 py-4 text-sm text-gray-900">
                                        <div class="truncate" style="max-width: 200px;" th:title="${file.originalFilename}" th:text="${file.originalFilename}">
                                        </div>
                                    </td>
                                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500">
                                        <div class="truncate" style="max-width: 100px;" th:title="${file.mimeType}" th:text="${file.mimeType}">
                                        </div>
                                    </td>
                                    <td class="px-4 py-4 whitespace-nowrap">
                                        <span th:if="${file.uploadType == 'DRIVE'}" 
                                              class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                                            Drive
                                        </span>
                                        <span th:if="${file.uploadType == 'LOCAL'}" 
                                              class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">
                                            로컬
                                        </span>
                                    </td>
                                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#numbers.formatDecimal(file.fileSize / 1024.0, 1, 2)} + ' KB'">
                                    </td>
                                    <td class="px-4 py-4 text-sm">
                                        <img th:if="${file.driveImageUrl != null and #strings.startsWith(file.mimeType, 'image/')}" 
                                             th:src="${file.driveImageUrl}" 
                                             alt="미리보기"
                                             class="h-12 w-12 object-cover rounded border border-gray-300 cursor-pointer hover:opacity-75"
                                             th:attr="onclick='openImageModal(\'' + ${file.driveImageUrl} + '\')'">
                                        <span th:if="${file.driveImageUrl == null or !#strings.startsWith(file.mimeType, 'image/')}" 
                                              class="text-gray-400 text-xs">-</span>
                                    </td>
                                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500" 
                                        th:text="${#temporals.format(file.createdAt, 'yyyy-MM-dd HH:mm')}">
                                    </td>
                                    <td class="px-4 py-4 whitespace-nowrap text-sm font-medium">
                                        <div class="flex items-center space-x-1 flex-wrap gap-1">
                                            <a th:if="${file.driveWebViewLink != null}" 
                                               th:href="${file.driveWebViewLink}" 
                                               target="_blank"
                                               class="inline-flex items-center justify-center px-2 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition-colors"
                                               title="Google Drive에서 보기">
                                                <i class="fas fa-external-link-alt text-xs"></i>
                                            </a>
                                            <a th:if="${file.driveImageUrl != null and #strings.startsWith(file.mimeType, 'image/')}" 
                                               th:href="${file.driveImageUrl}" 
                                               target="_blank"
                                               class="inline-flex items-center justify-center px-2 py-1 bg-green-100 text-green-700 rounded hover:bg-green-200 transition-colors"
                                               title="이미지 보기">
                                                <i class="fas fa-image text-xs"></i>
                                            </a>
                                            <button th:onclick="'deleteFile(' + ${file.id} + ')'"
                                                    class="inline-flex items-center justify-center px-2 py-1 bg-red-100 text-red-700 rounded hover:bg-red-200 transition-colors"
                                                    title="삭제">
                                                <i class="fas fa-trash text-xs"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(files)}">
                                    <td colspan="8" class="px-4 py-4 text-center text-sm text-gray-500">
                                        등록된 파일이 없습니다.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 이미지 모달 -->
    <div id="imageModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50" onclick="closeImageModal()">
        <div class="max-w-4xl max-h-full p-4">
            <img id="modalImage" src="" alt="미리보기" class="max-w-full max-h-full object-contain rounded">
            <button onclick="closeImageModal()" class="absolute top-4 right-4 text-white hover:text-gray-300">
                <i class="fas fa-times text-2xl"></i>
            </button>
        </div>
    </div>

    <script>
        // 파일 삭제
        function deleteFile(fileId) {
            if (!confirm('정말로 이 파일을 삭제하시겠습니까?\nGoogle Drive에서도 삭제됩니다.')) {
                return;
            }

            fetch('/api/files/' + fileId, {
                method: 'DELETE',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                if (response.ok) {
                    showMessage('파일이 삭제되었습니다.');
                    setTimeout(() => location.reload(), 1000);
                } else {
                    showError('파일 삭제에 실패했습니다.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('파일 삭제 중 오류가 발생했습니다.');
            });
        }

        // 깨진 파일 정리
        function runCleanup() {
            if (!confirm('깨진 파일을 정리하시겠습니까?\nGoogle Drive에서 수동으로 삭제된 파일의 DB 레코드를 정리합니다.')) {
                return;
            }

            fetch('/api/files/cleanup', {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('파일 정리가 완료되었습니다. 정리된 항목: ' + data.cleanedCount + '개');
                    setTimeout(() => location.reload(), 1500);
                } else {
                    showError('파일 정리 실패: ' + (data.message || '알 수 없는 오류'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('파일 정리 중 오류가 발생했습니다.');
            });
        }

        // 이미지 모달 열기
        function openImageModal(imageUrl) {
            document.getElementById('modalImage').src = imageUrl;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        // 이미지 모달 닫기
        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
            document.getElementById('modalImage').src = '';
        }

        // 메시지 표시
        function showMessage(message) {
            document.getElementById('messageText').textContent = message;
            document.getElementById('message').classList.remove('hidden');
            document.getElementById('error').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('message').classList.add('hidden');
            }, 3000);
        }

        // 에러 메시지 표시
        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('message').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('error').classList.add('hidden');
            }, 5000);
        }
    </script>
</div>
