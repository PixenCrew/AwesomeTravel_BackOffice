<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">호텔 예약 현황</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-50 py-6">
    <!-- 헤더 -->
    <div class="sm:flex sm:items-center">
        <div class="sm:flex-auto">
            <h1 class="text-base font-semibold leading-6 text-gray-900">호텔 예약 현황</h1>
            <p class="mt-2 text-sm text-gray-700">호텔 예약 현황을 차트와 테이블로 확인할 수 있습니다.</p>
        </div>
        <div class="mt-4 sm:ml-16 sm:mt-0 sm:flex-none">
            <a th:href="@{/hotel}" 
               class="inline-flex items-center rounded-md bg-gray-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-gray-500">
                <i class="fas fa-arrow-left -ml-0.5 mr-1.5 h-4 w-4"></i>
                호텔 목록으로
            </a>
        </div>
    </div>

    <!-- 통계 카드 -->
    <div class="mt-6 grid grid-cols-1 gap-5 sm:grid-cols-3">
        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="p-5">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-calendar-check h-6 w-6 text-blue-600"></i>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">총 예약 수</dt>
                            <dd class="text-lg font-medium text-gray-900" th:text="${#lists.size(hotelReservation)}">0</dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="p-5">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-bed h-6 w-6 text-green-600"></i>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">총 객실 수</dt>
                            <dd class="text-lg font-medium text-gray-900" th:text="${#lists.size(hotelReservation) > 0 ? #aggregates.sum(hotelReservation.![roomCount]) : 0}">0</dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="p-5">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-check-circle h-6 w-6 text-purple-600"></i>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">확정된 예약</dt>
                            <dd class="text-lg font-medium text-gray-900" th:text="${#lists.size(hotelReservation.?[status.name() == 'BOOKED'])}">0</dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 예약 현황 차트 -->
    <div class="mt-8 bg-white shadow rounded-lg">
        <div class="px-4 py-5 sm:p-6">
            <h3 class="text-base font-semibold leading-6 text-gray-900 mb-4">예약 현황 차트</h3>
            <div class="chart-wrapper overflow-x-auto border border-gray-200 rounded-lg">
                <div id="chart-canvas" class="chart-canvas min-w-full" style="height: 400px; position: relative;">
                    <canvas id="hotelReservationChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 예약 목록 -->
    <div class="mt-8 bg-white shadow rounded-lg">
        <div class="px-4 py-5 sm:p-6">
            <h3 class="text-base font-semibold leading-6 text-gray-900 mb-4">예약 목록</h3>
            <div class="overflow-hidden shadow ring-1 ring-black ring-opacity-5 md:rounded-lg">
                <table class="min-w-full divide-y divide-gray-300">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">예약 ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">투어 ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">방 수</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">시작일</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">완료일</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">예약 상태</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="reserve : ${hotelReservation}">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${reserve.id}">1</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${reserve.tourId}">1</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${reserve.roomCount}">1</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${#temporals.format(reserve.startDate, 'yyyy-MM-dd')}">2024-01-01</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${#temporals.format(reserve.endDate, 'yyyy-MM-dd')}">2024-01-02</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span th:if="${reserve.status.name() == 'BOOKED'}" 
                                      class="inline-flex items-center rounded-md bg-blue-50 px-2 py-1 text-xs font-medium text-blue-700 ring-1 ring-inset ring-blue-700/10">
                                    예약됨
                                </span>
                                <span th:if="${reserve.status.name() == 'CANCELLED'}" 
                                      class="inline-flex items-center rounded-md bg-red-50 px-2 py-1 text-xs font-medium text-red-700 ring-1 ring-inset ring-red-600/20">
                                    취소됨
                                </span>
                                <span th:if="${reserve.status.name() == 'COMPLETED'}" 
                                      class="inline-flex items-center rounded-md bg-green-50 px-2 py-1 text-xs font-medium text-green-700 ring-1 ring-inset ring-green-600/20">
                                    완료됨
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Chart.js and process full hotelReservation object in JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>

    <script th:inline="javascript">
        const hotelReservations = /*[[${hotelReservation}]]*/[];
        
        console.log('Hotel Reservations:', hotelReservations);

        // Chart.js가 로드될 때까지 기다림
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('hotelReservationChart');
            if (!canvas) {
                console.error('Canvas element not found');
                return;
            }

            // 데이터가 없는 경우 메시지 표시
            if (!hotelReservations || hotelReservations.length === 0) {
                canvas.parentElement.innerHTML = '<div class="text-center py-8 text-gray-500">예약 데이터가 없습니다.</div>';
                return;
            }

            // 두 개의 차트를 생성
            const ctx = canvas.getContext('2d');
            
            // 1. 예약 상태별 개수 계산
            const statusCounts = {
                'BOOKED': 0,
                'CANCELLED': 0,
                'COMPLETED': 0
            };
            
            hotelReservations.forEach(reservation => {
                const status = reservation.status || 'UNKNOWN';
                if (statusCounts.hasOwnProperty(status)) {
                    statusCounts[status]++;
                }
            });

            // 2. 날짜별 예약 수 계산
            const dateCounts = {};
            hotelReservations.forEach(reservation => {
                if (reservation.status === 'CANCELLED') return;
                const startDate = new Date(reservation.startDate);
                const endDate = new Date(reservation.endDate);
                
                const currentDate = new Date(startDate);
                while (currentDate <= endDate) {
                    const dateStr = currentDate.toISOString().split('T')[0];
                    dateCounts[dateStr] = (dateCounts[dateStr] || 0) + (reservation.roomCount || 1);
                    currentDate.setDate(currentDate.getDate() + 1);
                }
            });

            // 날짜 정렬
            const sortedDates = Object.keys(dateCounts).sort();
            const dateLabels = sortedDates.map(date => {
                const d = new Date(date);
                return `${d.getMonth() + 1}/${d.getDate()}`;
            });
            const dateData = sortedDates.map(date => dateCounts[date]);

            // 상태별 차트 데이터
            const statusLabels = Object.keys(statusCounts);
            const statusData = Object.values(statusCounts);
            const statusColors = [
                '#4A90E2', // BOOKED - 파란색
                '#E74C3C', // CANCELLED - 빨간색
                '#2ECC71'  // COMPLETED - 초록색
            ];

            // 날짜별 차트가 더 많은 데이터를 가지고 있으면 날짜별 차트를, 아니면 상태별 차트를 표시
            if (dateLabels.length > 0) {
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: dateLabels,
                        datasets: [{
                            label: '일별 예약 객실 수',
                            data: dateData,
                            borderColor: '#4A90E2',
                            backgroundColor: 'rgba(74, 144, 226, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: '날짜별 예약 현황'
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1
                                }
                            }
                        }
                    }
                });
            } else {
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: statusLabels,
                        datasets: [{
                            data: statusData,
                            backgroundColor: statusColors,
                            borderColor: statusColors,
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: '예약 상태별 현황'
                            },
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
