<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호텔 검색</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/filter.js"></script>
    <script src="/js/util.js"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- 헤더 -->
        <div class="bg-white shadow-sm border-b">
            <div class="px-6 py-4">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-xl font-semibold text-gray-900">호텔 검색</h1>
                        <p class="mt-1 text-sm text-gray-600">원하는 호텔을 선택하세요</p>
                    </div>
                    <button onclick="window.close()" 
                            class="inline-flex items-center px-3 py-2 border border-gray-300 shadow-sm text-sm leading-4 font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        <i class="fas fa-times -ml-0.5 mr-2 h-4 w-4"></i>
                        닫기
                    </button>
                </div>
            </div>
        </div>

        <!-- 필터 섹션 -->
        <div class="bg-white shadow-sm">
            <div class="px-6 py-4">
                <form id="filterForm" th:object="${filter}" class="space-y-4">
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">호텔 이름</label>
                            <input type="text" th:field="*{name}" placeholder="호텔 이름을 입력하세요" 
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm" />
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700">도시</label>
                            <input type="text" th:field="*{city}" placeholder="도시를 입력하세요" list="cityList" onchange="stripAfterPipe(this)" 
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm" />
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700">주소</label>
                            <input type="text" th:field="*{address}" placeholder="주소를 입력하세요" 
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm" />
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700">이메일</label>
                            <input type="email" th:field="*{email}" placeholder="이메일을 입력하세요" 
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm" />
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">최소 가격</label>
                            <input type="number" th:field="*{minPrice}" placeholder="최소 가격" 
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm" />
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700">최대 가격</label>
                            <input type="number" th:field="*{maxPrice}" placeholder="최대 가격" 
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm" />
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700">호텔 타입</label>
                            <select th:field="*{hotelType}" 
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                <option value="">전체</option>
                                <option th:each="type : ${T(renewal.common.entity.Hotel$HotelType).values()}" th:value="${type}" th:text="${type}">TYPE</option>
                            </select>
                        </div>
                        
                        <div class="flex items-end">
                            <button type="button" onclick="get(0, event)" 
                                    class="w-full inline-flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                <i class="fas fa-search -ml-1 mr-2 h-4 w-4"></i>
                                검색
                            </button>
                        </div>
                    </div>

                    <!-- 정렬 기준 및 방향 (hidden) -->
                    <input type="hidden" name="sortField" th:value="${sortField}" />
                    <input type="hidden" name="sortDir" th:value="${sortDir}" />
                </form>
            </div>
        </div>

        <!-- 결과 테이블 -->
        <div class="mt-6 bg-white shadow-sm">
            <div class="px-6 py-4">
                <h3 class="text-lg font-medium text-gray-900 mb-4">
                    검색 결과 
                    <span class="text-sm font-normal text-gray-500" th:text="'총 ' + ${hotelPage.totalElements} + '개'"></span>
                </h3>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">선택</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                <a href="#" data-sortfield="id" onclick="toggleSort(this, event)" class="hover:text-gray-700">
                                    ID
                                    <i th:if="${sortField=='id'}" th:class="${sortDir=='asc'} ? 'fas fa-sort-up' : 'fas fa-sort-down'" class="ml-1"></i>
                                </a>
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">호텔명</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">도시</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">주소</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">전화번호</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">이메일</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">가격</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="hotel : ${hotelPage.content}" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <button th:onclick="|selectHotel(${hotel.id})|" 
                                        class="inline-flex items-center px-3 py-1 border border-transparent text-sm leading-4 font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                    선택
                                </button>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${hotel.id}">1</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${hotel.name}">호텔명</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${hotel.city}">서울</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${hotel.address}">주소</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${hotel.number}">02-1234-5678</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${hotel.email}">hotel@example.com</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${#numbers.formatInteger(hotel.price, 3, 'COMMA')} + '원'">100,000원</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 페이징 -->
            <div th:if="${hotelPage.totalPages > 1}" class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
                <div class="flex-1 flex justify-between sm:hidden">
                    <a th:if="${hotelPage.hasPrevious()}" th:onclick="|get(${hotelPage.number - 1})|" 
                       class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                        이전
                    </a>
                    <a th:if="${hotelPage.hasNext()}" th:onclick="|get(${hotelPage.number + 1})|" 
                       class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                        다음
                    </a>
                </div>
                <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                    <div>
                        <p class="text-sm text-gray-700">
                            <span th:text="'페이지 ' + (${hotelPage.number} + 1) + ' / ' + ${hotelPage.totalPages} + ' (총 ' + ${hotelPage.totalElements} + '개)'"></span>
                        </p>
                    </div>
                    <div>
                        <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px">
                            <a th:if="${hotelPage.hasPrevious()}" th:onclick="|get(${hotelPage.number - 1})|" 
                               class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                <i class="fas fa-chevron-left h-5 w-5"></i>
                            </a>
                            <a th:each="i : ${#numbers.sequence(0, hotelPage.totalPages - 1)}" 
                               th:onclick="|get(${i})|" 
                               th:class="${i == hotelPage.number} ? 'z-10 bg-blue-50 border-blue-500 text-blue-600' : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50'"
                               class="relative inline-flex items-center px-4 py-2 border text-sm font-medium"
                               th:text="${i + 1}">1</a>
                            <a th:if="${hotelPage.hasNext()}" th:onclick="|get(${hotelPage.number + 1})|" 
                               class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                <i class="fas fa-chevron-right h-5 w-5"></i>
                            </a>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <datalist id="cityList">
        <option th:each="cc : ${cityCode}" th:value="${cc.code} + ' | ' + ${cc.country} + ' | ' + ${cc.eng} + ' | ' + ${cc.kor}"></option>
    </datalist>

    <script>
        function selectHotel(hotelId) {
            if (window.opener && window.opener.setId) {
                window.opener.setId(hotelId);
                window.close();
            } else {
                alert('선택된 호텔 ID: ' + hotelId);
                window.close();
            }
        }
    </script>
</body>
</html>
