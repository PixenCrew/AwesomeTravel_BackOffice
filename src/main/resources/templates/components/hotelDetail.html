<div th:fragment="content">
    <h1 th:text="${hotel.id == null} ? '호텔 등록' : '호텔 상세' "></h1>
    <a th:href="@{/hotel/{id}/hotelReservation(id=${hotel.id})}">
        <button type="button">예약상세</button>
    </a>

    <form th:object="${hotel}" th:action="${hotel.id == null} ?
               @{/hotel/new} :
               @{/hotel/{id}(id=${hotel.id})}" method="post">

        <div th:if="${hotel.id != null}">
            <label>ID:</label>
            <input type="text" th:field="*{id}" readonly /><br>
        </div>

        <label>이름:</label>
        <input type="text" th:field="*{name}" required /><br>

        <label>설명:</label>
        <textarea th:field="*{description}" required></textarea><br>

        <label>도시:</label>
        <input type="text" th:field="*{city}" list="cityList" onchange="stripAfterPipe(this)" required /><br>

        <label>주소:</label>
        <input type="text" th:field="*{address}" required /><br>

        <label>번호:</label>
        <input type="text" th:field="*{number}" /><br>

        <label>이메일:</label>
        <input type="email" th:field="*{email}" /><br>

        <label>웹사이트:</label>
        <input type="text" th:field="*{website}" /><br>

        <label>호텔 유형:</label>
        <select th:field="*{hotelType}">
            <option th:each="type : ${T(renewal.awesome_travel_backoffice.hotel.utils.HotelType).values()}"
                th:value="${type}" th:text="${type}"></option>
        </select><br>

        <label>가격:</label>
        <input type="number" th:field="*{price}" required /><br>

        <label>최대 객실 수:</label>
        <input type="number" th:field="*{maxRoomCount}" /><br>

        <label>활성 상태:</label>
        <input type="checkbox" th:field="*{isActive}" /><br>

        <fieldset id="images-fieldset">
            <legend>이미지</legend>
            <div class="image-item" th:each="img, iterStat : *{images}">
                <input type="text" th:field="*{images[__${iterStat.index}__]}" placeholder="이미지 URL" />
                <button type="button" onclick="removeImage(this)">제거</button>
            </div>
            <button type="button" onclick="addImage()">이미지 추가</button>
        </fieldset>


        <fieldset>
            <legend>편의시설 선택</legend>
            <div th:each="a : ${allAmenities}">
                <label>
                    <input type="checkbox" name="amenities" th:value="${a.id}"
                        th:checked="${hotel.amenities.contains(a)}" />
                    <span th:text="${a.name}"></span>
                </label><br>
            </div>
        </fieldset>

        <button type="submit" th:text="${hotel.id == null} ? '등록' : '수정'"></button>
    </form>

    <button th:if="${hotel.id != null}" th:onclick="deleteHotel([[${hotel.id}]])">삭제</button>
    
    <script src="/js/util.js"></script>
    <script>
        function deleteHotel(id) {
            if (confirm('정말로 삭제하시겠습니까?')) {
                fetch('/hotel/' + id, { method: 'DELETE' })
                    .then(res => {
                        if (res.ok) {
                            alert('삭제 성공');
                            window.location.href = '/hotel';
                        } else {
                            alert('삭제 실패');
                        }
                    });
            }
        }

        // function addImage() {
        //     const fieldset = document.getElementById("images-fieldset");
        //     const item = document.createElement("div");
        //     const index = fieldset.querySelectorAll(".image-item").length;

        //     item.classList.add("image-item");
        //     item.innerHTML = `
        //         <input type="text" name="images[${index}]" placeholder="이미지 URL" readonly />
        //         <input type="file" onchange="uploadImage(this, ${index})" />
        //         <button type="button" onclick="removeImage(this)">삭제</button>
        //     `;
        //     fieldset.insertBefore(item, fieldset.lastElementChild);
        // }
        function addImage() {
            const fieldset = document.getElementById("images-fieldset");

            // .image-item 개수 → 다음 인덱스
            const index = fieldset.querySelectorAll(".image-item").length;

            const item = document.createElement("div");
            item.classList.add("image-item");

            item.innerHTML = `
                <input type="text" name="images[${index}]" placeholder="이미지 URL" readonly />
                <input type="file" onchange="uploadImage(this)" />
                <button type="button" onclick="removeImage(this)">삭제</button>
            `;

            fieldset.insertBefore(item, fieldset.lastElementChild);
        }

        function uploadImage(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);

            fetch("/image", {  // 이미지 업로드 엔드포인트
                method: "POST",
                body: formData
            })
                .then(response => response.text())
                .then(url => {
                    // 서버에서 받은 URL을 해당 input 필드에 채우기
                    const imageInput = inputElement.previousElementSibling;  // input[type="text"]
                    imageInput.value = url;
                })
                .catch(error => {
                    alert("이미지 업로드 실패: " + error.message);
                });
        }
        function removeImage(btn) {
            if (confirm('정말로 삭제하시겠습니까?')) {
                const item = btn.closest(".image-item");
                const imageUrlInput = item.querySelector('input[type="text"]');
                const imageUrl = imageUrlInput.value;
                // 서버에 DELETE 요청

                fetch(`/image?target=${encodeURIComponent(imageUrl)}`, {
                    method: 'DELETE'
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('서버에서 삭제 실패');
                        }
                        // 요소 제거
                        item.remove();
                    })
                    .catch(error => {
                        alert('이미지 삭제 실패: ' + error.message);
                    });
            }
        }
        
    </script>
    
    <datalist id="cityList">
        <option th:each="cc : ${cityCode}"
            th:value="${cc.code} + ' | ' + ${cc.country} + ' | ' + ${cc.eng} + ' | ' + ${cc.kor}"></option>
    </datalist>
</div>
