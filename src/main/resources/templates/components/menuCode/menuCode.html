<div th:fragment="content">
    <div class="space-y-6">
        <!-- 페이지 헤더 -->
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">메뉴 코드 관리</h2>
                <p class="text-sm text-gray-600 mt-1">메뉴 코드를 확인하고 관리할 수 있습니다.</p>
            </div>
            <div class="flex space-x-3">
                <a th:href="${'/menu-code/new' + filterQueryString}"
                   class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200">
                    <i class="fas fa-plus mr-2"></i>새 메뉴 코드 등록
                </a>
            </div>
        </div>

        <!-- 필터 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
            <form method="get" class="grid grid-cols-1 xl:grid-cols-4 gap-4 p-4">
                <div>
                    <label for="filter-code" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1">코드</label>
                    <input id="filter-code"
                           name="code"
                           type="text"
                           placeholder="정확한 코드 입력"
                           th:value="${filters['code']}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
                </div>

                <div>
                    <label for="filter-name" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1">표시 이름</label>
                    <input id="filter-name"
                           name="name"
                           type="text"
                           placeholder="표시 이름 포함 검색"
                           th:value="${filters['name']}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
                </div>

                <div>
                    <label for="filter-value" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1">항목 값</label>
                    <input id="filter-value"
                           name="value"
                           type="text"
                           placeholder="상세 항목 값 포함 검색"
                           th:value="${filters['value']}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
                </div>

                <div class="flex items-end space-x-2">
                    <button type="submit"
                            class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        필터 적용
                    </button>
                    <a href="/menu-code"
                       class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                        초기화
                    </a>
                </div>
            </form>
        </div>

        <!-- 메뉴 코드 목록 -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">코드</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">표시 이름</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">항목 수</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">항목 상세</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">작업</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="menu : ${menuCodes}"
                            class="hover:bg-gray-50 cursor-pointer menu-row"
                            th:data-link="${'/menu-code/' + menu.code2 + filterQueryString}">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-gray-900"
                                th:text="${menu.code}">101001</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
                                th:text="${menu.name != null ? menu.name : '-'}">메뉴 이름</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
                                th:text="${menu.details != null ? menu.details.size() : 0}">0</td>
                            <td class="px-6 py-4 text-sm text-gray-700">
                                <div th:if="${menu.details != null && !menu.details.isEmpty()}"
                                     th:with="tooltipId=${'details-tooltip-' + menu.code2}"
                                     class="flex flex-wrap gap-2 items-center">
                                    <div th:each="detail, iter : ${menu.details}"
                                         th:if="${iter.index} < 2"
                                         class="inline-flex items-center space-x-2 px-2 py-0.5 bg-blue-50 border border-blue-100 rounded-full text-xs text-blue-700">
                                        <span class="font-semibold" th:text="${detail.targetColumn}">COUNTRY</span>
                                        <span class="text-gray-700" th:text="${detail.value}">KR</span>
                                    </div>

                                    <div th:if="${menu.details.size() > 2}" class="relative">
                                        <button type="button"
                                                class="inline-flex items-center px-2.5 py-1 bg-gray-200 hover:bg-gray-300 text-xs font-medium text-gray-700 rounded-full transition"
                                                th:attr="data-tooltip=${tooltipId}">
                                            <span class="font-semibold">+<span th:text="${menu.details.size() - 2}">3</span></span>
                                        </button>

                                        <div th:id="${tooltipId}"
                                             class="details-tooltip hidden absolute z-20 top-full left-0 mt-2 w-60 bg-white border border-gray-200 rounded-lg shadow-xl p-3">
                                            <div class="mb-2 text-xs font-semibold text-gray-500">
                                                전체 항목
                                            </div>
                                            <div class="space-y-1 max-h-48 overflow-y-auto text-sm">
                                                <div th:each="detail : ${menu.details}"
                                                     class="flex justify-between items-center px-2 py-1 rounded hover:bg-gray-50">
                                                    <span class="text-xs font-semibold text-blue-600" th:text="${detail.targetColumn}">COUNTRY</span>
                                                    <span class="text-gray-700" th:text="${detail.value}">KR</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <span th:if="${menu.details == null || menu.details.isEmpty()}"
                                      class="text-gray-400 text-sm">등록된 항목이 없습니다.</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <div class="flex items-center space-x-2" onclick="event.stopPropagation()">
                                    <a th:href="${'/menu-code/' + menu.code2 + filterQueryString}"
                                       class="inline-flex items-center justify-center px-3 py-1.5 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition-colors"
                                       title="상세보기">
                                        <i class="fas fa-eye text-sm"></i>
                                    </a>
                                    <a th:href="${'/menu-code/' + menu.code2 + filterQueryString}"
                                       class="inline-flex items-center justify-center px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded hover:bg-indigo-200 transition-colors"
                                       title="수정">
                                        <i class="fas fa-edit text-sm"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 빈 상태 -->
            <div th:if="${menuCodes == null || menuCodes.isEmpty()}" class="text-center py-12">
                <i class="fas fa-list text-4xl text-gray-400 mb-4"></i>
                <h3 class="text-lg font-medium text-gray-900 mb-2">등록된 메뉴 코드가 없습니다</h3>
                <p class="text-gray-500 mb-4">새로운 메뉴 코드를 등록해보세요.</p>
                <a th:href="${'/menu-code/new' + filterQueryString}" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                    <i class="fas fa-plus mr-2"></i>새 메뉴 코드 등록
                </a>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let openMenuTooltip = null;

        function closeOpenTooltip() {
            if (openMenuTooltip) {
                openMenuTooltip.classList.add('hidden');
                openMenuTooltip = null;
            }
        }

        function toggleDetailsTooltip(event, id) {
            event.stopPropagation();

            const tooltip = document.getElementById(id);
            if (!tooltip) {
                return;
            }

            if (openMenuTooltip && openMenuTooltip !== tooltip) {
                openMenuTooltip.classList.add('hidden');
            }

            const shouldOpen = tooltip.classList.contains('hidden');
            if (shouldOpen) {
                tooltip.classList.remove('hidden');
                openMenuTooltip = tooltip;
            } else {
                tooltip.classList.add('hidden');
                openMenuTooltip = null;
            }
        }

        document.addEventListener('click', () => closeOpenTooltip());

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeOpenTooltip();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const hasActiveFilter = /*[[${hasActiveFilter}]]*/ false;

            document.querySelectorAll('.menu-row').forEach(row => {
                row.addEventListener('click', function() {
                    const link = this.dataset.link;
                    if (link) {
                        location.href = link;
                    }
                });
            });

            document.querySelectorAll('button[data-tooltip]').forEach(button => {
                button.addEventListener('click', (event) => {
                    const id = button.dataset.tooltip;
                    if (id) {
                        toggleDetailsTooltip(event, id);
                    }
                });
            });

            document.querySelectorAll('.details-tooltip').forEach(tooltip => {
                tooltip.addEventListener('click', event => event.stopPropagation());
            });

            if (hasActiveFilter) {
                const header = document.querySelector('.bg-white.rounded-lg.shadow-sm.border');
                if (header) {
                    header.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }
        });
    </script>
</div>
