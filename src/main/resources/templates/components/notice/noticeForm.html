<div th:fragment="content">
    <div class="space-y-4">
        <!-- 페이지 헤더 -->
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900" th:text="${notice != null ? '공지사항 수정' : '공지사항 등록'}">공지사항 등록</h2>
                <p class="text-sm text-gray-600 mt-1">새로운 공지사항을 작성하거나 기존 공지사항을 수정합니다.</p>
            </div>
            <a th:href="@{/notice}" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors duration-200">
                목록으로
            </a>
        </div>

        <!-- 메시지 표시 -->
        <div th:if="${message}" class="p-4 bg-green-100 text-green-800 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${message}">성공 메시지</span>
            </div>
        </div>
        
        <div th:if="${error}" class="p-4 bg-red-100 text-red-800 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${error}">오류 메시지</span>
            </div>
        </div>

        <!-- 공지사항 작성 폼 -->
        <div class="bg-white rounded-lg shadow-sm p-6 pb-12">
            <form th:action="${notice != null ? '/notice/' + notice.id : '/notice'}" 
                  method="POST" 
                  class="space-y-4">
                <!-- PUT 메서드 시뮬레이션을 위한 hidden input -->
                <input type="hidden" name="_method" th:value="${notice != null ? 'PUT' : 'POST'}" />
                
                <!-- 제목 -->
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-700 mb-2">제목 *</label>
                    <input type="text" 
                           id="title" 
                           name="title" 
                           th:value="${notice?.title}"
                           placeholder="공지사항 제목을 입력하세요"
                           required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- 카테고리 -->
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-2">카테고리 *</label>
                    <select id="category" 
                            name="category" 
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">카테고리를 선택하세요</option>
                        <option value="EVENT" th:selected="${notice?.category?.toString() == 'EVENT'}">이벤트</option>
                        <option value="UPDATE" th:selected="${notice?.category?.toString() == 'UPDATE'}">업데이트</option>
                        <option value="SYSTEM" th:selected="${notice?.category?.toString() == 'SYSTEM'}">점검</option>
                        <option value="GUIDE" th:selected="${notice?.category?.toString() == 'GUIDE'}">안내</option>
                    </select>
                </div>

                <!-- 내용 -->
                <div>
                    <label for="content" class="block text-sm font-medium text-gray-700 mb-2">내용 *</label>
                    <textarea id="content" 
                              name="content" 
                              rows="10"
                              placeholder="공지사항 내용을 입력하세요"
                              required
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" th:text="${notice?.content}"></textarea>
                </div>

                <!-- 이미지 업로드 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">대표 이미지</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-gray-400 transition-colors">
                        <input type="file" 
                               id="imageFile" 
                               name="imageFile" 
                               accept="image/*" 
                               class="hidden"
                               onchange="handleImageUpload(this)">
                        <div id="imageUploadArea" class="cursor-pointer" onclick="document.getElementById('imageFile').click()">
                            <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <p class="mt-2 text-sm text-gray-600">이미지를 클릭하거나 드래그하여 업로드</p>
                            <p class="text-xs text-gray-500">PNG, JPG, GIF 파일만 업로드 가능 (최대 50MB)</p>
                        </div>
                        <div id="imagePreview" class="hidden mt-4">
                            <img id="previewImg" class="mx-auto max-h-48 rounded-lg shadow-sm" alt="미리보기">
                            <div class="mt-2 flex justify-center space-x-2">
                                <button type="button" onclick="removeImage()" class="px-3 py-1 text-sm bg-red-100 text-red-800 rounded-lg hover:bg-red-200">
                                    이미지 제거
                                </button>
                            </div>
                        </div>
                    </div>
                    <!-- 숨겨진 필드로 이미지 URL 저장 -->
                    <input type="hidden" id="imageUrl" name="imageUrl" th:value="${notice?.imageUrl}">
                </div>

                <!-- 옵션 설정 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 고정 여부 -->
                    <div>
                        <label class="flex items-center">
                            <input type="checkbox" 
                                   name="fix" 
                                   th:checked="${notice?.fix}"
                                   id="fixCheckbox"
                                   onchange="togglePriorityField()"
                                   class="form-checkbox text-blue-600">
                            <span class="ml-2 text-sm text-gray-700">상단 고정</span>
                        </label>
                        <p class="text-xs text-gray-500 mt-1">체크하면 공지사항 목록 상단에 고정됩니다.</p>
                        
                        <!-- 고정순서 입력 필드 -->
                        <div id="priorityField" class="mt-3" style="display: none;">
                            <label for="priority" class="block text-sm font-medium text-gray-700 mb-1">고정순서</label>
                            <input type="number" 
                                   id="priority" 
                                   name="priority" 
                                   th:value="${notice?.priority}"
                                   min="1" 
                                   max="999"
                                   placeholder="1"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <p class="text-xs text-gray-500 mt-1">숫자가 작을수록 상단에 표시됩니다. (1-999)</p>
                        </div>
                    </div>

                    <!-- 노출 여부 -->
                    <div>
                        <label class="flex items-center">
                            <input type="checkbox" 
                                   name="visible" 
                                   th:checked="${notice?.visible == true}"
                                   class="form-checkbox text-blue-600">
                            <span class="ml-2 text-sm text-gray-700">노출</span>
                        </label>
                        <p class="text-xs text-gray-500 mt-1">체크 해제하면 공지사항이 숨겨집니다.</p>
                    </div>
                </div>

                <!-- 노출 기간 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="startAt" class="block text-sm font-medium text-gray-700 mb-2">노출 시작일</label>
                        <input type="datetime-local" 
                               id="startAt" 
                               name="startAt"
                               th:value="${notice?.startAt != null ? #temporals.format(notice.startAt, 'yyyy-MM-dd''T''HH:mm') : ''}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <p class="text-xs text-gray-500 mt-1">지정하지 않으면 즉시 노출됩니다.</p>
                    </div>

                    <div>
                        <label for="endAt" class="block text-sm font-medium text-gray-700 mb-2">노출 종료일</label>
                        <input type="datetime-local" 
                               id="endAt" 
                               name="endAt"
                               th:value="${notice?.endAt != null ? #temporals.format(notice.endAt, 'yyyy-MM-dd''T''HH:mm') : ''}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <p class="text-xs text-gray-500 mt-1">지정하지 않으면 계속 노출됩니다.</p>
                    </div>
                </div>

                <!-- 버튼 영역 -->
                <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
                    <a th:href="@{/notice}" class="px-6 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors duration-200">
                        취소
                    </a>
                    <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200">
                        <span th:text="${notice != null ? '수정하기' : '등록하기'}">등록하기</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // 고정순서 필드 토글
        function togglePriorityField() {
            const fixCheckbox = document.getElementById('fixCheckbox');
            const priorityField = document.getElementById('priorityField');
            const priorityInput = document.getElementById('priority');
            
            if (fixCheckbox.checked) {
                priorityField.style.display = 'block';
                if (!priorityInput.value) {
                    priorityInput.value = '1'; // 기본값 설정
                }
            } else {
                priorityField.style.display = 'none';
                priorityInput.value = ''; // 값 초기화
            }
        }
        
        // 이미지 업로드 처리
        function handleImageUpload(input) {
            const file = input.files[0];
            if (!file) return;
            
            // 파일 크기 검증 (50MB)
            if (file.size > 50 * 1024 * 1024) {
                alert('파일 크기는 50MB를 초과할 수 없습니다.');
                input.value = '';
                return;
            }
            
            // 이미지 파일 검증
            if (!file.type.startsWith('image/')) {
                alert('이미지 파일만 업로드 가능합니다.');
                input.value = '';
                return;
            }
            
            // FormData 생성하여 서버에 업로드
            const formData = new FormData();
            formData.append('file', file);
            
            // 업로드 중 표시
            const uploadArea = document.getElementById('imageUploadArea');
            uploadArea.innerHTML = '<div class="flex items-center justify-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div><span class="ml-2 text-sm text-gray-600">업로드 중...</span></div>';
            
            fetch('/image', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(imageUrl => {
                // 이미지 URL을 숨겨진 필드에 저장
                document.getElementById('imageUrl').value = imageUrl;
                
                // 미리보기 표시
                showImagePreview(imageUrl);
            })
            .catch(error => {
                console.error('업로드 실패:', error);
                alert('이미지 업로드에 실패했습니다.');
                input.value = '';
                resetUploadArea();
            });
        }
        
        // 이미지 미리보기 표시
        function showImagePreview(imageUrl) {
            const uploadArea = document.getElementById('imageUploadArea');
            const preview = document.getElementById('imagePreview');
            const previewImg = document.getElementById('previewImg');
            
            previewImg.src = imageUrl;
            uploadArea.style.display = 'none';
            preview.classList.remove('hidden');
        }
        
        // 이미지 제거
        function removeImage() {
            const uploadArea = document.getElementById('imageUploadArea');
            const preview = document.getElementById('imagePreview');
            const imageFile = document.getElementById('imageFile');
            const imageUrl = document.getElementById('imageUrl');
            
            // 파일 입력 초기화
            imageFile.value = '';
            imageUrl.value = '';
            
            // UI 초기화
            preview.classList.add('hidden');
            uploadArea.style.display = 'block';
            resetUploadArea();
        }
        
        // 업로드 영역 초기화
        function resetUploadArea() {
            const uploadArea = document.getElementById('imageUploadArea');
            uploadArea.innerHTML = `
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <p class="mt-2 text-sm text-gray-600">이미지를 클릭하거나 드래그하여 업로드</p>
                <p class="text-xs text-gray-500">PNG, JPG, GIF 파일만 업로드 가능 (최대 50MB)</p>
            `;
        }
        
        // 페이지 로드 시 초기 상태 설정
        document.addEventListener('DOMContentLoaded', function() {
            togglePriorityField();
            
            // 기존 이미지가 있으면 미리보기 표시
            const existingImageUrl = document.getElementById('imageUrl').value;
            if (existingImageUrl) {
                showImagePreview(existingImageUrl);
            }
        });

        // 폼 제출 시 확인
        document.querySelector('form').addEventListener('submit', function(e) {
            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const content = document.getElementById('content').value.trim();
            
            if (!title) {
                alert('제목을 입력해주세요.');
                e.preventDefault();
                return;
            }
            
            if (!category) {
                alert('카테고리를 선택해주세요.');
                e.preventDefault();
                return;
            }
            
            if (!content) {
                alert('내용을 입력해주세요.');
                e.preventDefault();
                return;
            }
        });

        // 날짜 유효성 검사
        document.getElementById('startAt').addEventListener('change', function() {
            const startDate = new Date(this.value);
            const endDateInput = document.getElementById('endAt');
            
            if (endDateInput.value) {
                const endDate = new Date(endDateInput.value);
                if (startDate >= endDate) {
                    alert('시작일은 종료일보다 이전이어야 합니다.');
                    this.value = '';
                }
            }
        });

        document.getElementById('endAt').addEventListener('change', function() {
            const endDate = new Date(this.value);
            const startDateInput = document.getElementById('startAt');
            
            if (startDateInput.value) {
                const startDate = new Date(startDateInput.value);
                if (endDate <= startDate) {
                    alert('종료일은 시작일보다 이후여야 합니다.');
                    this.value = '';
                }
            }
        });
    </script>
    </div>
</div>
