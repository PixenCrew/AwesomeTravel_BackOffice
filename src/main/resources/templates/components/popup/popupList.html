<div th:fragment="content">
    <div class="space-y-6">
        <!-- 페이지 헤더 -->
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">팝업 관리</h2>
                <p class="text-sm text-gray-600 mt-1">팝업을 등록하고 관리합니다.</p>
            </div>
            <a th:href="@{/popup/create}" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200">
                <i class="fas fa-plus mr-2"></i>팝업 등록
            </a>
        </div>

        <!-- 메시지 표시 -->
        <div th:if="${param.message == 'success'}" class="p-4 bg-green-100 text-green-800 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                <span>작업이 성공적으로 완료되었습니다.</span>
            </div>
        </div>
        
        <div th:if="${param.error}" class="p-4 bg-red-100 text-red-800 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${param.error}">오류 메시지</span>
            </div>
        </div>

        <!-- 검색 필터 -->
        <div class="bg-white rounded-lg shadow-sm p-6">
            <form th:action="@{/popup}" method="GET" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label for="keyword" class="block text-sm font-medium text-gray-700 mb-2">제목 검색</label>
                    <input type="text" 
                           id="keyword" 
                           name="keyword" 
                           th:value="${searchRequest?.keyword}"
                           placeholder="팝업 제목을 입력하세요"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                
                <div>
                    <label for="startDateFrom" class="block text-sm font-medium text-gray-700 mb-2">시작일 (부터)</label>
                    <input type="date" 
                           id="startDateFrom" 
                           name="startDateFrom" 
                           th:value="${searchRequest?.startDateFrom}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <p id="startDateFromError" class="text-xs text-red-600 mt-1 hidden"></p>
                </div>
                
                <div>
                    <label for="startDateTo" class="block text-sm font-medium text-gray-700 mb-2">시작일 (까지)</label>
                    <input type="date" 
                           id="startDateTo" 
                           name="startDateTo" 
                           th:value="${searchRequest?.startDateTo}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <p id="startDateToError" class="text-xs text-red-600 mt-1 hidden"></p>
                </div>
                
                <div>
                    <label for="active" class="block text-sm font-medium text-gray-700 mb-2">상태</label>
                    <select id="active" 
                            name="active" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">전체</option>
                        <option value="true" th:selected="${searchRequest?.active == true}">활성화</option>
                        <option value="false" th:selected="${searchRequest?.active == false}">비활성화</option>
                    </select>
                </div>
                
                <div class="flex items-end gap-2">
                    <button type="submit" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200">
                        <i class="fas fa-search mr-2"></i>검색
                    </button>
                    <button type="button" 
                            onclick="resetFilter()" 
                            class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors duration-200">
                        <i class="fas fa-redo mr-2"></i>초기화
                    </button>
                </div>
            </form>
        </div>

        <!-- 팝업 목록 -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="overflow-x-auto -mx-4 sm:mx-0">
                <div class="inline-block min-w-full align-middle">
                    <div class="overflow-hidden">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-20">순서</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider min-w-[200px]">제목</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-32">노출기간</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-24">상태</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider min-w-[150px] max-w-[200px]">파일</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-32">등록일</th>
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-40">작업</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <tr th:each="popup : ${popups.content}" th:classappend="${!popup.active} ? 'bg-gray-100 opacity-75' : ''">
                                    <td class="px-4 py-4 text-sm font-medium text-gray-900" th:text="${popup.displayOrder}">1</td>
                                    <td class="px-4 py-4">
                                        <div class="text-sm font-medium text-gray-900 truncate" th:text="${popup.title}" th:title="${popup.title}">팝업 제목</div>
                                        <div class="text-sm text-gray-500 truncate" th:text="${popup.url}" th:title="${popup.url}">URL</div>
                                    </td>
                                    <td class="px-4 py-4 text-sm text-gray-900">
                                        <div th:text="${#temporals.format(popup.startDate, 'yyyy-MM-dd')}">2024-01-01</div>
                                        <div class="text-gray-500 text-xs">~</div>
                                        <div th:text="${#temporals.format(popup.endDate, 'yyyy-MM-dd')}">2024-12-31</div>
                                    </td>
                                    <td class="px-4 py-4">
                                        <span th:if="${popup.active}" class="px-2 py-1 text-xs bg-green-100 text-green-800 rounded-full whitespace-nowrap">활성화</span>
                                        <span th:unless="${popup.active}" class="px-2 py-1 text-xs bg-red-100 text-red-800 rounded-full whitespace-nowrap">비활성화</span>
                                    </td>
                                    <td class="px-4 py-4 text-sm text-gray-900">
                                        <div class="truncate max-w-[200px]" th:text="${popup.file}" th:title="${popup.file}">popup.jpg</div>
                                    </td>
                                    <td class="px-4 py-4 text-sm text-gray-500 whitespace-nowrap" th:text="${#temporals.format(popup.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 10:00</td>
                                    <td class="px-4 py-4 text-sm font-medium">
                                        <div class="flex items-center space-x-2">
                                            <a th:href="@{'/popup/' + ${popup.id}}" 
                                               class="inline-flex items-center justify-center px-3 py-1.5 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition-colors" 
                                               title="상세보기">
                                                <i class="fas fa-eye text-sm"></i>
                                            </a>
                                            <a th:href="@{'/popup/edit/' + ${popup.id}}" 
                                               class="inline-flex items-center justify-center px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded hover:bg-indigo-200 transition-colors" 
                                               title="수정">
                                                <i class="fas fa-edit text-sm"></i>
                                            </a>
                                            <button th:onclick="|togglePopup(${popup.id})|" 
                                                    th:class="${popup.active} ? 'inline-flex items-center justify-center px-3 py-1.5 bg-orange-100 text-orange-700 rounded hover:bg-orange-200 transition-colors' : 'inline-flex items-center justify-center px-3 py-1.5 bg-green-100 text-green-700 rounded hover:bg-green-200 transition-colors'"
                                                    th:title="${popup.active} ? '비활성화' : '활성화'"
                                                    type="button">
                                                <i th:class="${popup.active} ? 'fas fa-pause text-sm' : 'fas fa-play text-sm'"></i>
                                            </button>
                                            <button th:onclick="|deletePopup(${popup.id})|" 
                                                    class="inline-flex items-center justify-center px-3 py-1.5 bg-red-100 text-red-700 rounded hover:bg-red-200 transition-colors" 
                                                    title="삭제"
                                                    type="button">
                                                <i class="fas fa-trash text-sm"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- 페이지네이션 -->
            <div th:if="${popups.totalPages > 1}" class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
                <div class="flex-1 flex justify-between sm:hidden">
                    <a th:if="${popups.hasPrevious()}" 
                       th:href="@{/popup(page=${popups.number - 1}, keyword=${searchRequest?.keyword}, startDateFrom=${searchRequest?.startDateFrom}, startDateTo=${searchRequest?.startDateTo}, active=${searchRequest?.active})}"
                       class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                        이전
                    </a>
                    <a th:if="${popups.hasNext()}" 
                       th:href="@{/popup(page=${popups.number + 1}, keyword=${searchRequest?.keyword}, startDateFrom=${searchRequest?.startDateFrom}, startDateTo=${searchRequest?.startDateTo}, active=${searchRequest?.active})}"
                       class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                        다음
                    </a>
                </div>
                <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                    <div>
                        <p class="text-sm text-gray-700">
                            <span th:text="${popups.number + 1}">1</span> / <span th:text="${popups.totalPages}">1</span> 페이지
                            (<span th:text="${popups.totalElements}">0</span>개 항목)
                        </p>
                    </div>
                    <div>
                        <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px">
                            <a th:if="${popups.hasPrevious()}" 
                               th:href="@{/popup(page=${popups.number - 1}, keyword=${searchRequest?.keyword}, startDateFrom=${searchRequest?.startDateFrom}, startDateTo=${searchRequest?.startDateTo}, active=${searchRequest?.active})}"
                               class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                <span class="sr-only">이전</span>
                                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
                                </svg>
                            </a>
                            <a th:each="pageNum : ${#numbers.sequence(0, popups.totalPages - 1)}"
                               th:href="@{/popup(page=${pageNum}, keyword=${searchRequest?.keyword}, startDateFrom=${searchRequest?.startDateFrom}, startDateTo=${searchRequest?.startDateTo}, active=${searchRequest?.active})}"
                               th:class="${pageNum == popups.number} ? 'relative inline-flex items-center px-4 py-2 border border-gray-300 bg-blue-50 text-sm font-medium text-blue-600' : 'relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50'"
                               th:text="${pageNum + 1}">1</a>
                            <a th:if="${popups.hasNext()}" 
                               th:href="@{/popup(page=${popups.number + 1}, keyword=${searchRequest?.keyword}, startDateFrom=${searchRequest?.startDateFrom}, startDateTo=${searchRequest?.startDateTo}, active=${searchRequest?.active})}"
                               class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                <span class="sr-only">다음</span>
                                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
                                </svg>
                            </a>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 날짜 필터 유효성 검사
        const startDateFromInput = document.getElementById('startDateFrom');
        const startDateToInput = document.getElementById('startDateTo');
        const startDateFromError = document.getElementById('startDateFromError');
        const startDateToError = document.getElementById('startDateToError');

        // 시작일 (부터) 변경 시 검증
        if (startDateFromInput) {
            startDateFromInput.addEventListener('change', function() {
                validateFilterDates();
            });
        }

        // 시작일 (까지) 변경 시 검증
        if (startDateToInput) {
            startDateToInput.addEventListener('change', function() {
                validateFilterDates();
            });
        }

        // 날짜 필터 유효성 검사 함수
        function validateFilterDates() {
            const startDateFrom = startDateFromInput.value;
            const startDateTo = startDateToInput.value;
            
            // 에러 메시지 초기화
            if (startDateFromError) {
                startDateFromError.classList.add('hidden');
            }
            if (startDateToError) {
                startDateToError.classList.add('hidden');
            }
            if (startDateFromInput) {
                startDateFromInput.classList.remove('border-red-500');
            }
            if (startDateToInput) {
                startDateToInput.classList.remove('border-red-500');
            }
            
            if (startDateFrom && startDateTo) {
                const from = new Date(startDateFrom);
                const to = new Date(startDateTo);
                
                if (to < from) {
                    if (startDateToError) {
                        startDateToError.textContent = '종료일은 시작일보다 이전일 수 없습니다.';
                        startDateToError.classList.remove('hidden');
                    }
                    if (startDateToInput) {
                        startDateToInput.classList.add('border-red-500');
                        startDateToInput.focus();
                    }
                    return false;
                }
            }
            
            return true;
        }

        // 폼 제출 시 최종 검증
        const filterForm = document.querySelector('form');
        if (filterForm) {
            filterForm.addEventListener('submit', function(e) {
                if (!validateFilterDates()) {
                    e.preventDefault();
                    alert('시작일 (까지)는 시작일 (부터)보다 이전일 수 없습니다. 날짜를 확인해주세요.');
                    return false;
                }
            });
        }

        // 필터 초기화 함수
        function resetFilter() {
            // 모든 입력 필드 초기화
            const keywordInput = document.getElementById('keyword');
            const startDateFromInput = document.getElementById('startDateFrom');
            const startDateToInput = document.getElementById('startDateTo');
            const activeSelect = document.getElementById('active');
            
            if (keywordInput) keywordInput.value = '';
            if (startDateFromInput) startDateFromInput.value = '';
            if (startDateToInput) startDateToInput.value = '';
            if (activeSelect) activeSelect.value = '';
            
            // 에러 메시지 초기화
            if (startDateFromError) {
                startDateFromError.classList.add('hidden');
            }
            if (startDateToError) {
                startDateToError.classList.add('hidden');
            }
            if (startDateFromInput) {
                startDateFromInput.classList.remove('border-red-500');
            }
            if (startDateToInput) {
                startDateToInput.classList.remove('border-red-500');
            }
            
            // 필터 초기화 후 목록 페이지로 이동 (쿼리 파라미터 없이)
            window.location.href = '/popup';
        }

        function togglePopup(id) {
            if (confirm('팝업 상태를 변경하시겠습니까?')) {
                fetch(`/popup/${id}/toggle`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        return response.text().then(text => {
                            alert('상태 변경에 실패했습니다: ' + text);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                });
            }
        }

        function deletePopup(id) {
            if (confirm('정말로 이 팝업을 삭제하시겠습니까?')) {
                fetch(`/popup/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        return response.text().then(text => {
                            alert('삭제에 실패했습니다: ' + text);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                });
            }
        }
    </script>
</div>
