<div th:fragment="content" th:inline="text">
    <h1>패키지</h1>

    <!-- 1) 필터 폼 -->
    <form id="filterForm" th:object="${filter}">

        <!-- Product 필드 -->
        <div style="border: 1px solid black;">

            <label>Product 이름:</label>
            <input type="text" th:field="*{title}" placeholder="패키지 이름" />
            <br />

            <label>최소 가격:</label>
            <input type="number" th:field="*{minPrice}" placeholder="가격 최소" />
            <br />

            <label>최대 가격:</label>
            <input type="number" th:field="*{maxPrice}" placeholder="가격 최대" />
            <br />

            <label>키워드 :</label>
            <input type="text" th:field="*{infoKeyword}" placeholder="키워드" />
            <br />

            <label>최소 평점:</label>
            <input type="number" th:field="*{avgFrom}" placeholder="최소 평점" />
            <br />

            <label>최대 평점:</label>
            <input type="number" th:field="*{avgTo}" placeholder="최대 평점" />
            <br />

        </div>

        <!-- Tour 필드 -->
        <div style="border: 1px solid black;">

            <label>국가:</label>
            <input type="text" th:field="*{country}" placeholder="국가 입력" onchange="stripAfterPipe(this)" list="countryList"/>
            <br />

            <label>시작일 최소:</label>
            <input type="date" th:field="*{startDateFrom}" placeholder="시작일 From" />
            <br />

            <label>시작일 최대:</label>
            <input type="date" th:field="*{startDateTo}" placeholder="시작일 To" />
            <br />

            <label>완료일 최소:</label>
            <input type="date" th:field="*{endDateFrom}" placeholder="완료일 From" />
            <br />

            <label>완료일 최대:</label>
            <input type="date" th:field="*{endDateTo}" placeholder="완료일 To" />
            <br />

        </div>
        <!-- 검색 버튼 -->
        <button type="button" onclick="get(0, event)">검색</button>

        <!-- 정렬 기준 및 방향 (hidden input) -->
        <input type="hidden" name="sortField" th:value="${sortField}" />
        <input type="hidden" name="sortDir" th:value="${sortDir}" />

    </form>

    <!-- 조건 초기화 버튼 -->
    <button type="button" onclick="reset(event)">검색 초기화</button>

    <!-- 2) 결과 테이블 -->
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>이름</th>
                <th>
                    <a href="#" data-sortfield="price" th:data-sortdir="${sortField=='price' and sortDir=='asc' ? 'asc' : 'desc'}" onclick="toggleSort(this, event)">
                        가격
                        <span th:if="${sortField=='price'}" th:text="${sortDir=='asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>
                <th>투어 ID</th>
                <th>1점</th>
                <th>2점</th>
                <th>3점</th>
                <th>4점</th>
                <th>5점</th>
            </tr>

        </thead>
        <tbody>
            <tr th:each="product : ${productPage.content}" th:onclick="|window.location.href='@{/product/{id}(id=${product.id})}'|" style="cursor: pointer;">
                <td th:text="${product.id}">1</td>
                <td th:text="${product.title}">-</td>
                <td th:text="${product.price}">000</td>
                <td th:text="${product.tour.id}">000</td>
                <td th:text="${product.star1}">000</td>
                <td th:text="${product.star2}">000</td>
                <td th:text="${product.star3}">000</td>
                <td th:text="${product.star4}">000</td>
                <td th:text="${product.star5}">000</td>
            </tr>
        </tbody>
    </table>

    <!-- 3) 페이징 네비게이션 (정렬·필터 파라미터 유지) -->
    <div>
        <ul style="list-style: none; display: flex; gap:0.5rem;">
            <li th:if="${productPage.hasPrevious()}">
                <a th:onclick="|get(${productPage.number - 1})|" style="cursor: pointer;">
                    Prev
                </a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}">
                <a th:onclick="|get(${i})|" th:classappend="${i == productPage.number} ? ' active' : ''" th:text="${i + 1}" style="cursor: pointer;">
                </a>
            </li>
            <li th:if="${productPage.hasNext()}">
                <a th:onclick="|get(${productPage.number + 1})|" style="cursor: pointer;">>
                    Next
                </a>
            </li>
        </ul>
    </div>

    <a href="/product/new">새 패키지</a>

    <script src="/js/filter.js"></script>
    <script src="/js/util.js"></script>

    <datalist id="cityList">
        <option th:each="cc : ${cityCode}" th:value="${cc.airportCode} + ' | ' + ${cc.airportEng} + ' | ' + ${cc.countryCode} + ' | ' + ${cc.countryKor}"></option>
    </datalist>

    <datalist id="countryList">
        <option th:each="cc : ${countryCode}" th:value="${cc.code} + ' | ' + ${cc.eng} + ' | ' + ${cc.kor}"></option>
    </datalist>
</div>
