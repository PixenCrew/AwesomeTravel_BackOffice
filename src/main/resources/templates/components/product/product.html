<div th:fragment="content" class="flex flex-col h-full">

    <!-- 페이지 헤더 -->
    <div class="flex justify-between items-center mb-6 pb-4 border-b-2 border-gray-200 flex-shrink-0">
        <h1 class="text-3xl font-bold text-gray-800">상품 관리</h1>
        <a href="/product/new" class="inline-flex items-center px-6 py-3 text-white font-semibold rounded-lg transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <i class="fas fa-plus mr-2"></i>새 상품 등록
        </a>
    </div>

    <!-- 필터 섹션 -->
    <div class="bg-slate-50 border border-slate-200 rounded-xl p-6 mb-6 flex-shrink-0">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-semibold text-gray-700">검색 필터 <span id="filterCountBadge" class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded-md text-xs font-semibold ml-2 hidden">0</span></h3>
            <button type="button" id="toggleFilterBtn" class="bg-blue-600 text-white border-0 px-4 py-2 rounded-md cursor-pointer text-sm transition-colors duration-200 hover:bg-blue-700" onclick="toggleFilter()">
                <i class="fas fa-filter mr-1"></i>필터
            </button>
        </div>
        
        <form id="filterForm" th:object="${filter}" class="hidden">
            <div class="grid grid-cols-1 gap-4 mb-4" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
                <!-- Product 필드 -->
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">상품명</label>
                    <input type="text" th:field="*{title}" placeholder="상품명을 입력하세요" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>
                
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">최소 가격</label>
                    <input type="number" th:field="*{minPrice}" placeholder="최소 가격" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>
                
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">최대 가격</label>
                    <input type="number" th:field="*{maxPrice}" placeholder="최대 가격" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>
                
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">상품 상태</label>
                    <select th:field="*{status}" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100">
                        <option value="">전체</option>
                        <option value="active">활성</option>
                        <option value="inactive">비활성</option>
                        <option value="all">모든 상품</option>
                    </select>
                </div>
                
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">키워드</label>
                    <input type="text" th:field="*{infoKeyword}" placeholder="상품 정보 키워드" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>
                
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">최소 평점</label>
                    <input type="number" th:field="*{avgFrom}" placeholder="최소 평점" step="0.1" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>
                
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">최대 평점</label>
                    <input type="number" th:field="*{avgTo}" placeholder="최대 평점" step="0.1" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>
                
                <!-- Tour 필드 -->
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">국가</label>
                    <input type="text" th:field="*{country}" placeholder="국가를 입력하세요" 
                           onchange="stripAfterPipe(this)" list="countryList" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>
                
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">시작일 (최소)</label>
                    <input type="date" th:field="*{startDateFrom}" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>
                
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">시작일 (최대)</label>
                    <input type="date" th:field="*{startDateTo}" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>
                
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">종료일 (최소)</label>
                    <input type="date" th:field="*{endDateFrom}" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>
                
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">종료일 (최대)</label>
                    <input type="date" th:field="*{endDateTo}" class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>
            </div>
            
            <div class="flex gap-4 justify-end">
                <button type="button" class="bg-gray-500 text-white border-0 px-6 py-3 rounded-lg cursor-pointer font-semibold transition-colors duration-200 hover:bg-gray-600" onclick="resetFilterForm(event)">
                    <i class="fas fa-undo mr-1"></i>초기화
                </button>
                <button type="button" class="bg-emerald-600 text-white border-0 px-6 py-3 rounded-lg cursor-pointer font-semibold transition-colors duration-200 hover:bg-emerald-700" onclick="performSearch(0, event)">
                    <i class="fas fa-search mr-1"></i>검색
                </button>
            </div>
            
            <!-- 정렬 기준 및 방향 (hidden input) -->
            <input type="hidden" name="sortField" th:value="${sortField}" />
            <input type="hidden" name="sortDir" th:value="${sortDir}" />
        </form>
    </div>

    <!-- 결과 테이블 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col">
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex-shrink-0">
            <h3 class="text-lg font-semibold text-gray-800">상품 목록 <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 ml-2" th:text="'총 ' + ${productPage.totalElements} + '개'"></span></h3>
        </div>
        
        <div class="flex-1 overflow-auto table-responsive" style="max-height: calc(100vh - 500px); min-height: 200px;">
            <table class="min-w-full divide-y divide-gray-200" style="table-layout: fixed; width: 100%;">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 8%;">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 35%;">
                        <a href="#" data-sortfield="title" data-sortdir="asc" onclick="toggleSort(this, event)" class="group inline-flex items-center hover:text-gray-700">
                            상품명
                            <i th:if="${sortField=='title'}" th:class="${sortDir=='asc'} ? 'fas fa-sort-up ml-1' : 'fas fa-sort-down ml-1'"></i>
                        </a>
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 12%;">
                        <a href="#" data-sortfield="price" data-sortdir="desc" onclick="toggleSort(this, event)" class="group inline-flex items-center hover:text-gray-700">
                            가격
                            <i th:if="${sortField=='price'}" th:class="${sortDir=='asc'} ? 'fas fa-sort-up ml-1' : 'fas fa-sort-down ml-1'"></i>
                        </a>
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 10%;">투어 ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 20%;">평점 분포</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 8%;">상태</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="width: 7%;">작업</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr th:each="product : ${productPage.content}" th:onclick="|window.location.href='@{/product/{id}(id=${product.id})}'|" class="hover:bg-gray-50 cursor-pointer transition-colors duration-150">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${product.id}">1</td>
                    <td class="px-6 py-4 text-sm text-gray-900">
                        <div class="font-semibold text-gray-900 truncate" th:text="${product.title}" th:title="${product.title}">상품명</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-semibold" th:text="${#numbers.formatInteger(product.price, 3, 'COMMA') + '원'}">100,000원</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span th:text="${product.tour.id}">123</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        <div class="flex items-center space-x-1">
                            <div class="flex items-center">
                                <span th:each="i : ${#numbers.sequence(1, 5)}" 
                                      th:class="${i <= T(java.lang.Math).round(product.averageRating)} ? 'text-yellow-400 fas fa-star' : 'text-gray-300 far fa-star'"></span>
                                <span class="ml-1 text-sm font-medium" th:text="${#numbers.formatDecimal(product.averageRating, 1, 1)}">4.2</span>
                            </div>
                            <div class="text-xs text-gray-500">
                                <span th:text="'(' + ${product.totalReviews} + '개 리뷰)'">(15개 리뷰)</span>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span th:if="${product.isActive}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">활성</span>
                        <span th:unless="${product.isActive}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">비활성</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <div class="flex space-x-2">
                            <button th:if="${product.isActive}" 
                                    th:onclick="|deactivateProduct(${product.id})|" 
                                    class="inline-flex items-center px-2 py-1 border border-transparent text-xs font-medium rounded text-yellow-700 bg-yellow-100 hover:bg-yellow-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500"
                                    onclick="event.stopPropagation()"
                                    title="비활성화">
                                <i class="fas fa-pause mr-1"></i>
                            </button>
                            <button th:unless="${product.isActive}" 
                                    th:onclick="|activateProduct(${product.id})|" 
                                    class="inline-flex items-center px-2 py-1 border border-transparent text-xs font-medium rounded text-green-700 bg-green-100 hover:bg-green-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
                                    onclick="event.stopPropagation()"
                                    title="활성화">
                                <i class="fas fa-play mr-1"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
    </div>

        <!-- 페이징 -->
        <div class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6 flex-shrink-0">
            <div class="flex-1 flex justify-between sm:hidden">
                <a th:if="${productPage.hasPrevious()}" href="#" th:onclick="|performSearch(${productPage.number - 1}, event)|" class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                    이전
                </a>
                <a th:if="${productPage.hasNext()}" href="#" th:onclick="|performSearch(${productPage.number + 1}, event)|" class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                    다음
                </a>
            </div>
            <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                <div>
                    <p class="text-sm text-gray-700">
                        총 <span class="font-medium" th:text="${productPage.totalElements}">0</span>개 중 
                        <span class="font-medium" th:text="${productPage.number * productPage.size + 1}">1</span>-<span class="font-medium" th:text="${(productPage.number + 1) * productPage.size > productPage.totalElements ? productPage.totalElements : (productPage.number + 1) * productPage.size}">10</span>개 표시
                    </p>
                </div>
                <div>
                    <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                        <!-- 이전 페이지 버튼 -->
                        <a th:if="${productPage.hasPrevious()}" th:href="@{/product(page=${productPage.number - 1}, sortField=${sortField}, sortDir=${sortDir})}" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                            <i class="fas fa-chevron-left"></i>
                        </a>
                        
                        <!-- 페이지 번호들 (최대 10개만 표시) -->
                        <th:block th:with="startPage=${productPage.number > 5 ? productPage.number - 5 : 0}, endPage=${productPage.number + 5 < productPage.totalPages ? productPage.number + 5 : productPage.totalPages - 1}">
                            <a th:each="i : ${#numbers.sequence(startPage, endPage)}" 
                              th:href="@{/product(page=${i}, sortField=${sortField}, sortDir=${sortDir})}" 
                              th:class="${i == productPage.number} ? 'z-10 bg-blue-50 border-blue-500 text-blue-600 relative inline-flex items-center px-4 py-2 border text-sm font-medium' : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50 relative inline-flex items-center px-4 py-2 border text-sm font-medium'" 
                              th:text="${i + 1}">1</a>
                        </th:block>
                        
                        <!-- 다음 페이지 버튼 -->
                        <a th:if="${productPage.hasNext()}" th:href="@{/product(page=${productPage.number + 1}, sortField=${sortField}, sortDir=${sortDir})}" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                            <i class="fas fa-chevron-right"></i>
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/util.js"></script>
    
    <script>
        // toggleFilter, performSearch, resetFilterForm, toggleSort는 filter.js에서 전역으로 제공됨

        function countActiveFilters(form) {
            if (!form) return 0;
            const seenNames = new Set();
            let count = 0;
            const elements = Array.from(form.elements);
            const skip = new Set(['page','size','sort','sortField','sortDir','_csrf']);
            elements.forEach(el => {
                if (!el.name || skip.has(el.name)) return;
                if (el.type === 'hidden') return;
                if (el.type === 'radio') {
                    if (seenNames.has(el.name)) return;
                    seenNames.add(el.name);
                    const checked = form.querySelector(`input[name="${el.name}"]:checked`);
                    if (checked && checked.value !== '' && checked.value != null) count++;
                    return;
                }
                if (el.type === 'checkbox') {
                    if (seenNames.has(el.name)) return;
                    seenNames.add(el.name);
                    const anyChecked = form.querySelectorAll(`input[name="${el.name}"]:checked`).length > 0;
                    if (anyChecked) count++;
                    return;
                }
                const val = (el.value || '').toString().trim();
                if (val !== '') count++;
            });
            return count;
        }

        function updateFilterCount() {
            const form = document.getElementById('filterForm');
            const badge = document.getElementById('filterCountBadge');
            if (!form || !badge) return;
            const n = countActiveFilters(form);
            if (n > 0) {
                badge.textContent = n;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }
        
        function deactivateProduct(id) {
            if (confirm('정말로 이 상품을 비활성화하시겠습니까?')) {
                fetch('/product/' + id, { method: 'DELETE' })
                    .then(res => {
                        if (res.ok) {
                            alert('상품이 비활성화되었습니다.');
                            window.location.reload();
                        } else {
                            alert('비활성화에 실패했습니다.');
                        }
                    })
                    .catch(err => {
                        console.error('Error:', err);
                        alert('비활성화 중 오류가 발생했습니다.');
                    });
            }
        }
        
        function activateProduct(id) {
            if (confirm('정말로 이 상품을 활성화하시겠습니까?')) {
                fetch('/product/' + id + '/activate', { method: 'POST' })
                    .then(res => {
                        if (res.ok) {
                            alert('상품이 활성화되었습니다.');
                            window.location.reload();
                        } else {
                            alert('활성화에 실패했습니다.');
                        }
                    })
                    .catch(err => {
                        console.error('Error:', err);
                        alert('활성화 중 오류가 발생했습니다.');
                    });
            }
        }
        
        // 페이지 로드 시 필터 카운트 업데이트
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('filterForm');
            if (form) {
                form.addEventListener('input', updateFilterCount, true);
                form.addEventListener('change', updateFilterCount, true);
                updateFilterCount();
            }
        });
    </script>

    <datalist id="countryList">
        <option th:each="cc : ${countryCode}" th:value="${cc.code + ' | ' + cc.nameEng + ' | ' + cc.nameKor}"></option>
    </datalist>
</div>
