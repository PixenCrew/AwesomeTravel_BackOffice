<div th:fragment="content" class="flex flex-col h-full">

    <!-- 헤더 -->
    <div class="flex justify-between items-center mb-6 pb-4 border-b-2 border-gray-200">
        <h1 class="text-3xl font-bold text-gray-800"
            th:text="${promotion.id == null} ? '기획전 등록' : '기획전 상세 / 수정'"></h1>
    </div>

    <!-- 저장 폼 -->
    <form id="promotionForm" th:action="@{/promotion}" th:object="${promotion}" method="post"
        class="bg-white rounded-lg shadow-sm p-6 border border-gray-200 w-full max-w-3xl mb-10">

        <input type="hidden" th:field="*{id}" />

        <div class="mb-4">
            <label class="block font-medium text-gray-700 mb-2">제목</label>
            <input type="text" th:field="*{title}"
                class="p-3 border rounded w-full" />
        </div>

        <div class="mb-4">
            <label class="block font-medium text-gray-700 mb-2">메뉴코드</label>
            <input list="menuCodes" 
                   type="text" 
                   name="menuCodeCode" 
                   th:value="${promotion.menuCode != null ? promotion.menuCode.code : ''}" 
                   class="p-3 border rounded w-full" />
        </div>

        <div class="mb-4">
            <label class="block font-medium text-gray-700 mb-2">설명</label>
            <input type="text" th:field="*{description}"
                class="p-3 border rounded w-full" />
        </div>

        <div class="mb-4">
            <label class="block font-medium text-gray-700 mb-2">섬네일 이미지</label>
            <input type="text" th:field="*{thumnailImg}" placeholder="이미지 URL" readonly />
            <input type="file" onchange="uploadImage(this, 'promotion')" />
        </div>

        <div class="mb-4">
            <label class="block font-medium text-gray-700 mb-2">상세 이미지</label>
            <input type="text" th:field="*{contentImg}" placeholder="이미지 URL" readonly />
            <input type="file" onchange="uploadImage(this, 'promotion')" />
        </div>
        <!-- 
        <div class="bg-white shadow rounded-lg">
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-base font-semibold leading-6 text-gray-900 mb-4">상세이미지 관리</h3>
                <fieldset id="images-fieldset" class="space-y-4">
                    <div class="image-item">
                        <div class="flex space-x-2">
                            <input type="text" th:field="*{contentImg}" placeholder="이미지 URL" readonly />
                            <input type="file" onchange="uploadImage(this)" />
                        </div>
                    </div>
                </fieldset>
            </div>
        </div> -->

        <!-- 기간 -->
        <div class="mb-4">
            <label class="block font-medium text-gray-700 mb-2">시작 시간</label>
            <input type="datetime-local" th:field="*{startTime}" id="startTime"
                onchange="validatePromotionDates()" required
                class="p-3 border rounded w-full" />
            <p id="startTimeError" class="text-red-600 text-sm mt-1" style="display: none;"></p>
        </div>

        <div class="mb-4">
            <label class="block font-medium text-gray-700 mb-2">종료 시간</label>
            <input type="datetime-local" th:field="*{endTime}" id="endTime"
                onchange="validatePromotionDates()" required
                class="p-3 border rounded w-full" />
            <p id="endTimeError" class="text-red-600 text-sm mt-1" style="display: none;"></p>
        </div>

    </form>

    <div class="flex justify-between items-center mt-6">

        <!-- 목록 -->
        <a href="/promotion"
            class="px-6 py-3 bg-gray-500 text-white rounded-lg hover:bg-gray-600">
            목록으로
        </a>

        <div class="flex gap-3">

            <!-- 삭제 폼 (독립적) -->
            <form th:action="@{/promotion/{id}/delete(id=${promotion.id})}"
                method="post"
                onsubmit="return confirm('정말 삭제하시겠습니까?');">

                <button type="submit"
                    class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700">
                    삭제
                </button>
            </form>

            <!-- 저장 버튼 : 저장 폼을 정확히 지정 -->
            <button type="submit"
                form="promotionForm"
                class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                저장
            </button>
        </div>
    </div>

    <datalist id="menuCodes">
        <option th:each="mc : ${menuCodes}" th:value="${mc.code}" th:text="${mc.name}"></option>
    </datalist>

    <script>
        // 프로모션 시작 시간/종료 시간 유효성 검사
        function validatePromotionDates() {
            const startTimeInput = document.getElementById('startTime');
            const endTimeInput = document.getElementById('endTime');
            const startTimeError = document.getElementById('startTimeError');
            const endTimeError = document.getElementById('endTimeError');

            // 에러 메시지 초기화
            if (startTimeError) {
                startTimeError.style.display = 'none';
                startTimeError.textContent = '';
            }
            if (endTimeError) {
                endTimeError.style.display = 'none';
                endTimeError.textContent = '';
            }
            if (startTimeInput) {
                startTimeInput.classList.remove('border-red-500');
            }
            if (endTimeInput) {
                endTimeInput.classList.remove('border-red-500');
            }

            const startTime = startTimeInput ? startTimeInput.value : null;
            const endTime = endTimeInput ? endTimeInput.value : null;

            if (startTime && endTime) {
                const start = new Date(startTime);
                const end = new Date(endTime);

                if (end <= start) {
                    if (endTimeError) {
                        endTimeError.textContent = '종료 시간은 시작 시간보다 이후여야 합니다.';
                        endTimeError.style.display = 'block';
                    }
                    if (endTimeInput) {
                        endTimeInput.classList.add('border-red-500');
                        endTimeInput.focus();
                    }
                    return false;
                }
            }

            return true;
        }

        // 폼 제출 시 최종 검증
        document.getElementById('promotionForm').addEventListener('submit', function(e) {
            if (!validatePromotionDates()) {
                e.preventDefault();
                alert('종료 시간은 시작 시간보다 이후여야 합니다. 시간을 확인해주세요.');
                return false;
            }
        });
    </script>

</div>
