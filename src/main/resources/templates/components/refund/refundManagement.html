<div th:fragment="content">
    <div class="container mx-auto px-4 py-8">
        <!-- 헤더 -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">환불 관리</h1>
            <p class="text-gray-600">고객 환불 요청을 관리하고 처리하세요</p>
        </div>

        <!-- 통계 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-blue-50 p-6 rounded-lg">
                <div class="flex items-center">
                    <div class="p-2 bg-blue-100 rounded-lg">
                        <i class="fas fa-clock text-blue-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">대기 중</p>
                        <p class="text-2xl font-bold text-blue-600" th:text="${refundStats.requestedCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-green-50 p-6 rounded-lg">
                <div class="flex items-center">
                    <div class="p-2 bg-green-100 rounded-lg">
                        <i class="fas fa-check text-green-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">승인됨</p>
                        <p class="text-2xl font-bold text-green-600" th:text="${refundStats.approvedCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-purple-50 p-6 rounded-lg">
                <div class="flex items-center">
                    <div class="p-2 bg-purple-100 rounded-lg">
                        <i class="fas fa-check-circle text-purple-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">처리 완료</p>
                        <p class="text-2xl font-bold text-purple-600" th:text="${refundStats.processedCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-red-50 p-6 rounded-lg">
                <div class="flex items-center">
                    <div class="p-2 bg-red-100 rounded-lg">
                        <i class="fas fa-times text-red-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">거부됨</p>
                        <p class="text-2xl font-bold text-red-600" th:text="${refundStats.rejectedCount}">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 디버깅 정보 -->
        <div class="bg-yellow-50 p-4 rounded-lg mb-4">
            <p>현재 상태: <span th:text="${status}">null</span></p>
            <p>현재 주문유형: <span th:text="${refundType}">null</span></p>
        </div>

        <!-- 필터 -->
        <div class="bg-white p-6 rounded-lg shadow-sm mb-6">
            <div class="flex flex-wrap gap-4 items-center">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">상태</label>
                    <select id="statusFilter" class="border border-gray-300 rounded-md px-3 py-2">
                        <option value="">전체</option>
                        <option value="REQUESTED">대기 중</option>
                        <option value="APPROVED">승인됨</option>
                        <option value="PROCESSED">처리 완료</option>
                        <option value="REJECTED">거부됨</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">주문유형</label>
                    <select id="refundTypeFilter" class="border border-gray-300 rounded-md px-3 py-2">
                        <option value="">전체</option>
                        <option value="AIR_PURCHASE">항공권</option>
                        <option value="PRODUCT_PURCHASE">패키지</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="applyFilter()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                        <i class="fas fa-search mr-2"></i>검색
                    </button>
                </div>
            </div>
        </div>

        <!-- 환불 목록 -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">환불 ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">주문번호</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">주문유형</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">환불금액</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">환불사유</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">요청일</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">상태</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">작업</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:if="${refundPage.content.isEmpty()}">
                            <td colspan="8" class="px-6 py-12 text-center text-gray-500">
                                <i class="fas fa-inbox text-4xl mb-4"></i>
                                <p>환불 요청이 없습니다.</p>
                            </td>
                        </tr>
                        <tr th:each="refund : ${refundPage.content}">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-gray-900" th:text="${refund.id}">#12345</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${refund.purchaseId}">#2001</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                <span th:if="${refund.refundType.name() == 'AIR_PURCHASE'}" class="px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">항공권</span>
                                <span th:if="${refund.refundType.name() == 'PRODUCT_PURCHASE'}" class="px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">패키지</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${#numbers.formatInteger(refund.refundAmount, 3, 'COMMA')} + '원'">550,000원</td>
                            <td class="px-6 py-4 text-sm text-gray-900 max-w-xs truncate" th:text="${refund.refundReason}">고객 요청</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(refund.requestDate, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span th:if="${refund.status.name() == 'REQUESTED'}" 
                                      class="px-2 py-1 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800"
                                      th:text="'대기 중'">대기 중</span>
                                <span th:if="${refund.status.name() == 'APPROVED'}" 
                                      class="px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800"
                                      th:text="'승인됨'">승인됨</span>
                                <span th:if="${refund.status.name() == 'PROCESSED'}" 
                                      class="px-2 py-1 rounded-full text-xs font-medium bg-purple-100 text-purple-800"
                                      th:text="'처리 완료'">처리 완료</span>
                                <span th:if="${refund.status.name() == 'REJECTED'}" 
                                      class="px-2 py-1 rounded-full text-xs font-medium bg-red-100 text-red-800"
                                      th:text="'거부됨'">거부됨</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <div class="flex space-x-2">
                                    <button th:if="${refund.status.name() == 'REQUESTED'}"
                                            th:onclick="|approveRefund(${refund.id})|"
                                            class="text-green-600 hover:text-green-900">
                                        <i class="fas fa-check"></i> 승인
                                    </button>
                                    <button th:if="${refund.status.name() == 'APPROVED'}"
                                            th:onclick="|processRefund(${refund.id})|"
                                            class="text-purple-600 hover:text-purple-900">
                                        <i class="fas fa-check-circle"></i> 처리완료
                                    </button>
                                    <button th:if="${refund.status.name() == 'REQUESTED'}"
                                            th:onclick="|rejectRefund(${refund.id})|"
                                            class="text-red-600 hover:text-red-900">
                                        <i class="fas fa-times"></i> 거부
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 페이지네이션 -->
        <div class="mt-6 flex justify-center" th:if="${refundPage.totalPages > 1}">
            <nav class="flex space-x-2">
                <button th:disabled="${refundPage.first}"
                        th:onclick="|goToPage(${refundPage.number - 1})|"
                        class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50">
                    이전
                </button>
                <th:block th:each="pageNum : ${#numbers.sequence(0, refundPage.totalPages - 1)}">
                    <button th:class="'px-3 py-2 text-sm font-medium rounded-md ' + ${pageNum == refundPage.number} ? 'bg-blue-600 text-white' : 'text-gray-500 bg-white border border-gray-300 hover:bg-gray-50'"
                            th:onclick="|goToPage(${pageNum})|"
                            th:text="${pageNum + 1}">1</button>
                </th:block>
                <button th:disabled="${refundPage.last}"
                        th:onclick="|goToPage(${refundPage.number + 1})|"
                        class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50">
                    다음
                </button>
            </nav>
        </div>
    </div>

    <script>
        // 페이지 로드 시 현재 선택된 값 설정
        document.addEventListener('DOMContentLoaded', function() {
            const currentStatus = '[[${status}]]';
            const currentRefundType = '[[${refundType}]]';
            
            console.log('Current status from server:', currentStatus);
            console.log('Current refundType from server:', currentRefundType);
            
            // URL 파라미터에서도 확인
            const urlParams = new URLSearchParams(window.location.search);
            const urlStatus = urlParams.get('status');
            const urlRefundType = urlParams.get('refundType');
            
            console.log('URL status:', urlStatus);
            console.log('URL refundType:', urlRefundType);
            
            // 서버 값이 있으면 사용, 없으면 URL 파라미터 사용
            const finalStatus = currentStatus && currentStatus !== 'null' ? currentStatus : urlStatus;
            const finalRefundType = currentRefundType && currentRefundType !== 'null' ? currentRefundType : urlRefundType;
            
            console.log('Final status to set:', finalStatus);
            console.log('Final refundType to set:', finalRefundType);
            
            if (finalStatus) {
                const statusSelect = document.getElementById('statusFilter');
                statusSelect.value = finalStatus;
                console.log('Status filter set to:', statusSelect.value);
            }
            
            if (finalRefundType) {
                const refundTypeSelect = document.getElementById('refundTypeFilter');
                refundTypeSelect.value = finalRefundType;
                console.log('RefundType filter set to:', refundTypeSelect.value);
            }
        });

        function applyFilter() {
            const status = document.getElementById('statusFilter').value;
            const refundType = document.getElementById('refundTypeFilter').value;
            const url = new URL(window.location);
            
            if (status) {
                url.searchParams.set('status', status);
            } else {
                url.searchParams.delete('status');
            }
            
            if (refundType) {
                url.searchParams.set('refundType', refundType);
            } else {
                url.searchParams.delete('refundType');
            }
            
            url.searchParams.set('page', '0');
            window.location.href = url.toString();
        }

        function goToPage(page) {
            const url = new URL(window.location);
            url.searchParams.set('page', page);
            window.location.href = url.toString();
        }

        function approveRefund(refundId) {
            const adminNote = prompt('승인 사유를 입력하세요 (선택사항):');
            if (adminNote !== null) {
                fetch(`/api/admin/refunds/${refundId}/approve?adminNote=${encodeURIComponent(adminNote || '')}`, {
                    method: 'PATCH'
                })
                .then(response => {
                    if (response.ok) {
                        alert('환불이 승인되었습니다.');
                        location.reload();
                    } else {
                        alert('환불 승인 실패');
                    }
                });
            }
        }

        function processRefund(refundId) {
            if (confirm('환불 처리를 완료하시겠습니까?')) {
                fetch(`/api/admin/refunds/${refundId}/process`, {
                    method: 'PATCH'
                })
                .then(response => {
                    if (response.ok) {
                        alert('환불 처리가 완료되었습니다.');
                        location.reload();
                    } else {
                        alert('환불 처리 실패');
                    }
                });
            }
        }

        function rejectRefund(refundId) {
            const reason = prompt('거부 사유를 입력하세요:');
            if (reason && reason.trim()) {
                fetch(`/api/admin/refunds/${refundId}/reject?reason=${encodeURIComponent(reason.trim())}`, {
                    method: 'PATCH'
                })
                .then(response => {
                    if (response.ok) {
                        alert('환불이 거부되었습니다.');
                        location.reload();
                    } else {
                        alert('환불 거부 실패');
                    }
                });
            }
        }
    </script>
</div>
