<div th:fragment="content">
    <div class="space-y-6">
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">지역 카테고리 관리</h2>
                <p class="text-sm text-gray-600 mt-1">대륙, 지역, 국가, 지역구를 관리합니다.</p>
            </div>
            <a href="/region-category/new" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                <i class="fas fa-plus mr-2"></i>새 카테고리 등록
            </a>
        </div>

        <div th:if="${param.message}" class="p-4 bg-green-100 text-green-800 rounded-lg">
            <span th:text="${param.message}">성공</span>
        </div>
        <div th:if="${param.error}" class="p-4 bg-red-100 text-red-800 rounded-lg">
            <span th:text="${param.error}">오류</span>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-6">
            <form method="GET" action="/region-category" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">타입 필터</label>
                    <select name="type" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                        <option value="">전체</option>
                        <option value="CONTINENT" th:selected="${selectedType == 'CONTINENT'}">대륙</option>
                        <option value="REGION" th:selected="${selectedType == 'REGION'}">지역</option>
                        <option value="COUNTRY" th:selected="${selectedType == 'COUNTRY'}">국가</option>
                        <option value="SUB_REGION" th:selected="${selectedType == 'SUB_REGION'}">지역구</option>
                        <option value="CITY" th:selected="${selectedType == 'CITY'}">도시</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">검색어</label>
                    <input type="text" name="searchKeyword" th:value="${searchKeyword}" placeholder="이름 검색" class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div class="flex items-end gap-2">
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"><i class="fas fa-search mr-2"></i>검색</button>
                    <a href="/region-category" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700"><i class="fas fa-refresh mr-2"></i>초기화</a>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">코드</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">이름</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">영문명</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">타입</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">부모 ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">순서</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">작업</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="cat : ${categoryPage.content}" class="hover:bg-gray-50 cursor-pointer category-row" th:data-id="${cat.id}">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium" th:text="${cat.id}">1</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm" th:text="${cat.code}">ASIA</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium" th:text="${cat.name}">아시아</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm" th:text="${cat.nameEng}">Asia</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span th:if="${cat.type?.name() == 'CONTINENT'}" class="px-2 py-1 text-xs rounded-full bg-purple-100 text-purple-800">대륙</span>
                            <span th:if="${cat.type?.name() == 'REGION'}" class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800">지역</span>
                            <span th:if="${cat.type?.name() == 'COUNTRY'}" class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800">국가</span>
                            <span th:if="${cat.type?.name() == 'SUB_REGION'}" class="px-2 py-1 text-xs rounded-full bg-yellow-100 text-yellow-800">지역구</span>
                            <span th:if="${cat.type?.name() == 'CITY'}" class="px-2 py-1 text-xs rounded-full bg-gray-100 text-gray-800">도시</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm" th:text="${cat.parentId}">-</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm" th:text="${cat.displayOrder}">0</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <div class="flex items-center space-x-2" onclick="event.stopPropagation()">
                                <a th:href="@{/region-category/{id}(id=${cat.id})}" class="inline-flex items-center px-3 py-1.5 bg-blue-100 text-blue-700 rounded hover:bg-blue-200" title="상세"><i class="fas fa-eye text-sm"></i></a>
                                <a th:href="@{/region-category/edit/{id}(id=${cat.id})}" class="inline-flex items-center px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded hover:bg-indigo-200" title="수정"><i class="fas fa-edit text-sm"></i></a>
                                <button th:data-id="${cat.id}" onclick="deleteCategory(this.dataset.id)" class="inline-flex items-center px-3 py-1.5 bg-red-100 text-red-700 rounded hover:bg-red-200" title="삭제" type="button"><i class="fas fa-trash text-sm"></i></button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div th:if="${categoryPage.content.isEmpty()}" class="text-center py-12">
                <i class="fas fa-map-marked-alt text-4xl text-gray-400 mb-4"></i>
                <h3 class="text-lg font-medium text-gray-900 mb-2">등록된 카테고리가 없습니다</h3>
                <a href="/region-category/new" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"><i class="fas fa-plus mr-2"></i>새 카테고리 등록</a>
            </div>
        </div>

        <div th:if="${categoryPage.totalPages > 1}" class="flex justify-between">
            <div class="text-sm text-gray-700"><span th:text="${categoryPage.number + 1}">1</span> / <span th:text="${categoryPage.totalPages}">1</span> (총 <span th:text="${categoryPage.totalElements}">0</span>개)</div>
            <div class="flex space-x-2">
                <a th:if="${categoryPage.hasPrevious()}" th:href="@{/region-category(page=${categoryPage.number - 1})}" class="px-3 py-2 border rounded-lg">이전</a>
                <a th:if="${categoryPage.hasNext()}" th:href="@{/region-category(page=${categoryPage.number + 1})}" class="px-3 py-2 border rounded-lg">다음</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.category-row').forEach(row => {
                row.addEventListener('click', function() {
                    location.href = '/region-category/' + this.dataset.id;
                });
            });
        });

        function deleteCategory(id) {
            if (confirm('카테고리를 삭제하시겠습니까?\n※ 하위 카테고리가 있으면 삭제할 수 없습니다.')) {
                fetch(`/region-category/${id}`, { method: 'DELETE' })
                .then(response => response.ok ? location.reload() : response.text().then(text => alert('삭제 실패: ' + text)))
                .catch(() => alert('오류 발생'));
            }
        }
    </script>
</div>
