<div th:fragment="content" class="flex flex-col h-full p-6 bg-gray-50">
    <div class="mb-4">
        <h2 class="text-xl font-bold text-gray-900 mb-2">상품 검색 후 행을 클릭하면 타임딜에 추가됩니다</h2>
        <form method="get" action="/timeDeal/product-search" class="flex gap-2 items-center">
            <input type="text"
                   name="title"
                   th:value="${filter != null && filter.title != null} ? ${filter.title} : ''"
                   placeholder="상품명 검색"
                   class="flex-1 max-w-md px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
            <input type="hidden" name="sortField" th:value="${sortField}"/>
            <input type="hidden" name="sortDir" th:value="${sortDir}"/>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                <i class="fas fa-search mr-1"></i>검색
            </button>
        </form>
    </div>

    <div class="flex-1 overflow-auto bg-white rounded-lg border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50 sticky top-0">
                <tr>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">상품명</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">가격</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">선택</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr th:each="p : ${productPage.content}"
                    class="hover:bg-blue-50 cursor-pointer transition"
                    th:attr="data-id=${p.id},
                             data-title=${p.title != null ? p.title : ''},
                             data-price=${p.price != null ? p.price : 0}"
                    th:onclick="|selectProduct(this)|">
                    <td class="px-4 py-3 text-sm font-medium text-gray-900" th:text="${p.id}">1</td>
                    <td class="px-4 py-3 text-sm text-gray-900 truncate max-w-xs" th:text="${p.title}" th:title="${p.title}">상품명</td>
                    <td class="px-4 py-3 text-sm text-gray-900" th:text="${p.price != null ? #numbers.formatInteger(p.price, 3, 'COMMA') + '원' : '-'}">0원</td>
                    <td class="px-4 py-3 text-sm">
                        <span class="text-blue-600 font-medium">선택</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productPage.content)}">
                    <td colspan="4" class="px-4 py-8 text-center text-gray-500">검색 결과가 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4 flex justify-between items-center text-sm text-gray-600" th:with="titleParam=${filter != null && filter.title != null ? filter.title : ''}">
        <span>총 <strong th:text="${productPage.totalElements}">0</strong>건</span>
        <div class="flex gap-2">
            <a th:if="${productPage.hasPrevious()}"
               th:href="@{/timeDeal/product-search(title=${titleParam}, page=${productPage.number - 1}, sortField=${sortField}, sortDir=${sortDir})}"
               class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-100">이전</a>
            <span th:text="${productPage.number + 1 + ' / ' + productPage.totalPages}">1 / 1</span>
            <a th:if="${productPage.hasNext()}"
               th:href="@{/timeDeal/product-search(title=${titleParam}, page=${productPage.number + 1}, sortField=${sortField}, sortDir=${sortDir})}"
               class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-100">다음</a>
        </div>
    </div>

    <script th:inline="javascript">
        function selectProduct(row) {
            const id = row.getAttribute('data-id');
            const title = row.getAttribute('data-title') || '';
            const price = row.getAttribute('data-price') || '0';
            if (window.opener && !window.opener.closed && typeof window.opener.addProductFromPopup === 'function') {
                window.opener.addProductFromPopup(id, title, price);
                window.close();
            } else {
                alert('부모 창을 찾을 수 없습니다. 타임딜 화면에서 다시 시도해 주세요.');
            }
        }
    </script>
</div>
