<div th:fragment="content" class="flex flex-col h-full">

    <!-- 헤더 -->
    <div class="flex justify-between items-center mb-6 pb-4 border-b-2 border-gray-200 flex-shrink-0">
        <h1 class="text-3xl font-bold text-gray-800">타임딜 관리</h1>
        <a href="/timeDeal/new"
            class="inline-flex items-center px-6 py-3 text-white font-semibold rounded-lg transition-all duration-300
                  hover:-translate-y-0.5 hover:shadow-lg"
            style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <i class="fas fa-plus mr-2"></i>새 타임딜 등록
        </a>
    </div>

    <!-- 필터 섹션 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
        <form th:action="@{/timeDeal}" method="GET" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" onsubmit="resetPage()">
            <input type="hidden" name="page" value="0" id="pageInput">
            <input type="hidden" name="sortField" th:value="${sortField != null ? sortField : 'startTime'}" id="sortFieldInput">
            <input type="hidden" name="sortDir" th:value="${sortDir != null ? sortDir : 'desc'}" id="sortDirInput">
            <div>
                <label for="discountType" class="block text-sm font-medium text-gray-700 mb-2">할인 유형</label>
                <select id="discountType" 
                        name="discountType" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="">전체</option>
                    <option value="PERCENT" th:selected="${filter?.discountType?.name() == 'PERCENT'}">정률할인</option>
                    <option value="ABSOLUTE" th:selected="${filter?.discountType?.name() == 'ABSOLUTE'}">정액할인</option>
                </select>
            </div>
            
            <div>
                <label for="active" class="block text-sm font-medium text-gray-700 mb-2">상태</label>
                <select id="active" 
                        name="active" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="">전체</option>
                    <option value="true" th:selected="${filter?.active == true}">진행중</option>
                    <option value="false" th:selected="${filter?.active == false}">종료/예정</option>
                </select>
            </div>
            
            <div>
                <label for="startDateFrom" class="block text-sm font-medium text-gray-700 mb-2">시작일 (부터)</label>
                <input type="date" 
                       id="startDateFrom" 
                       name="startDateFrom" 
                       th:value="${filter?.startDateFrom}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div>
                <label for="startDateTo" class="block text-sm font-medium text-gray-700 mb-2">시작일 (까지)</label>
                <input type="date" 
                       id="startDateTo" 
                       name="startDateTo" 
                       th:value="${filter?.startDateTo}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div>
                <label for="endDateFrom" class="block text-sm font-medium text-gray-700 mb-2">종료일 (부터)</label>
                <input type="date" 
                       id="endDateFrom" 
                       name="endDateFrom" 
                       th:value="${filter?.endDateFrom}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div>
                <label for="endDateTo" class="block text-sm font-medium text-gray-700 mb-2">종료일 (까지)</label>
                <input type="date" 
                       id="endDateTo" 
                       name="endDateTo" 
                       th:value="${filter?.endDateTo}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div>
                <label for="minValue" class="block text-sm font-medium text-gray-700 mb-2">할인 값 (최소)</label>
                <input type="number" 
                       id="minValue" 
                       name="minValue" 
                       th:value="${filter?.minValue}"
                       min="0"
                       placeholder="최소값"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div>
                <label for="maxValue" class="block text-sm font-medium text-gray-700 mb-2">할인 값 (최대)</label>
                <input type="number" 
                       id="maxValue" 
                       name="maxValue" 
                       th:value="${filter?.maxValue}"
                       min="0"
                       placeholder="최대값"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div class="flex items-end gap-2">
                <button type="submit" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200">
                    <i class="fas fa-search mr-2"></i>검색
                </button>
                <button type="button" 
                        onclick="resetFilter()" 
                        class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors duration-200">
                    <i class="fas fa-redo mr-2"></i>초기화
                </button>
            </div>
        </form>
    </div>

    <!-- 리스트 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col">

        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex-shrink-0">
            <h3 class="text-lg font-semibold text-gray-800">
                타임딜 목록
                <span class="ml-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
                             bg-blue-100 text-blue-800"
                    th:text="'총 ' + ${timeDealPage.totalElements} + '개'"></span>
            </h3>
        </div>

        <div class="flex-1 overflow-auto">
            <table class="min-w-full divide-y divide-gray-200">

                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">기간</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">할인 유형</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">값</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">상태</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">작업</th>
                    </tr>
                </thead>

                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:if="${timeDealPage.content.isEmpty()}">
                        <td colspan="6" class="px-6 py-4 text-center text-sm text-gray-500">
                            검색 조건에 맞는 타임딜이 없습니다.
                        </td>
                    </tr>
                    <tr th:each="td : ${list}" class="hover:bg-gray-50">

                        <!-- ID -->
                        <td class="px-6 py-4 text-sm font-medium text-gray-800"
                            th:text="${td.id}">1</td>

                        <!-- 기간 -->
                        <td class="px-6 py-4 text-sm text-gray-700">
                            <div>
                                <span th:text="${#temporals.format(td.startTime,'yyyy-MM-dd HH:mm')}"></span>
                                ~
                                <span th:text="${#temporals.format(td.endTime,'yyyy-MM-dd HH:mm')}"></span>
                            </div>
                        </td>

                        <!-- 할인 유형 -->
                        <td class="px-6 py-4 text-sm text-gray-700">
                            <span th:switch="${td.discountType?.name()}"
                                class="inline-flex items-center">
                                <span th:case="'PERCENT'"
                                    class="px-2 py-1 bg-green-100 text-green-700 text-xs font-medium rounded">
                                    정률할인
                                </span>
                                <span th:case="'ABSOLUTE'"
                                    class="px-2 py-1 bg-blue-100 text-blue-700 text-xs font-medium rounded">
                                    정액할인
                                </span>
                                <span th:case="*"
                                    class="px-2 py-1 bg-gray-100 text-gray-700 text-xs font-medium rounded">
                                    -
                                </span>
                            </span>
                        </td>

                        <!-- 값 -->
                        <td class="px-6 py-4 text-sm font-semibold text-gray-900"
                            th:text="${td.value}">0</td>

                        <!-- 상태 -->
                        <td class="px-6 py-4 text-sm">
                            <span th:if="${td.active}"
                                class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                                진행중
                            </span>
                            <span th:unless="${td.active}"
                                class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-200 text-gray-700">
                                종료/예정
                            </span>
                        </td>

                        <!-- 작업 -->
                        <td class="px-6 py-4 text-sm font-medium">
                            <a th:href="@{/timeDeal/{id}(id=${td.id})}"
                                class="inline-flex items-center justify-center px-3 py-1.5 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition-colors"
                                title="상세보기">
                                <i class="fas fa-eye mr-1"></i>
                                상세
                            </a>
                        </td>

                    </tr>

                </tbody>
            </table>
        </div>
        
        <!-- 페이지네이션 -->
        <div th:if="${timeDealPage.totalPages > 1}" class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
            <div class="flex-1 flex justify-between sm:hidden">
                <a th:if="${timeDealPage.hasPrevious()}" 
                   th:href="@{/timeDeal(page=${timeDealPage.number - 1}, discountType=${filter?.discountType?.name()}, active=${filter?.active}, startDateFrom=${filter?.startDateFrom}, startDateTo=${filter?.startDateTo}, endDateFrom=${filter?.endDateFrom}, endDateTo=${filter?.endDateTo}, minValue=${filter?.minValue}, maxValue=${filter?.maxValue}, sortField=${sortField}, sortDir=${sortDir})}"
                   class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                    이전
                </a>
                <a th:if="${timeDealPage.hasNext()}" 
                   th:href="@{/timeDeal(page=${timeDealPage.number + 1}, discountType=${filter?.discountType?.name()}, active=${filter?.active}, startDateFrom=${filter?.startDateFrom}, startDateTo=${filter?.startDateTo}, endDateFrom=${filter?.endDateFrom}, endDateTo=${filter?.endDateTo}, minValue=${filter?.minValue}, maxValue=${filter?.maxValue}, sortField=${sortField}, sortDir=${sortDir})}"
                   class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                    다음
                </a>
            </div>
            <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                <div>
                    <p class="text-sm text-gray-700">
                        <span th:text="${timeDealPage.number + 1}">1</span> / <span th:text="${timeDealPage.totalPages}">1</span> 페이지
                        (<span th:text="${timeDealPage.totalElements}">0</span>개 항목)
                    </p>
                </div>
                <div>
                    <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px">
                        <a th:if="${timeDealPage.hasPrevious()}" 
                           th:href="@{/timeDeal(page=${timeDealPage.number - 1}, discountType=${filter?.discountType?.name()}, active=${filter?.active}, startDateFrom=${filter?.startDateFrom}, startDateTo=${filter?.startDateTo}, endDateFrom=${filter?.endDateFrom}, endDateTo=${filter?.endDateTo}, minValue=${filter?.minValue}, maxValue=${filter?.maxValue}, sortField=${sortField}, sortDir=${sortDir})}"
                           class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                            <span class="sr-only">이전</span>
                            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
                            </svg>
                        </a>
                        <a th:each="pageNum : ${#numbers.sequence(0, timeDealPage.totalPages - 1)}"
                           th:href="@{/timeDeal(page=${pageNum}, discountType=${filter?.discountType?.name()}, active=${filter?.active}, startDateFrom=${filter?.startDateFrom}, startDateTo=${filter?.startDateTo}, endDateFrom=${filter?.endDateFrom}, endDateTo=${filter?.endDateTo}, minValue=${filter?.minValue}, maxValue=${filter?.maxValue}, sortField=${sortField}, sortDir=${sortDir})}"
                           th:class="${pageNum == timeDealPage.number} ? 'relative inline-flex items-center px-4 py-2 border border-gray-300 bg-blue-50 text-sm font-medium text-blue-600' : 'relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50'"
                           th:text="${pageNum + 1}">1</a>
                        <a th:if="${timeDealPage.hasNext()}" 
                           th:href="@{/timeDeal(page=${timeDealPage.number + 1}, discountType=${filter?.discountType?.name()}, active=${filter?.active}, startDateFrom=${filter?.startDateFrom}, startDateTo=${filter?.startDateTo}, endDateFrom=${filter?.endDateFrom}, endDateTo=${filter?.endDateTo}, minValue=${filter?.minValue}, maxValue=${filter?.maxValue}, sortField=${sortField}, sortDir=${sortDir})}"
                           class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                            <span class="sr-only">다음</span>
                            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
                            </svg>
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <script>
        function resetFilter() {
            window.location.href = '/timeDeal';
        }
        
        function resetPage() {
            document.getElementById('pageInput').value = '0';
        }
    </script>

</div>
