<div th:fragment="content" class="flex flex-col h-full">

    <!-- 헤더 -->
    <div class="flex justify-between items-center mb-6 pb-4 border-b-2 border-gray-200">
        <h1 class="text-3xl font-bold text-gray-800"
            th:text="${timeDeal.id == null} ? '타임딜 등록' : '타임딜 상세 / 수정'"></h1>
    </div>

    <!-- 저장 폼 (TimeDeal + ProductIds 전송 폼) -->
    <form id="timeDealForm" th:action="@{/timeDeal}" th:object="${timeDeal}" method="post"
        class="bg-white rounded-lg shadow-sm p-6 border border-gray-200 w-full max-w-3xl mb-10">

        <input type="hidden" th:field="*{id}" />

        <!-- 기간 -->
        <div class="mb-4">
            <label class="block font-medium text-gray-700 mb-2">시작 시간</label>
            <input type="datetime-local" th:field="*{startTime}" id="startTime"
                onchange="validateTimeDealDates()" required
                class="p-3 border rounded w-full" />
            <p id="startTimeError" class="text-red-600 text-sm mt-1" style="display: none;"></p>
        </div>

        <div class="mb-4">
            <label class="block font-medium text-gray-700 mb-2">종료 시간</label>
            <input type="datetime-local" th:field="*{endTime}" id="endTime"
                onchange="validateTimeDealDates()" required
                class="p-3 border rounded w-full" />
            <p id="endTimeError" class="text-red-600 text-sm mt-1" style="display: none;"></p>
        </div>

        <!-- 할인 유형 -->
        <div class="mb-4">
            <label class="block font-medium text-gray-700 mb-2">할인 유형</label>
            <select th:field="*{discountType}" class="p-3 border rounded w-full">
                <option value="PERCENT">정률할인(%)</option>
                <option value="ABSOLUTE">정액할인(원)</option>
            </select>
        </div>

        <!-- 할인 값 -->
        <div class="mb-4">
            <label class="block font-medium text-gray-700 mb-2">할인 값</label>
            <input type="number" th:field="*{value}" class="p-3 border rounded w-full" />
        </div>

        <!-- 🔥 적용 상품 ID hidden input 컨테이너 -->
        <div id="productIdsContainer">
            <div th:each="product : ${products}">
                <input type="hidden" name="productIds" th:value="${product.id}" />
            </div>
        </div>
    </form>

    <!-- 적용 상품 목록 영역 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">

        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-gray-800">적용 상품 목록</h2>

            <div class="flex gap-3 items-center flex-wrap">
                <button type="button"
                    onclick="openProductSearchPopup()"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    <i class="fas fa-search mr-1"></i>상품 검색하여 추가
                </button>
                <span class="text-gray-400 text-sm">또는</span>
                <div class="flex gap-2 items-center">
                    <input id="addProductIdInput"
                        type="number"
                        placeholder="상품 ID 직접 입력"
                        class="border rounded px-3 py-2 w-36 text-sm" />
                    <button type="button"
                        onclick="addProductId()"
                        class="px-3 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 text-sm">
                        ID 추가
                    </button>
                </div>
            </div>
        </div>

        <!-- 빈 목록 -->
        <div th:if="${#lists.isEmpty(products)}" class="text-gray-500 text-sm">
            이 타임딜이 적용된 상품이 없습니다.
        </div>

        <!-- 목록 표시 -->
        <div class="overflow-auto">

            <table class="min-w-full divide-y divide-gray-200">

                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-xs font-medium text-gray-500">상품 ID</th>
                        <th class="px-6 py-3 text-xs font-medium text-gray-500">상품명</th>
                        <th class="px-6 py-3 text-xs font-medium text-gray-500">가격</th>
                        <!-- <th class="px-6 py-3 text-xs font-medium text-gray-500">상태</th> -->
                        <th class="px-6 py-3 text-xs font-medium text-gray-500">삭제</th>
                    </tr>
                </thead>

                <!-- ⭐ tbody는 반드시 항상 있어야 한다 -->
                <tbody id="productTableBody" class="bg-white divide-y divide-gray-200">

                    <!-- 기존 상품들 표시 -->
                    <tr th:each="p : ${products}" th:attr="data-id=${p.id}" class="hover:bg-gray-50">

                        <td class="px-6 py-4 text-sm font-semibold text-gray-900"
                            th:text="${p.id}"></td>

                        <td class="px-6 py-4 text-sm text-gray-700"
                            th:text="${p.title}"></td>

                        <td class="px-6 py-4 text-sm text-gray-900 font-semibold"
                            th:text="${#numbers.formatInteger(p.price, 3, 'COMMA') + '원'}"></td>

                        <!-- <td class="px-6 py-4 text-sm">
                            <span th:if="${p.productStatus}"
                                class="px-2 py-1 text-xs rounded bg-green-100 text-green-800">활성</span>
                            <span th:unless="${p.productStatus}"
                                class="px-2 py-1 text-xs rounded bg-red-100 text-red-800">비활성</span>
                        </td> -->

                        <td class="px-6 py-4 text-sm">
                            <button type="button"
                                th:onclick="|removeProductId(${p.id})|"
                                class="text-red-600 hover:underline">
                                삭제
                            </button>
                        </td>
                    </tr>

                    <!-- ⭐ products가 비어 있을 때 '없습니다' 문구 -->
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="4" class="px-6 py-4 text-center text-sm text-gray-500">
                            이 타임딜이 적용된 상품이 없습니다.
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
    </div>

    <div class="flex justify-between items-center mt-6">

        <!-- 목록 -->
        <a href="/timeDeal"
            class="px-6 py-3 bg-gray-500 text-white rounded-lg hover:bg-gray-600">
            목록으로
        </a>

        <div class="flex gap-3">

            <!-- 삭제 폼 (독립적) -->
            <form th:action="@{/timeDeal/{id}/delete(id=${timeDeal.id})}"
                method="post"
                onsubmit="return confirm('정말 삭제하시겠습니까?');">

                <button type="submit"
                    class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700">
                    삭제
                </button>
            </form>

            <!-- 저장 버튼 : 저장 폼을 정확히 지정 -->
            <button type="submit"
                form="timeDealForm"
                class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                저장
            </button>
        </div>
    </div>

    <script>
        // 타임딜 시작 시간/종료 시간 유효성 검사
        function validateTimeDealDates() {
            const startTimeInput = document.getElementById('startTime');
            const endTimeInput = document.getElementById('endTime');
            const startTimeError = document.getElementById('startTimeError');
            const endTimeError = document.getElementById('endTimeError');

            // 에러 메시지 초기화
            if (startTimeError) {
                startTimeError.style.display = 'none';
                startTimeError.textContent = '';
            }
            if (endTimeError) {
                endTimeError.style.display = 'none';
                endTimeError.textContent = '';
            }
            if (startTimeInput) {
                startTimeInput.classList.remove('border-red-500');
            }
            if (endTimeInput) {
                endTimeInput.classList.remove('border-red-500');
            }

            const startTime = startTimeInput ? startTimeInput.value : null;
            const endTime = endTimeInput ? endTimeInput.value : null;

            if (startTime && endTime) {
                const start = new Date(startTime);
                const end = new Date(endTime);

                if (end <= start) {
                    if (endTimeError) {
                        endTimeError.textContent = '종료 시간은 시작 시간보다 이후여야 합니다.';
                        endTimeError.style.display = 'block';
                    }
                    if (endTimeInput) {
                        endTimeInput.classList.add('border-red-500');
                        endTimeInput.focus();
                    }
                    return false;
                }
            }

            return true;
        }

        // 폼 제출 시 최종 검증
        document.getElementById('timeDealForm').addEventListener('submit', function(e) {
            if (!validateTimeDealDates()) {
                e.preventDefault();
                alert('종료 시간은 시작 시간보다 이후여야 합니다. 시간을 확인해주세요.');
                return false;
            }
        });

        function addProductId() {
            const id = document.getElementById("addProductIdInput").value.trim();
            if (!id) return alert("상품 ID를 입력하세요.");

            if (document.querySelector(`input[name="productIds"][value="${id}"]`)) {
                return alert("이미 추가된 상품입니다.");
            }

            // hidden input 생성
            const container = document.getElementById("productIdsContainer");
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = "productIds";
            input.value = id;
            container.appendChild(input);

            // 테이블 row 동적 추가
            const tableBody = document.getElementById("productTableBody");

            // 제품명/가격/상태는 서버에서만 알 수 있으므로 임시 표기
            const newRow = document.createElement("tr");
            newRow.setAttribute("data-id", id);
            newRow.className = "hover:bg-gray-50";

            newRow.innerHTML = `
            <td class="px-6 py-4 text-sm font-semibold text-gray-900">${id}</td>
            <td class="px-6 py-4 text-sm text-gray-700 text-gray-400 italic">
                저장 후 정보가 로드됩니다
            </td>
            <td class="px-6 py-4 text-sm text-gray-400">-</td>
            <td class="px-6 py-4 text-sm">
                <button type="button"
                        onclick="removeProductId(${id})"
                        class="text-red-600 hover:underline">
                    삭제
                </button>
            </td>
        `;

            tableBody.appendChild(newRow);

            // 입력창 초기화
            document.getElementById("addProductIdInput").value = "";

            // 시각적 피드백
            alert("상품이 추가되었습니다.");
        }

        function openProductSearchPopup() {
            window.open(
                '/timeDeal/product-search',
                'productSearchPopup',
                'width=900,height=700,scrollbars=yes'
            );
        }

        function addProductFromPopup(id, title, price) {
            if (document.querySelector(`input[name="productIds"][value="${id}"]`)) {
                alert("이미 추가된 상품입니다.");
                return;
            }

            const container = document.getElementById("productIdsContainer");
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = "productIds";
            input.value = id;
            container.appendChild(input);

            const tableBody = document.getElementById("productTableBody");
            const emptyRow = tableBody.querySelector("tr td[colspan='4']");
            if (emptyRow) emptyRow.closest("tr").remove();

            const priceStr = price && Number(price) > 0 ? Number(price).toLocaleString() + "원" : "-";
            const newRow = document.createElement("tr");
            newRow.setAttribute("data-id", id);
            newRow.className = "hover:bg-gray-50";
            newRow.innerHTML = `
                <td class="px-6 py-4 text-sm font-semibold text-gray-900">${id}</td>
                <td class="px-6 py-4 text-sm text-gray-700 truncate max-w-xs" title="${(title || '').replace(/"/g, '&quot;')}">${escapeHtml(title || '-')}</td>
                <td class="px-6 py-4 text-sm text-gray-900 font-semibold">${priceStr}</td>
                <td class="px-6 py-4 text-sm">
                    <button type="button" onclick="removeProductId(${id})" class="text-red-600 hover:underline">삭제</button>
                </td>
            `;
            tableBody.appendChild(newRow);
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function removeProductId(id) {
            const input = document.querySelector(`input[name="productIds"][value="${id}"]`);
            if (input) input.remove();

            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (row) row.remove();

            alert("상품이 제거되었습니다.");
        }
    </script>

</div>
