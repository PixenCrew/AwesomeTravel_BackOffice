<div th:fragment="content" th:inline="text">
    <h1>투어</h1>

    <!-- 1) 필터 폼 -->
    <form id="filterForm" th:object="${filter}">
        <!-- Tour 이름 -->
        <label>Tour 이름:</label>
        <input type="text" th:field="*{name}" placeholder="Enter tour name" />
        <br />

        <!-- 회사 체크박스 -->
        <label>회사 선택:</label><br />
        <div style="height: 100px; padding: 5px; border: 1px solid black; overflow-y:scroll">
            <div th:each="comp : ${allCompanies}">
                <input type="checkbox" th:field="*{companies}" th:value="${comp}" th:id="${'cmp_' + comp}" />
                <label th:for="${'cmp_' + comp}" th:text="${comp}"></label>
            </div>
        </div>
        <br />

        <!-- 시작일 범위 -->
        <label>시작일 (From):</label>
        <input type="date" th:field="*{startDateFrom}" />
        <label>시작일 (To):</label>
        <input type="date" th:field="*{startDateTo}" />
        <br />

        <!-- 종료일 범위 -->
        <label>종료일 (From):</label>
        <input type="date" th:field="*{endDateFrom}" />
        <label>종료일 (To):</label>
        <input type="date" th:field="*{endDateTo}" />
        <br />

        <!-- 가격 범위 -->
        <label>최소 가격:</label>
        <input type="number" step="1" th:field="*{minPrice}" />
        <label>최대 가격:</label>
        <input type="number" step="1" th:field="*{maxPrice}" />
        <br />

        <!-- Point.Schedule.location 포함 검색 -->
        <label>Point 위치:</label>
        <input type="text" th:field="*{pointLocation}" placeholder="Enter location text" onclick="stripAfterPipe(this)"
            list="cityList" />
        <br />

        <!-- 국가 -->
        <label> 국가:</label>
        <input type="text" th:field="*{country}" placeholder="Enter country" onclick="stripAfterPipe(this)"
            list="countryList" /><br>

        <!-- 인원 범위 -->
        <label>최소 인원:</label>
        <input type="number" step="1" th:field="*{startCount}" />
        <label>최대 인원:</label>
        <input type="number" step="1" th:field="*{endCount}" />
        <br />

        <!-- 검색 버튼 -->
        <button type="button" onclick="get(0, event)">검색</button>

        <!-- 정렬 기준 및 방향 (hidden input) -->
        <input type="hidden" name="sortField" th:value="${sortField}" />
        <input type="hidden" name="sortDir" th:value="${sortDir}" />

    </form>

    <!-- 조건 초기화 버튼 -->
    <button type="button" onclick="reset(event)">검색 초기화</button>

    <!-- 2) 결과 테이블 -->
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>

                <!-- 시작일 -->
                <th>
                    <a href="#" data-sortfield="startDate"
                        th:data-sortdir="${sortField=='startDate' and sortDir=='asc' ? 'asc' : 'desc'}"
                        onclick="toggleSort(this, event)">
                        시작일
                        <span th:if="${sortField=='startDate'}" th:text="${sortDir=='asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>

                <!-- 종료일 -->
                <th>
                    <a href="#" data-sortfield="endDate"
                        th:data-sortdir="${sortField=='endDate' and sortDir=='asc' ? 'asc' : 'desc'}"
                        onclick="toggleSort(this, event)">
                        종료일
                        <span th:if="${sortField=='endDate'}" th:text="${sortDir=='asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>

                <th>이름</th>
                <th>회사</th>

                <!-- 가격 -->
                <th>
                    <a href="#" data-sortfield="price"
                        th:data-sortdir="${sortField=='price' and sortDir=='asc' ? 'asc' : 'desc'}"
                        onclick="toggleSort(this, event)">
                        가격
                        <span th:if="${sortField=='price'}" th:text="${sortDir=='asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>

                <!-- <th>코스 포인트</th> -->
                <th>국가</th>
                <th>인원</th>
                <th>호텔 가격 합</th>
                <th>패키지 상품 ID</th>
            </tr>

        </thead>
        <tbody>
            <th:block th:each="tour : ${tourPage.content}">
                <!-- <tr th:onclick="|window.location.href='@{/air/{id}(id=${seatClass.air.id})}'|" style="cursor:pointer;"> -->
                <tr th:data-id="${tour.id}" th:data-price-adult="${tour.priceAdult}"
                    th:data-hotel-price="${tour.hotelPriceSum}" th:data-country="${tour.country.countryCode}"
                    th:data-start="${tour.startDate}" th:data-end="${tour.endDate}"
                    th:onclick="${isSelectionPage} ? 'returnData(this)' : |window.location.href='@{/tour/{id}(id=${tour.id})}'|"
                    style="cursor:pointer;">
                    <td th:text="${tour.id}">1</td>
                    <td th:text="${tour.startDate}">2000-01-01</td>
                    <td th:text="${tour.endDate}">2000-12-31</td>
                    <td th:text="${tour.name}">투어</td>
                    <td th:text="${tour.company}">Awesome</td>
                    <td th:text="${tour.priceAdult}">100000</td>
                    <td th:text="${tour.country.countryCode}">KR</td>
                    <td th:text="${tour.maxCapacity}">1212</td>
                    <td th:text="${tour.hotelPriceSum}">1212</td>
                    <td th:text="${tour.product != null} ? ${tour.product.id} : ' -'"></td>
                </tr>

        </tbody>
    </table>

    <!-- 3) 페이징 네비게이션 (정렬·필터 파라미터 유지) -->
    <div>
        <ul style="list-style: none; display: flex; gap:0.5rem;">
            <li th:if="${tourPage.hasPrevious()}">
                <a th:onclick="|get(${tourPage.number - 1})|" style="cursor: pointer;">
                    Prev
                </a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, tourPage.totalPages - 1)}">
                <a th:onclick="|get(${i})|" th:classappend="${i == tourPage.number} ? ' active' : ''" th:text="${i + 1}"
                    style="cursor: pointer;">
                </a>
            </li>
            <li th:if="${tourPage.hasNext()}">
                <a th:onclick="|get(${tourPage.number + 1})|" style="cursor: pointer;">>
                    Next
                </a>
            </li>
        </ul>
    </div>

    <a href="/tour/new">새 투어</a>

    <script src="/js/filter.js"></script>
    <script src="/js/util.js"></script>

    <datalist id="cityList">
        <option th:each="cc : ${cityCode}"
            th:value="${cc.cityCode} + ' | ' + ${cc.cityEng} + ' | ' + ${cc.countryCode.countryCode}+ ' | ' + ${cc.countryCode.countryKor}">
        </option>
    </datalist>

    <datalist id="countryList">
        <option th:each="cc : ${countryCode}"
            th:value="${cc.countryCode} + ' | ' + ${cc.countryKor} + ' | ' + ${cc.subKor}"></option>
    </datalist>

</div>
