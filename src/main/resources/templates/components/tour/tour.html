<div th:fragment="content" class="flex flex-col h-full">

    <!-- 헤더 -->
    <div class="sm:flex sm:items-center flex-shrink-0 mb-6">
        <div class="sm:flex-auto">
            <h1 class="text-base font-semibold leading-6 text-gray-900">투어 관리</h1>
            <p class="mt-2 text-sm text-gray-700">투어를 검색하고 관리할 수 있습니다.</p>
        </div>
        <div class="mt-4 sm:ml-16 sm:mt-0 sm:flex-none">
            <a href="/tour/new"
                class="inline-flex items-center px-6 py-3 text-white font-semibold rounded-lg transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg"
                style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <i class="fas fa-plus mr-2"></i>새 투어 등록
            </a>
        </div>
    </div>

    <!-- 필터 섹션 -->
    <div class="bg-slate-50 border border-slate-200 rounded-xl p-6 mb-6 flex-shrink-0">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-semibold text-gray-700">검색 필터 <span id="filterCountBadge"
                    class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded-md text-xs font-semibold ml-2 hidden">0</span>
            </h3>
            <button type="button" id="toggleFilterBtn"
                class="bg-blue-600 text-white border-0 px-4 py-2 rounded-md cursor-pointer text-sm transition-colors duration-200 hover:bg-blue-700"
                onclick="toggleFilter()"><i class="fas fa-filter mr-1"></i>필터</button>
        </div>

        <form id="filterForm" th:object="${filter}" class="hidden">
            <div class="grid grid-cols-1 gap-4 mb-4"
                style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
                <!-- 투어 이름 -->
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">투어 이름</label>
                    <input type="text" th:field="*{name}" placeholder="투어 이름을 입력하세요"
                        class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>

                <!-- 회사 선택 -->
                <div class="flex flex-col" style="grid-column: 1 / -1;">
                    <label class="font-medium text-gray-700 mb-2 text-sm">회사 선택</label>
                    <div class="p-3 border border-gray-300 rounded-lg text-sm"
                        style="max-height: 8rem; overflow-y: auto;">
                        <div th:each="comp : ${allCompanies}" class="flex items-center gap-2 mb-2">
                            <input type="checkbox" th:field="*{companies}" th:value="${comp}"
                                th:id="${'cmp_' + comp}" />
                            <label th:for="${'cmp_' + comp}" th:text="${comp}"></label>
                        </div>
                    </div>
                </div>

                <!-- 날짜 범위 -->
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">시작일 (최소)</label>
                    <input type="date" th:field="*{startDateFrom}"
                        class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>

                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">시작일 (최대)</label>
                    <input type="date" th:field="*{startDateTo}"
                        class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>

                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">종료일 (최소)</label>
                    <input type="date" th:field="*{endDateFrom}"
                        class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>

                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">종료일 (최대)</label>
                    <input type="date" th:field="*{endDateTo}"
                        class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>

                <!-- 가격 범위 -->
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">최소 가격</label>
                    <input type="number" step="1" th:field="*{minPrice}" placeholder="최소 가격"
                        class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>

                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">최대 가격</label>
                    <input type="number" step="1" th:field="*{maxPrice}" placeholder="최대 가격"
                        class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>

                <!-- 위치 및 국가 -->
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">위치</label>
                    <input type="text" th:field="*{pointLocation}" placeholder="위치를 입력하세요"
                        onclick="stripAfterPipe(this)" list="cityList"
                        class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>

                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">국가</label>
                    <input type="text" th:field="*{country}" placeholder="국가를 입력하세요" onclick="stripAfterPipe(this)"
                        list="countryList"
                        class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>

                <!-- 인원 범위 -->
                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">최소 인원</label>
                    <input type="number" step="1" th:field="*{startCount}" placeholder="최소 인원"
                        class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>

                <div class="flex flex-col">
                    <label class="font-medium text-gray-700 mb-2 text-sm">최대 인원</label>
                    <input type="number" step="1" th:field="*{endCount}" placeholder="최대 인원"
                        class="p-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 focus:outline-none focus:border-blue-500 focus:ring-3 focus:ring-blue-100" />
                </div>
            </div>

            <div class="flex gap-4 justify-end">
                <button type="button" id="resetFilterBtn" onclick="resetFilterForm(event)"
                    class="bg-gray-500 text-white border-0 px-6 py-3 rounded-lg cursor-pointer font-semibold transition-colors duration-200 hover:bg-gray-600"><i
                        class="fas fa-undo mr-1"></i>초기화</button>
                <button type="button" id="searchFilterBtn" onclick="performSearch(0, event)"
                    class="bg-emerald-600 text-white border-0 px-6 py-3 rounded-lg cursor-pointer font-semibold transition-colors duration-200 hover:bg-emerald-700"><i
                        class="fas fa-search mr-1"></i>검색</button>
            </div>

            <!-- 정렬 기준 및 방향 (hidden input) -->
            <input type="hidden" name="sortField" th:value="${sortField}" />
            <input type="hidden" name="sortDir" th:value="${sortDir}" />
        </form>
    </div>

    <!-- 결과 테이블 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col">
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex-shrink-0">
            <h3 class="text-lg font-semibold text-gray-800">투어 목록 <span
                    class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 ml-2"
                    th:text="'총 ' + ${tourPage.totalElements} + '개'"></span></h3>
        </div>

        <div class="flex-1 overflow-auto table-responsive" style="max-height: calc(100vh - 500px); min-height: 200px;">
            <table class="min-w-full divide-y divide-gray-200" style="table-layout: fixed; width: 100%;">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            style="width: 5%;">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            style="width: 8%;">
                            <a href="#" data-sortfield="startDate"
                                th:data-sortdir="${sortField=='startDate' and sortDir=='asc' ? 'asc' : 'desc'}"
                                onclick="toggleSort(this, event)" class="group inline-flex">
                                시작일
                                <span th:if="${sortField=='startDate'}" th:text="${sortDir=='asc' ? '▲' : '▼'}"
                                    class="ml-2 flex-none rounded text-gray-400 group-hover:text-gray-500"></span>
                            </a>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            style="width: 8%;">
                            <a href="#" data-sortfield="endDate"
                                th:data-sortdir="${sortField=='endDate' and sortDir=='asc' ? 'asc' : 'desc'}"
                                onclick="toggleSort(this, event)" class="group inline-flex">
                                종료일
                                <span th:if="${sortField=='endDate'}" th:text="${sortDir=='asc' ? '▲' : '▼'}"
                                    class="ml-2 flex-none rounded text-gray-400 group-hover:text-gray-500"></span>
                            </a>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            style="width: 22%;">투어명</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            style="width: 8%;">회사</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            style="width: 10%;">
                            <a href="#" data-sortfield="price"
                                th:data-sortdir="${sortField=='price' and sortDir=='asc' ? 'asc' : 'desc'}"
                                onclick="toggleSort(this, event)" class="group inline-flex">
                                가격
                                <span th:if="${sortField=='price'}" th:text="${sortDir=='asc' ? '▲' : '▼'}"
                                    class="ml-2 flex-none rounded text-gray-400 group-hover:text-gray-500"></span>
                            </a>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            style="width: 8%;">국가</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            style="width: 10%;">인원</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            style="width: 12%;">호텔료</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <th:block th:each="tour : ${tourPage.content}">
                        <tr th:class="${isSelectionPage != null and isSelectionPage} ? 
                            'hover:bg-gray-50 cursor-pointer tour-selection-row' : 
                            'hover:bg-gray-50 cursor-pointer'"
                            th:attr="data-id=${tour.id},
                 data-price-adult=${tour.priceAdult},
                 data-hotel-price=${tour.hotelPriceSum},
                 data-country=${tour.country != null ? tour.country.countryCode : ''},
                 data-start=${#temporals.format(tour.startDate, 'yyyy-MM-dd')},
                 data-end=${#temporals.format(tour.endDate, 'yyyy-MM-dd')},
                 data-selection-mode=${isSelectionPage != null and isSelectionPage},
                 data-tour-id=${tour.id}">

                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"
                                th:text="${tour.id}">1</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
                                th:text="${#temporals.format(tour.startDate, 'yyyy-MM-dd')}">2000-01-01</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
                                th:text="${#temporals.format(tour.endDate, 'yyyy-MM-dd')}">2000-12-31</td>
                            <td class="px-6 py-4 text-sm text-gray-900">
                                <div class="font-semibold text-gray-900 truncate"
                                    th:text="${tour.name}"
                                    th:title="${tour.name}">투어명</div>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-900">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800 truncate"
                                    th:text="${tour.company}"
                                    th:title="${tour.company}">회사명</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                <span class="font-semibold text-green-600"
                                    th:text="${#numbers.formatInteger(tour.priceAdult, 3, 'COMMA')} + '원'">100,000원</span>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-900">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 truncate block"
                                    th:text="${tour.country.countryCode}"
                                    th:title="${tour.country.countryCode}">KR</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-cyan-100 text-cyan-800"
                                    th:text="${tour.count} + '명'">10명</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                <span th:text="${#numbers.formatInteger(tour.hotelPriceSum, 3, 'COMMA')} + '원'">30,000원</span>
                            </td>
                        </tr>
                    </th:block>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 페이징 -->
    <div class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6 flex-shrink-0">
        <div class="flex-1 flex justify-between sm:hidden">
            <a th:if="${tourPage.hasPrevious()}" href="#" th:onclick="|performSearch(${tourPage.number - 1}, event)|"
                class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                이전
            </a>
            <a th:if="${tourPage.hasNext()}" href="#" th:onclick="|performSearch(${tourPage.number + 1}, event)|"
                class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                다음
            </a>
        </div>
        <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
            <div>
                <p class="text-sm text-gray-700">
                    총 <span class="font-medium" th:text="${tourPage.totalElements}">0</span>개 중
                    <span class="font-medium" th:text="${tourPage.number * tourPage.size + 1}">1</span>-<span
                        class="font-medium"
                        th:text="${(tourPage.number + 1) * tourPage.size > tourPage.totalElements ? tourPage.totalElements : (tourPage.number + 1) * tourPage.size}">10</span>개
                    표시
                </p>
            </div>
            <div>
                <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                    <!-- 이전 페이지 버튼 -->
                    <a th:if="${tourPage.hasPrevious()}"
                        th:href="${isSelectionPage != null and isSelectionPage} ? 
                            @{/tour/search(page=${tourPage.number - 1}, sortField=${sortField}, sortDir=${sortDir})} : 
                            @{/tour(page=${tourPage.number - 1}, sortField=${sortField}, sortDir=${sortDir})}"
                        class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                        <i class="fas fa-chevron-left"></i>
                    </a>

                    <!-- 페이지 번호들 (최대 10개만 표시) -->
                    <th:block
                        th:with="startPage=${tourPage.number > 5 ? tourPage.number - 5 : 0}, endPage=${tourPage.number + 5 < tourPage.totalPages ? tourPage.number + 5 : tourPage.totalPages - 1}">
                        <a th:each="i : ${#numbers.sequence(startPage, endPage)}"
                            th:href="${isSelectionPage != null and isSelectionPage} ? 
                                @{/tour/search(page=${i}, sortField=${sortField}, sortDir=${sortDir})} : 
                                @{/tour(page=${i}, sortField=${sortField}, sortDir=${sortDir})}"
                            th:class="${i == tourPage.number} ? 'z-10 bg-blue-50 border-blue-500 text-blue-600 relative inline-flex items-center px-4 py-2 border text-sm font-medium' : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50 relative inline-flex items-center px-4 py-2 border text-sm font-medium'"
                            th:text="${i + 1}">1</a>
                    </th:block>

                    <!-- 다음 페이지 버튼 -->
                    <a th:if="${tourPage.hasNext()}"
                        th:href="${isSelectionPage != null and isSelectionPage} ? 
                            @{/tour/search(page=${tourPage.number + 1}, sortField=${sortField}, sortDir=${sortDir})} : 
                            @{/tour(page=${tourPage.number + 1}, sortField=${sortField}, sortDir=${sortDir})}"
                        class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </nav>
            </div>
        </div>
    </div>



    <div th:replace="components/datalist/countryList :: countryDatalistFragment"></div>
    <div th:replace="components/datalist/cityList :: cityDatalistFragment"></div>

    <script>
        // toggleFilter는 filter.js에서 전역으로 제공됨

        function toggleSort(element, event) {
            if (event) event.preventDefault();
            const sortField = element.getAttribute('data-sortfield');
            const currentSortField = document.querySelector('input[name="sortField"]').value;
            const currentSortDir = document.querySelector('input[name="sortDir"]').value;

            let newSortDir = 'asc';
            if (sortField === currentSortField && currentSortDir === 'asc') {
                newSortDir = 'desc';
            }

            // 현재 URL이 /tour/search인지 확인
            const isSearchPage = window.location.pathname === '/tour/search';
            
            // URL 파라미터로 정렬 정보 전달
            const url = new URL(window.location);
            url.searchParams.set('sortField', sortField);
            url.searchParams.set('sortDir', newSortDir);
            
            // 선택 페이지가 아니면 /tour로, 선택 페이지면 /tour/search로
            if (!isSearchPage && window.location.pathname !== '/tour/search') {
                url.pathname = '/tour';
            }
            
            window.location.href = url.toString();
        }

        // get, resetFilterForm은 filter.js에서 전역으로 제공됨

        function countActiveFilters(form) {
            if (!form) return 0;
            const seenNames = new Set();
            let count = 0;
            const elements = Array.from(form.elements);
            const skip = new Set(['page', 'size', 'sort', 'sortField', 'sortDir', '_csrf']);
            elements.forEach(el => {
                if (!el.name || skip.has(el.name)) return;
                if (el.type === 'hidden') return;
                if (el.type === 'radio') {
                    if (seenNames.has(el.name)) return;
                    seenNames.add(el.name);
                    const checked = form.querySelector(`input[name="${el.name}"]:checked`);
                    if (checked && checked.value !== '' && checked.value != null) count++;
                    return;
                }
                if (el.type === 'checkbox') {
                    if (seenNames.has(el.name)) return;
                    seenNames.add(el.name);
                    const anyChecked = form.querySelectorAll(`input[name="${el.name}"]:checked`).length > 0;
                    if (anyChecked) count++;
                    return;
                }
                const val = (el.value || '').toString().trim();
                if (val !== '') count++;
            });
            return count;
        }

        function updateFilterCount() {
            const form = document.getElementById('filterForm');
            const badge = document.getElementById('filterCountBadge');
            if (!form || !badge) return;
            const n = countActiveFilters(form);
            if (n > 0) { badge.textContent = n; badge.classList.remove('hidden'); } else { badge.classList.add('hidden'); }
        }

        (function () {
            const form = document.getElementById('filterForm');
            if (form) {
                form.addEventListener('input', updateFilterCount, true);
                form.addEventListener('change', updateFilterCount, true);
                updateFilterCount();
            }
        })();

        // 투어 삭제 확인
        function deleteTour(id) {
            if (confirm('정말로 이 투어를 삭제하시겠습니까?\n연결된 패키지 상품이 있다면 먼저 삭제해주세요.')) {
                fetch('/tour/' + id, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                    .then(response => {
                        if (response.ok) {
                            return response.text();
                        } else {
                            throw new Error('삭제 실패');
                        }
                    })
                    .then(message => {
                        alert(message || '삭제가 완료되었습니다.');
                        location.reload();
                    })
                    .catch(error => {
                        alert('삭제 중 오류가 발생했습니다: ' + error.message);
                    });
            }
        }

        // 페이지 로드 시 필터 상태 확인 및 투어 선택 이벤트 등록
        document.addEventListener('DOMContentLoaded', function () {
            // URL에 필터 파라미터가 있으면 필터 폼을 열어둠
            const urlParams = new URLSearchParams(window.location.search);
            const hasFilterParams = Array.from(urlParams.keys()).some(key =>
                ['name', 'companies', 'startDateFrom', 'startDateTo', 'endDateFrom', 'endDateTo',
                    'minPrice', 'maxPrice', 'pointLocation', 'country', 'startCount', 'endCount'].includes(key)
            );

            if (hasFilterParams) {
                document.getElementById('filterForm').style.display = 'block';
            }
            
            // 투어 선택 모드일 때 클릭 이벤트 등록
            const allRows = document.querySelectorAll('tr[data-selection-mode]');
            console.log('총 행 개수:', allRows.length);
            allRows.forEach(row => {
                const isSelectionMode = row.getAttribute('data-selection-mode') === 'true';
                console.log('행의 선택 모드:', isSelectionMode, row.getAttribute('data-selection-mode'));
                
                row.addEventListener('click', function(e) {
                    if (!isSelectionMode) {
                        // 일반 모드: 투어 상세 페이지로 이동
                        const tourId = this.dataset.tourId;
                        if (tourId) {
                            window.location.href = '/tour/' + tourId;
                        }
                        return;
                    }
                    
                    // 선택 모드: returnData 호출
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('투어 선택 행 클릭됨:', this);
                    console.log('데이터 속성:', {
                        id: this.dataset.id,
                        priceAdult: this.dataset.priceAdult,
                        hotelPrice: this.dataset.hotelPrice,
                        country: this.dataset.country,
                        start: this.dataset.start,
                        end: this.dataset.end
                    });
                    if (typeof returnData === 'function') {
                        returnData(this);
                    } else {
                        console.error('returnData 함수를 찾을 수 없습니다. util.js가 로드되었는지 확인하세요.');
                        alert('오류: returnData 함수를 찾을 수 없습니다.');
                    }
                });
            });
        });
