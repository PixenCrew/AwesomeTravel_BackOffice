<div th:fragment="content">

    <h1 th:text="${tour.id} == null ? '투어 등록' : '투어 상세' "></h1>
    <!-- 
    <form th:action="${tour.id == null} ? '/tour/new' : '/tour/' + ${tour.id}" method="post">
        <input type="text" name="id" id="id" th:value="${tour.id}" readonly><br>
        <input type="text" name="name" id="name" th:value="${tour.name}" placeholder="이름" required><br>
        <input type="text" name="company" id="company" th:value="${tour.company}" placeholder="회사" required><br>
        <input type="date" name="date" id="date" th:value="${tour.date}" placeholder="2000-00-00" required
            min="2000-04-01" max="2026-12-31"><br>
        <input type="submit" th:value="${tour.id == null} ? '등록' : '수정'">
    </form>-->
    <form th:object="${tour}" th:action="${tour.id} == null ?
               @{/tour/new} :
               @{/tour/{id}(id=${tour.id})}" method="post">

        <!-- 수정 시에만 ID 표시 -->
        <div th:if="${tour.id} != null">
            <label>ID:</label>
            <input type="text" th:field="*{id}" readonly /><br>
        </div>

        <!-- 기본 Tour 필드들 -->
        <label for="name">이름:</label>
        <input type="text" th:field="*{name}" required /><br>

        <label for="company">회사:</label>
        <input type="text" th:field="*{company}" required /><br>

        <label for="startDate">시작일:</label>
        <input type="date" th:field="*{startDate}" min="2000-04-01" required /><br>

        <label for="endDate">종료일:</label>
        <input type="date" th:field="*{endDate}" min="2000-04-01" required /><br>

        <label for="price">가격:</label>
        <input type="number" th:field="*{price}" min="1" required /><br>

        <label for="country">국가:</label>
        <input type="text" th:field="*{country}" onchange="stripAfterPipe(this)" list="countryList" required /><br>

        <label for="count">인원:</label>
        <input type="number" th:field="*{count}" min="1" required /><br>

        <label for="airPriceSum">항공권 가격 합:</label>
        <input type="number" th:field="*{airPriceSum}" min="0" disabled /><br>

        <label for="hotelPriceSum">호텔 가격 합:</label>
        <input type="number" th:field="*{hotelPriceSum}" min="0" disabled /><br>

        <label for="productId">패키지 상품 ID:</label>
        <input type="number" th:field="*{productId}" disabled /><br>

        <fieldset id="fieldset">
            <legend>코스 스케줄 및 포인트/항공 정보</legend>

            <!-- 전체 Tour에 새 Schedule 추가 버튼 -->
            <button type="button" onclick="addSchedule()">스케줄 추가</button>

            <!-- 1) Tour → Schedule 반복 -->
            <div id="scheduleContainer">
                <div class="schedule-point" th:if="${tour.id != null}" th:each="sched, schedStat : *{schedules}" th:attr="data-sched-idx=${schedStat.index}">
                    <label>날짜:</label>
                    <input type="date" th:field="*{schedules[__${schedStat.index}__].date}" /><br>
                    <button type="button" onclick="removeSchedule(this)">스케줄 삭제</button>

                    <!-- 2) 하나의 LocationContainer에 여러 Location -->
                    <div class="location-container" th:attr="id=|locationContainer-${schedStat.index}|">
                        <!-- Schedule → Location 반복 -->
                        <div class="location-point" th:each="loc, locStat : *{schedules[__${schedStat.index}__].locations}">
                            <!-- 위치 타입 -->
                            <div>
                                타입
                                <input type="text" th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].locationType}" readonly />
                            </div>

                            <div>
                                설명
                                <input type="text" th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].description}" placeholder="설명 입력" />
                            </div>

                            <div th:if="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].locationType == T(renewal.awesome_travel_backoffice.tour.entity.Location.Type).AIR}">
                                항공편 번호
                                <input type="text" th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].departAirport}" placeholder="출발지 선택" list="cityList" onchange="stripAfterPipe(this)" />
                                <input type="text" th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].arriveAirport}" placeholder="도착지 선택" list="cityList" onchange="stripAfterPipe(this)" />
                                <input type="text" th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].seatClass}" placeholder="항공편 ID 입력" onclick="searchAir(this)" />
                            </div>

                            <div th:if="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].locationType != T(renewal.awesome_travel_backoffice.tour.entity.Location.Type).AIR}">
                                도시
                                <input type="text" th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].city}" placeholder="예: KR | South Korea | 대한민국" list="cityList" />
                            </div>

                            <div th:if="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].locationType == T(renewal.awesome_travel_backoffice.tour.entity.Location.Type).HOTEL}">
                                호텔 번호
                                <input type="text" th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].hotel}" placeholder="호텔 ID 입력" onclick="searchHotel(this)" />
                            </div>

                            <!-- 삭제 -->
                            <button type="button" onclick="removeLocation(this)">삭제</button>
                        </div>
                    </div>

                    <!-- 추가/삭제 버튼 -->
                    <button type="button" onclick="addLocation(this,'POINT')">POINT 추가</button>
                    <button type="button" onclick="addLocation(this, 'AIR')">AIR 추가</button>
                    <button type="button" onclick="addLocation(this, 'HOTEL')">HOTEL 추가</button>
                </div>
            </div>
        </fieldset>


        <button type="submit" th:text="${tour.id} == null ? '등록' : '수정'">
        </button>
    </form>

    <button th:if="${tour.id != null}" th:onclick="deleteTour([[${tour.id}]])">삭제</button>

    <script src="/js/util.js"></script>
    <script>
        // let airSearchTarget;
        // let hotelSearchTarget;
        let searchTarget;
        // 전역 스케줄 인덱스 (초기값: 이미 렌더링된 .schedule-point 개수)
        let scheduleIndex = document.querySelectorAll(
            "#scheduleContainer .schedule-point"
        ).length;

        // 1) 스케줄 추가
        function addSchedule() {
            const idx = scheduleIndex;
            const container = document.getElementById("scheduleContainer");

            // 스케줄 래퍼 생성
            const schedDiv = document.createElement("div");
            schedDiv.className = "schedule-point";
            schedDiv.dataset.schedIdx = idx;

            // 날짜 입력
            schedDiv.appendChild(createLabel("날짜:"));
            const dateInput = createInput("date", `schedules[${idx}].date`);
            schedDiv.appendChild(dateInput);
            schedDiv.appendChild(document.createElement("br"));

            // 스케줄 삭제 버튼
            const removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.textContent = "스케줄 삭제";
            removeBtn.addEventListener("click", () => removeSchedule(removeBtn));
            schedDiv.appendChild(removeBtn);

            // 로케이션 컨테이너
            const locContainer = document.createElement("div");
            locContainer.id = `locationContainer-${idx}`;
            locContainer.className = "location-container";
            schedDiv.appendChild(locContainer);

            // POINT/AIR/HOTEL 추가 버튼
            const pBtn = document.createElement("button");
            pBtn.type = "button";
            pBtn.textContent = "POINT 추가";
            pBtn.addEventListener("click", () => addLocation(pBtn, 'POINT'));
            schedDiv.appendChild(pBtn);

            const aBtn = document.createElement("button");
            aBtn.type = "button";
            aBtn.textContent = "AIR 추가";
            aBtn.addEventListener("click", () => addLocation(aBtn, 'AIR'));
            schedDiv.appendChild(aBtn);

            const hBtn = document.createElement("button");
            hBtn.type = "button";
            hBtn.textContent = "HOTEL 추가";
            hBtn.addEventListener("click", () => addLocation(hBtn, 'HOTEL'));
            schedDiv.appendChild(hBtn);

            container.appendChild(schedDiv);
            scheduleIndex++;
        }

        // 2) 스케줄 삭제 (인덱스 감소)
        function removeSchedule(btn) {
            btn.closest(".schedule-point").remove();
            scheduleIndex--;
        }

        // 3) Location 추가 type = 'POINT', 'AIR', 'HOTEL'
        function addLocation(btn, type) {
            const schedDiv = btn.closest('.schedule-point');
            const schedIdx = parseInt(schedDiv.dataset.schedIdx, 10);
            const container = schedDiv.querySelector(`#locationContainer-${schedIdx}`);
            const locIdx = container.querySelectorAll('.location-point').length;

            const wrapper = document.createElement('div');
            wrapper.className = 'location-point';

            // // 타입
            // wrapper.appendChild(createLabel('타입 '));
            // const typeSelect = document.createElement('select');
            // const options = ['AIR','POINT','HOTEL'];
            // for (const opt of options) {
            //     const option = document.createElement('option');
            //     option.value = opt;
            //     option.textContent = opt;
            //     typeSelect.appendChild(option);
            // }
            // typeSelect.value = type;
            // wrapper.appendChild(typeSelect);

            // 타입
            const typeDiv = document.createElement('div');
            typeDiv.appendChild(createLabel('타입 '));
            const typeinput = createInput('text', `schedules[${schedIdx}].locations[${locIdx}].locationType`, '', { readonly: true });
            typeinput.value = type;
            typeDiv.appendChild(typeinput);
            wrapper.appendChild(typeDiv);

            // 설명
            const descDiv = document.createElement('div');
            descDiv.appendChild(createLabel('설명 '));
            descDiv.appendChild(createInput(
                'text',
                `schedules[${schedIdx}].locations[${locIdx}].description`,
                '설명 입력'
            ));
            wrapper.appendChild(descDiv);

            // 타입별 추가 필드
            const addDiv = document.createElement('div');
            if (type === 'AIR') {
                addDiv.appendChild(createLabel('출발지 '));
                addDiv.appendChild(createInput(
                    'text',
                    `schedules[${schedIdx}].locations[${locIdx}].departAirport`,
                    '출발지 선택',
                    { list: 'cityList', onchange: 'stripAfterPipe(this)' }
                ));

                addDiv.appendChild(createLabel('도착지 '));
                addDiv.appendChild(createInput(
                    'text',
                    `schedules[${schedIdx}].locations[${locIdx}].arriveAirport`,
                    '도착지 선택',
                    { list: 'cityList', onchange: 'stripAfterPipe(this)' }
                ));

                addDiv.appendChild(createLabel('항공편 번호 '));
                addDiv.appendChild(createInput(
                    'text',
                    `schedules[${schedIdx}].locations[${locIdx}].seatClass`,
                    '항공편 ID 입력',
                    { onclick: 'searchAir(this)', readonly: true }
                ));
            } else {
                addDiv.appendChild(createLabel('도시 '));
                addDiv.appendChild(createInput(
                    'text',
                    `schedules[${schedIdx}].locations[${locIdx}].city`,
                    '예: KR | South Korea | 대한민국',
                    { list: 'cityList', onchange: 'stripAfterPipe(this)' }
                ));

                if (type === 'HOTEL') {
                    addDiv.appendChild(createLabel('호텔 번호 '));
                    addDiv.appendChild(createInput(
                        'text',
                        `schedules[${schedIdx}].locations[${locIdx}].hotel`,
                        '호텔 ID 입력',
                        { onclick: 'searchHotel(this)' }
                    ));
                }
            }
            wrapper.appendChild(addDiv);

            // 삭제 버튼
            const btnDel = document.createElement('button');
            btnDel.type = 'button';
            btnDel.textContent = '삭제';
            btnDel.addEventListener('click', () => removeLocation(btnDel));
            wrapper.appendChild(btnDel);

            container.appendChild(wrapper);
        }

        // 4) Location 삭제
        function removeLocation(btn) {
            const wrapper = btn.closest(".location-point");
            const schedDiv = btn.closest(".schedule-point");
            const schedIdx = parseInt(schedDiv.dataset.schedIdx, 10);

            // 1) 제거
            wrapper.remove();

            // 2) 남은 location-point 들을 0,1,2… 로 재인덱싱
            reindexLocations(schedIdx);
        }

        // 삭제시 재인덱싱 함수
        function reindexLocations(schedIdx) {
            const container = document.querySelector(
                `#scheduleContainer .schedule-point[data-sched-idx="${schedIdx}"]`
            ).querySelector(`#locationContainer-${schedIdx}`);

            container.querySelectorAll(".location-point").forEach((locDiv, newIdx) => {
                // 각 필드(name 속성)에 반영될 prefix
                const prefix = `schedules[${schedIdx}].locations[${newIdx}]`;

                // type(hidden)
                locDiv.querySelectorAll('input[type="hidden"]').forEach(h => {
                    h.name = `${prefix}.locationType`;
                });

                // 텍스트/날짜/셀렉트/기타 input들
                Array.from(locDiv.querySelectorAll("input, select")).forEach(input => {
                    // 원래 name 에서 앞부분만 바꾸고, 뒤속성(.city, .date, .air.id 등)는 유지
                    const parts = input.name.split(".");
                    const suffix = parts.slice(1).join(".");
                    input.name = `${prefix}.${suffix}`;
                });
            });
        }
        // 유틸 함수들
        function createLabel(text) {
            const label = document.createElement('label');
            label.textContent = text;
            return label;
        }

        function createInput(type, name, placeholder = '', attrs = {}) {
            const input = document.createElement('input');
            input.type = type;
            input.name = name;
            if (placeholder) input.placeholder = placeholder;
            Object.entries(attrs).forEach(([key, value]) => input.setAttribute(key, value));
            return input;
        }

        function createHidden(name, value) {
            const hidden = document.createElement('input');
            hidden.type = 'hidden';
            hidden.name = name;
            hidden.value = value;
            return hidden;
        }

        function searchAir(input) {
            // 날짜, 출발지, 도착지, 인원 입력 후 항공 목록 Popup
            const locationDiv = input.closest(".location-point");
            // const containerDiv = input.closest(".location-container");

            // 1. 형제 요소 from, to
            const fromInput = locationDiv.querySelector("input[name$='.departAirport']");
            const toInput = locationDiv.querySelector("input[name$='.arriveAirport']");

            // 2. 상위 스케줄 블록의 date
            const schedulePoint = input.closest('.schedule-point');
            const dateInput = schedulePoint.querySelector('input[type="date"]');
            // const dateInput = containerDiv.closest("div").querySelector("input[name$='.date']");

            // 3. 최상위 블록의 인원수 count
            const countInput = document.querySelector('#count');

            // 4. 값 읽기
            const fromValue = fromInput?.value || null;
            const toValue = toInput?.value || null;
            const dateValue = dateInput?.value || null;
            const countValue = countInput?.value || null;

            console.log("출발지 (from):", fromValue);
            console.log("도착지 (to):", toValue);
            console.log("날짜 (date):", dateValue);
            console.log("인원수 (count):", countValue);

            if (fromValue != null && toValue != null && dateValue != null && countValue != null) {
                console.log("searchAir called for:", input.value);
                searchTarget = input;
                const popup = window.open(
                    '/air/search?departAirport=' + fromValue + '&arriveAirport=' + toValue + '&departDateFrom=' + dateValue + '&departDateTo=' + dateValue + '&availableSeats=' + countValue, // URL + 파라미터
                    'airSearchPopup',
                    'width=1200,height=800'
                );
            } else {
                alert("인원수, 날짜, 출발지, 도착지를 모두 입력하세요")
            }
        }
        
        function searchHotel(input) {
            console.log('Search Hotel for : '+input.value)
            // 날짜, 도시, 인원 입력 후 호텔 목록 Popup
            const locationDiv = input.closest(".location-point");

            // 1. 형제 요소 city
            const cityInput = locationDiv.querySelector("input[name$='.city']");

            // 2. 상위 스케줄 블록의 date
            const schedulePoint = input.closest('.schedule-point');
            const dateInput = schedulePoint.querySelector('input[type="date"]');

            // 3. 최상위 블록의 인원수 count
            const countInput = document.querySelector('#count');

            // 4. 값 읽기
            const cityValue = cityInput?.value || null;
            const dateValue = dateInput?.value || null;
            const countValue = countInput?.value || null;

            console.log("도시 (city):", cityValue);
            console.log("날짜 (date):", dateValue);
            console.log("인원수 (count):", countValue);

            if (cityValue != null && dateValue != null && countValue != null) {
                console.log("searchHotel called for:", input.value);
                searchTarget = input;
                const popup = window.open(
                    '/hotel/search?city=' + cityValue + '&targetDate=' + dateValue + '&requiredPersons=' + countValue, // URL + 파라미터
                    'hotelSearchPopup',
                    'width=1200,height=800'
                );
            } else {
                alert("인원수, 날짜, 도시를 모두 입력하세요")
            }
        }

        // 팝업에서 선택한 값을 입력하는 메서드
        // function setAir(airId) {
        //     airSearchTarget.value = airId;
        //     console.log("airSearchTarget updated:", airSearchTarget.value);
        // }

        // function setHotel(hotelId) {
        //     hotelSearchTarget.value = hotelId;
        //     console.log("hotelSearchTarget updated:", hotelSearchTarget.value);
        // }

        function setId(id) {
            searchTarget.value = id;
            console.log("searchTarget updated:", searchTarget.value);
        }

        function deleteTour(id) {
            if (confirm('정말로 삭제하시겠습니까?')) {
                fetch('/tour/' + id, { method: 'DELETE' })
                    .then(res => {
                        if (res.ok) {
                            alert('삭제 성공');
                            window.location.href = '/tour';
                        } else {
                            alert('삭제 실패');
                        }
                    });
            }
        }
    </script>

    <datalist id="countryList">
        <!-- countryRepo.findAll()으로 받아온 리스트를 순회하면서 옵션 생성 -->
        <option th:each="cc : ${countryCode}" th:value="${cc.code} + ' | ' + ${cc.eng} + ' | ' + ${cc.kor}"></option>
    </datalist>

    <datalist id="cityList">
        <option th:each="cc : ${cityCode}" th:value="${cc.code} + ' | ' + ${cc.country} + ' | ' + ${cc.eng} + ' | ' + ${cc.kor}"></option>
    </datalist>

    <datalist id="types">
        <option th:each="type : ${types}" th:value="${type}"></option>
    </datalist>

    <style>
        .schedule-point {
            border: 1px solid blue;
            margin: 5px;
            padding: 5px;
        }

        .location-container {
            border: 1px solid red;
            margin: 5px;
            padding: 5px;
        }
    </style>
</div>
