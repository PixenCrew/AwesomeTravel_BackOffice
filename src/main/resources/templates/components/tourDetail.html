<div th:fragment="content">

    <h1 th:text="${tour.id} == null ? '투어 등록' : '투어 상세' "></h1>

    <form th:action="${tour.id == null} ? '/tour/new' : '/tour/' + ${tour.id}" method="post">
        <input type="text" name="id" id="id" th:value="${tour.id}" readonly><br>
        <input type="text" name="name" id="name" th:value="${tour.name}" placeholder="이름" required><br>
        <input type="text" name="company" id="company" th:value="${tour.company}" placeholder="회사" required><br>
        <input type="date" name="date" id="date" th:value="${tour.date}" placeholder="2000-00-00" required
            min="2000-04-01" max="2026-12-31"><br>
        <input type="submit" th:value="${tour.id == null} ? '등록' : '수정'">
    </form>

    <button th:if="${tour.id != null}" th:onclick="deleteTour([[${tour.id}]])">삭제</button>

    <script>
        function deleteTour(id) {
            if (confirm('정말로 삭제하시겠습니까?')) {
                fetch('/tour/' + id, { method: 'DELETE', redirect: 'follow' })
                    .then(response => {
                        if (response.ok) {
                            alert('삭제가 완료되었습니다.');
                            window.location.href = '/tour';
                        } else {
                            alert('삭제 중 오류가 발생했습니다.\n'+response);
                        }
                    })
                    .catch(error => {
                        alert('삭제 요청에 오류가 발생했습니다: ' + error.message);
                        console.error('삭제 요청 실패:', error);
                    });
            }
        }
    </script>

</div>
