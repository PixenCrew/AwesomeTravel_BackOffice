<div th:fragment="content">

    <h1 th:text="${tour.id} == null ? '투어 등록' : '투어 상세' "></h1>
    <!-- 
    <form th:action="${tour.id == null} ? '/tour/new' : '/tour/' + ${tour.id}" method="post">
        <input type="text" name="id" id="id" th:value="${tour.id}" readonly><br>
        <input type="text" name="name" id="name" th:value="${tour.name}" placeholder="이름" required><br>
        <input type="text" name="company" id="company" th:value="${tour.company}" placeholder="회사" required><br>
        <input type="date" name="date" id="date" th:value="${tour.date}" placeholder="2000-00-00" required
            min="2000-04-01" max="2026-12-31"><br>
        <input type="submit" th:value="${tour.id == null} ? '등록' : '수정'">
    </form>-->
    <form th:object="${tour}" th:action="${tour.id} == null ?
               @{/tour/new} :
               @{/tour/{id}(id=${tour.id})}" method="post">

        <!-- 수정 시에만 ID 표시 -->
        <div th:if="${tour.id} != null">
            <label>ID:</label>
            <input type="text" th:field="*{id}" readonly /><br>
        </div>

        <!-- 기본 Tour 필드들 -->
        <label for="name">이름:</label>
        <input type="text" th:field="*{name}" required /><br>

        <label for="company">회사:</label>
        <input type="text" th:field="*{company}" required /><br>

        <label for="startDate">시작일:</label>
        <input type="date" th:field="*{startDate}" min="2000-04-01" required /><br>

        <label for="endDate">종료일:</label>
        <input type="date" th:field="*{endDate}" min="2000-04-01" required /><br>

        <label for="price">가격[성인]:</label>
        <input type="number" th:field="*{priceAdult}" min="1" required /><br>

        <label for="price">가격[청소년]:</label>
        <input type="number" th:field="*{priceYouth}" min="1" required /><br>

        <label for="price">가격[영유아]:</label>
        <input type="number" th:field="*{priceInfant}" min="1" required /><br>

        <label for="country">국가:</label>
        <input type="text" th:field="*{country}" onchange="stripAfterPipe(this)" list="countryList" required /><br>

        <label for="count">최대 인원:</label>
        <input type="number" th:field="*{maxCapacity}" min="1" required /><br>

        <label for="count">최소 인원:</label>
        <input type="number" th:field="*{minCapacity}" min="1" required /><br>

        <label for="hotelPriceSum">호텔 가격 합:</label>
        <input type="number" th:field="*{hotelPriceSum}" min="0" disabled /><br>

        <label for="product.id">패키지 상품 ID:</label>
        <input type="number" th:field="*{product.id}" disabled /><br>
        
        <div style="border: 1px solid black; padding: 5px ;">
            <label>키워드:</label>
            <div id="keywords-container">
                <div th:each="kw : *{keywords}">
                    <input type="text" th:value="${kw}" name="keywords" placeholder="키워드" readonly/>
                </div>
            </div>
        </div>

        <fieldset id="fieldset">
            <legend>코스 스케줄 및 포인트/항공 정보</legend>

            <!-- 전체 Tour에 새 Schedule 추가 버튼 -->
            <button type="button" onclick="addSchedule()">스케줄 추가</button>

            <!-- 1) Tour → Schedule 반복 -->
            <div id="scheduleContainer">
                <div class="schedule-point" th:if="${tour.id != null}" th:each="sched, schedStat : *{schedules}"
                    th:attr="data-sched-idx=${schedStat.index}">
                    <label>일차:</label>
                    <input type="number" th:field="*{schedules[__${schedStat.index}__].day}" /><br>
                    <button type="button" onclick="removeSchedule(this)">스케줄 삭제</button>

                    <!-- 2) 하나의 LocationContainer에 여러 Location -->
                    <div class="location-container" th:attr="id=|locationContainer-${schedStat.index}|">
                        <!-- Schedule → Location 반복 -->
                        <div class="location-point"
                            th:each="loc, locStat : *{schedules[__${schedStat.index}__].locations}">
                            <!-- 위치 타입 -->
                            <div>
                                타입
                                <input type="text"
                                    th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].locationType}"
                                    readonly />
                            </div>

                            <div>
                                이름
                                <input type="text"
                                    th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].name}"
                                    placeholder="이름 입력" />
                            </div>
                            <div>
                                설명
                                <input type="text"
                                    th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].description}"
                                    placeholder="설명 입력" />
                            </div>

                            <div
                                th:if="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].locationType == T(renewal.common.entity.Location.LocationType).AIR}">
                                항공편
                                <input type="text"
                                    th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].departAirport}"
                                    placeholder="출발지 선택" list="cityList" onchange="stripAfterPipe(this)" />
                                <input type="text"
                                    th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].arriveAirport}"
                                    placeholder="도착지 선택" list="cityList" onchange="stripAfterPipe(this)" />
                            </div>

                            <div
                                th:if="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].locationType != T(renewal.common.entity.Location.LocationType).AIR}">
                                도시
                                <input type="text"
                                    th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].city}"
                                    placeholder="예: KR | South Korea | 대한민국" list="cityList" />
                            </div>

                            <div
                                th:if="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].locationType == T(renewal.common.entity.Location.LocationType).HOTEL}">
                                호텔 번호
                                <input type="text"
                                    th:field="*{schedules[__${schedStat.index}__].locations[__${locStat.index}__].hotel}"
                                    placeholder="호텔 ID 입력" onclick="searchHotel(this)" />
                            </div>

                            <!-- 삭제 -->
                            <button type="button" onclick="removeLocation(this)">삭제</button>
                        </div>
                    </div>

                    <!-- 추가/삭제 버튼 -->
                    <button type="button" onclick="addLocation(this,'POINT')">POINT 추가</button>
                    <button type="button" onclick="addLocation(this, 'AIR')">AIR 추가</button>
                    <button type="button" onclick="addLocation(this, 'HOTEL')">HOTEL 추가</button>
                </div>
            </div>
        </fieldset>


        <button type="submit" th:text="${tour.id} == null ? '등록' : '수정'">
        </button>
    </form>

    <button th:if="${tour.id != null}" th:onclick="deleteTour([[${tour.id}]])">삭제</button>

    <script src="/js/util.js"></script>
    <script>
        // 유틸 함수들
        function createLabel(text) {
            const label = document.createElement('label');
            label.textContent = text;
            return label;
        }

        function createInput(type, name, placeholder = '', attrs = {}) {
            const input = document.createElement('input');
            input.type = type;
            if (name) input.name = name;
            if (placeholder) input.placeholder = placeholder;

            Object.entries(attrs).forEach(([key, value]) => {
                if (key === 'readonly') {
                    input.readOnly = !!value;
                } else {
                    input.setAttribute(key, value);
                }
            });

            return input;
        }

        function createHidden(name, value) {
            const hidden = document.createElement('input');
            hidden.type = 'hidden';
            hidden.name = name;
            hidden.value = value;
            return hidden;
        }

        // schedule 추가
        function addSchedule() {
            const idx = document.querySelectorAll("#scheduleContainer .schedule-point").length;
            const container = document.getElementById("scheduleContainer");

            const schedDiv = document.createElement("div");
            schedDiv.className = "schedule-point";
            schedDiv.dataset.schedIdx = idx;

            // 일차 입력 (name 패턴 유지)
            schedDiv.appendChild(createLabel("일차:"));
            const dayInput = createInput("number", `schedules[${idx}].day`);
            dayInput.value = idx;
            schedDiv.appendChild(dayInput);
            schedDiv.appendChild(document.createElement("br"));

            // 스케줄 삭제 버튼
            const removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.textContent = "스케줄 삭제";
            removeBtn.addEventListener("click", () => removeSchedule(removeBtn));
            schedDiv.appendChild(removeBtn);

            // location container (id는 data-sched-idx에 연동)
            const locContainer = document.createElement("div");
            locContainer.id = `locationContainer-${idx}`;
            locContainer.className = "location-container";
            schedDiv.appendChild(locContainer);

            // 추가 버튼들
            const pBtn = document.createElement("button");
            pBtn.type = "button";
            pBtn.textContent = "POINT 추가";
            pBtn.addEventListener("click", () => addLocation(pBtn, 'POINT'));
            schedDiv.appendChild(pBtn);

            const aBtn = document.createElement("button");
            aBtn.type = "button";
            aBtn.textContent = "AIR 추가";
            aBtn.addEventListener("click", () => addLocation(aBtn, 'AIR'));
            schedDiv.appendChild(aBtn);

            const hBtn = document.createElement("button");
            hBtn.type = "button";
            hBtn.textContent = "HOTEL 추가";
            hBtn.addEventListener("click", () => addLocation(hBtn, 'HOTEL'));
            schedDiv.appendChild(hBtn);

            container.appendChild(schedDiv);
        }

        // schedule 삭제
        function removeSchedule(btn) {
            const schedDiv = btn.closest(".schedule-point");
            if (!schedDiv) return;

            // 삭제
            schedDiv.remove();

            // 남은 schedule 재인덱싱
            const schedules = document.querySelectorAll("#scheduleContainer .schedule-point");
            schedules.forEach((schedDiv, newIdx) => {
                // dataset 갱신
                schedDiv.dataset.schedIdx = newIdx;

                // day input 갱신
                const dayInput = schedDiv.querySelector('input[name*=".day"]');
                if (dayInput) {
                    dayInput.value = newIdx;
                    dayInput.name = `schedules[${newIdx}].day`;
                }

                // location container id 갱신
                const locContainer = schedDiv.querySelector('.location-container');
                if (locContainer) {
                    locContainer.id = `locationContainer-${newIdx}`;
                }

                // 모든 location 이름 재설정
                reindexLocations(newIdx);
            });
        }

        // location 추가 (POINT / AIR / HOTEL)
        function addLocation(btn, type) {
            const schedDiv = btn.closest('.schedule-point');
            if (!schedDiv) {
                console.warn('addLocation: parent schedule-point not found');
                return;
            }

            const schedIdx = parseInt(schedDiv.dataset.schedIdx, 10);

            const container = schedDiv.querySelector(`#locationContainer-${schedIdx}`);
            if (!container) {
                console.warn(`addLocation: location container not found for schedule ${schedIdx}`);
                return;
            }

            const locIdx = container.querySelectorAll('.location-point').length;

            const wrapper = document.createElement('div');
            wrapper.className = 'location-point';

            // 타입
            const typeDiv = document.createElement('div');
            typeDiv.appendChild(createLabel('타입 '));
            const typeinput = createInput('text', `schedules[${schedIdx}].locations[${locIdx}].locationType`, '', { readonly: true });
            typeinput.value = type;
            typeDiv.appendChild(typeinput);
            wrapper.appendChild(typeDiv);

            // 설명
            const descDiv = document.createElement('div');
            descDiv.appendChild(createLabel('설명 '));
            descDiv.appendChild(createInput(
                'text',
                `schedules[${schedIdx}].locations[${locIdx}].description`,
                '설명 입력'
            ));
            wrapper.appendChild(descDiv);

            // 타입별 필드
            const addDiv = document.createElement('div');
            if (type === 'AIR') {
                addDiv.appendChild(createLabel('출발지 '));
                addDiv.appendChild(createInput(
                    'text',
                    `schedules[${schedIdx}].locations[${locIdx}].departAirport`,
                    '출발지 선택',
                    { list: 'cityList', onchange: 'stripAfterPipe(this)' }
                ));

                addDiv.appendChild(createLabel('도착지 '));
                addDiv.appendChild(createInput(
                    'text',
                    `schedules[${schedIdx}].locations[${locIdx}].arriveAirport`,
                    '도착지 선택',
                    { list: 'cityList', onchange: 'stripAfterPipe(this)' }
                ));

                // addDiv.appendChild(createLabel('항공편 번호 '));
                // addDiv.appendChild(createInput(
                //     'text',
                //     `schedules[${schedIdx}].locations[${locIdx}].seatClass`,
                //     '항공편 ID 입력',
                //     { onclick: 'searchAir(this)', readonly: true }
                // ));
            } else {
                addDiv.appendChild(createLabel('도시 '));
                addDiv.appendChild(createInput(
                    'text',
                    `schedules[${schedIdx}].locations[${locIdx}].city`,
                    '예: KR | South Korea | 대한민국',
                    { list: 'cityList', onchange: 'stripAfterPipe(this)' }
                ));

                if (type === 'HOTEL') {
                    addDiv.appendChild(createLabel('호텔 번호 '));
                    addDiv.appendChild(createInput(
                        'text',
                        `schedules[${schedIdx}].locations[${locIdx}].hotel`,
                        '호텔 ID 입력',
                        { onclick: 'searchHotel(this)' }
                    ));
                }
            }
            wrapper.appendChild(addDiv);

            // 삭제 버튼 (location)
            const btnDel = document.createElement('button');
            btnDel.type = 'button';
            btnDel.textContent = '삭제';
            btnDel.addEventListener('click', () => removeLocation(btnDel));
            wrapper.appendChild(btnDel);

            container.appendChild(wrapper);
        }

        // location 삭제
        function removeLocation(btn) {
            const wrapper = btn.closest(".location-point");
            const schedDiv = btn.closest(".schedule-point");
            if (!wrapper || !schedDiv) return;

            const schedIdx = parseInt(schedDiv.dataset.schedIdx, 10);

            // 제거
            wrapper.remove();

            // 동일 스케줄 내 location들 재인덱싱
            reindexLocations(schedIdx);
        }

        // 재인덱싱 함수
        function reindexLocations(schedIdx) {
            const schedSelector = `#scheduleContainer .schedule-point[data-sched-idx="${schedIdx}"]`;
            const schedDiv = document.querySelector(schedSelector);
            if (!schedDiv) {
                console.warn(`reindexLocations: schedule-point not found for idx=${schedIdx}`);
                return;
            }

            const container = schedDiv.querySelector('.location-container');
            if (!container) {
                // location-container가 없으면
                return;
            }

            container.querySelectorAll(".location-point").forEach((locDiv, newIdx) => {
                const prefix = `schedules[${schedIdx}].locations[${newIdx}]`;

                // input 이름 갱신
                locDiv.querySelectorAll('input[type="hidden"]').forEach(h => {
                    h.name = `${prefix}.locationType`;
                });

                // 모든 input/select 이름 재설정
                Array.from(locDiv.querySelectorAll("input, select")).forEach(input => {
                    if (!input.name) return;

                    const parts = input.name.split(".");
                    if (parts.length < 2) {
                        return;
                    }
                    const suffix = parts.slice(1).join(".");
                    input.name = `${prefix}.${suffix}`;
                });
            });
        }

        // 호텔 검색 — startDate, endDate, dayOffset, maxCapacity을 쿼리 파라미터로 전송
        let searchTarget = null;
        function searchHotel(input) {

            const locationDiv = input?.closest(".location-point");
            const cityInput = locationDiv?.querySelector("input[name$='.city'], input[name='city'], input[id$='city']");
            const cityValue = cityInput?.value?.trim() || null;

            // // 클릭한 schedule의 data-sched-idx를 dayOffset으로 사용
            // const schedulePoint = input?.closest('.schedule-point');
            // const dayOffset = schedulePoint ? schedulePoint.dataset.schedIdx : null;

            // // 최상위 startDate / endDate
            // const startInput = document.querySelector('input[name="startDate"], input[name$=".startDate"], input[id$="startDate"]');
            // const endInput = document.querySelector('input[name="endDate"], input[name$=".endDate"], input[id$="endDate"]');
            // const startDate = addOffsetToDate(startInput?.value || null, dayOffset);
            // const endDate = addOffsetToDate(endInput?.value || null, dayOffset);

            // // maxCapacity
            // const maxInput = document.querySelector('input[name="maxCapacity"], input[name$=".maxCapacity"], input[id$="maxCapacity"]');
            // const maxCapacity = maxInput?.value || null;

            console.log("도시 (city):", cityValue);
            // console.log("startDate:", startDate, "endDate:", endDate, "dayOffset:", dayOffset, "maxCapacity:", maxCapacity);

            // 유효성 검사 (필수 항목들)
            // if (cityValue && startDate && endDate && dayOffset != null && dayOffset !== '' && maxCapacity != null && String(maxCapacity).trim() !== '') {
            if (cityValue) {
                searchTarget = input;

                const url =
                    '/hotel/search' +
                    '?city=' + encodeURIComponent(cityValue);
                // '?city=' + encodeURIComponent(cityValue) +
                // '&startDate=' + encodeURIComponent(startDate) +
                // '&endDate=' + encodeURIComponent(endDate) +
                // '&requiredPersons=' + encodeURIComponent(maxCapacity);

                window.open(url, 'hotelSearchPopup', 'width=1200,height=800');
            } else {
                alert("도시를 선택하세요.");
            }
        }

        function setId(id) {
            if (searchTarget) {
                searchTarget.value = id;
                console.log("searchTarget updated:", searchTarget.value);
            }
        }

        function deleteTour(id) {
            if (confirm('정말로 삭제하시겠습니까?')) {
                fetch('/tour/' + id, { method: 'DELETE' })
                    .then(res => {
                        if (res.ok) {
                            alert('삭제 성공');
                            window.location.href = '/tour';
                        } else {
                            alert('삭제 실패');
                            res.text().then(msg => {
                                alert(msg);
                            })
                        }
                    });
            }
        }

        // }

    </script>
    
    <datalist id="countryList">
        <option th:each="cc : ${countryCode}" th:value="${cc.countryCode} + ' | ' + ${cc.countryKor} + ' | ' + ${cc.subKor}"></option>
    </datalist>

    <datalist id="cityList">
        <option th:each="cc : ${cityCode}"
            th:value="${cc.airportCode} + ' | ' + ${cc.airportEng} + ' | ' + ${cc.countryCode.countryCode}">
        </option>
    </datalist>

    <datalist id="types">
        <option th:each="type : ${types}" th:value="${type}"></option>
    </datalist>

    <style>
        .schedule-point {
            border: 1px solid blue;
            margin: 5px;
            padding: 5px;
        }

        .location-container {
            border: 1px solid red;
            margin: 5px;
            padding: 5px;
        }
    </style>
</div>
