<div th:fragment="content">

    <h1 th:text="${tour.id} == null ? '투어 등록' : '투어 상세' "></h1>
    <!-- 
    <form th:action="${tour.id == null} ? '/tour/new' : '/tour/' + ${tour.id}" method="post">
        <input type="text" name="id" id="id" th:value="${tour.id}" readonly><br>
        <input type="text" name="name" id="name" th:value="${tour.name}" placeholder="이름" required><br>
        <input type="text" name="company" id="company" th:value="${tour.company}" placeholder="회사" required><br>
        <input type="date" name="date" id="date" th:value="${tour.date}" placeholder="2000-00-00" required
            min="2000-04-01" max="2026-12-31"><br>
        <input type="submit" th:value="${tour.id == null} ? '등록' : '수정'">
    </form>-->
    <form th:object="${tour}" th:action="${tour.id} == null ?
               @{/tour/new} :
               @{/tour/{id}(id=${tour.id})}" method="post">

        <!-- 수정 시에만 ID 표시 -->
        <div th:if="${tour.id} != null">
            <label>ID:</label>
            <input type="text" th:field="*{id}" readonly /><br>
        </div>

        <!-- 기본 Tour 필드들 -->
        <label for="name">이름:</label>
        <input type="text" th:field="*{name}" required /><br>

        <label for="company">회사:</label>
        <input type="text" th:field="*{company}" required /><br>

        <label for="startdate">시작일:</label>
        <input type="date" th:field="*{startdate}" min="2000-04-01" max="2026-12-31" required /><br>

        <label for="enddate">종료일:</label>
        <input type="date" th:field="*{enddate}" min="2000-04-01" max="2026-12-31" required /><br>

        <label for="price">가격:</label>
        <input type="number" th:field="*{price}" required /><br>

        <!-- Point 리스트 바인딩 -->
        <fieldset id="fieldset">
            <legend>코스 포인트</legend>
            <div class="course-point" th:each="point, stat : *{course}">
                <label>위치:</label>
                <input type="text" th:field="*{course[__${stat.index}__].location}" placeholder="위치 입력" />

                <label>포인트 종료일:</label>
                <input type="date" th:field="*{course[__${stat.index}__].enddate}" min="2000-04-01" max="2026-12-31" />
                <br>
                <button type="button" onclick="removeCoursePoint(this)">삭제</button>

            </div>
            <button id="addButton" type="button" onclick="addCoursePoint()">포인트 추가</button>
        </fieldset>

        <button type="submit" th:text="${tour.id} == null ? '등록' : '수정'">
        </button>
    </form>

    <button th:if="${tour.id != null}" th:onclick="deleteTour([[${tour.id}]])">삭제</button>

    <script>
        function deleteTour(id) {
            console.log('id : ' + id)
            if (confirm('정말로 삭제하시겠습니까?')) {
                fetch('/tour/' + id, { method: 'DELETE' })
                    .then(response => {
                        if (response.ok) {
                            alert('삭제가 완료되었습니다.');
                            window.location.href = '/tour';
                        } else {
                            alert('삭제 중 오류가 발생했습니다.\n' + response);
                        }
                    })
                    .catch(error => {
                        alert('삭제 요청에 오류가 발생했습니다: ' + error.message);
                        console.error('삭제 요청 실패:', error);
                    });
            }
        }

        function addCoursePoint() {

            // course 리스트를 렌더링한 첫 블록을 클론해서 빈 값으로 추가
            const container = document.getElementById("fieldset");
            const prototype = container.querySelector('.course-point'); // 기존의 코스 블록
            const clone = prototype.cloneNode(true);

            // 입력 필드 초기화
            clone.querySelectorAll('input').forEach(i => i.value = '');

            container.insertBefore(clone, document.getElementById('addButton'));

            // 인덱스 재설정
            reindexCoursePoints();
        }

        function removeCoursePoint(button) {
            const points = document.querySelectorAll('.course-point');
            if (points.length <= 1) {
                alert('코스 포인트는 최소 1개 이상이어야 합니다.');
                return;
            }
            // 삭제 버튼의 부모 요소인 코스 포인트 항목을 찾아 제거
            const coursePointDiv = button.closest('.course-point');
            if (coursePointDiv) {
                coursePointDiv.remove();
            }

            // 인덱스 재설정
            reindexCoursePoints();
        }

        function reindexCoursePoints() {
            const points = document.querySelectorAll('.course-point');
            points.forEach((div, idx) => {
                div.querySelectorAll('input').forEach(input => {
                    // 원래 name/id 뒤에 붙은 필드명(예: location, enddate) 추출
                    const field = (input.name || input.id).split(/[\[\]\.]/).pop();

                    // name="course[<idx>].<field>"
                    input.name = `course[${idx}].${field}`;
                    // id="course<idx>.<field>"
                    input.id = `course${idx}.${field}`;
                });
            });
        }
    </script>

</div>
