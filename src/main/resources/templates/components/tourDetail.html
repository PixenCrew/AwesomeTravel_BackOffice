<div th:fragment="content">

    <h1 th:text="${tour.id} == null ? '투어 등록' : '투어 상세' "></h1>
    <!-- 
    <form th:action="${tour.id == null} ? '/tour/new' : '/tour/' + ${tour.id}" method="post">
        <input type="text" name="id" id="id" th:value="${tour.id}" readonly><br>
        <input type="text" name="name" id="name" th:value="${tour.name}" placeholder="이름" required><br>
        <input type="text" name="company" id="company" th:value="${tour.company}" placeholder="회사" required><br>
        <input type="date" name="date" id="date" th:value="${tour.date}" placeholder="2000-00-00" required
            min="2000-04-01" max="2026-12-31"><br>
        <input type="submit" th:value="${tour.id == null} ? '등록' : '수정'">
    </form>-->
    <form th:object="${tour}" th:action="${tour.id} == null ?
               @{/tour/new} :
               @{/tour/{id}(id=${tour.id})}" method="post">

        <!-- 수정 시에만 ID 표시 -->
        <div th:if="${tour.id} != null">
            <label>ID:</label>
            <input type="text" th:field="*{id}" readonly /><br>
        </div>

        <!-- 기본 Tour 필드들 -->
        <label for="name">이름:</label>
        <input type="text" th:field="*{name}" required /><br>

        <label for="company">회사:</label>
        <input type="text" th:field="*{company}" required /><br>

        <label for="startdate">시작일:</label>
        <input type="date" th:field="*{startdate}" min="2000-04-01" max="2026-12-31" required /><br>

        <label for="enddate">종료일:</label>
        <input type="date" th:field="*{enddate}" min="2000-04-01" max="2026-12-31" required /><br>

        <label for="price">가격:</label>
        <input type="number" th:field="*{price}" required /><br>

        <label for="country">국가:</label>
        <input type="text" th:field="*{country}" /><br>

        <label for="count">인원:</label>
        <input type="number" th:field="*{count}" required /><br>

        <!-- Point 리스트 바인딩 -->
        <fieldset id="fieldset">
            <legend>코스 포인트 및 항공</legend>
            <div id="locationContainer">
                <div class="location-point" th:each="loc, stat : *{locations}">
                    <input type="hidden" th:field="*{locations[__${stat.index}__].type}" />

                    <label>국가:</label>
                    <input type="text" th:field="*{locations[__${stat.index}__].country}" list="countryList"
                        placeholder="국가 입력 (예: KR | South Korea | 대한민국)" onchange="stripAfterPipe(this)"/>

                    <!-- POINT용 필드 -->
                    <label>포인트 종료일:</label>
                    <input type="date" th:field="*{locations[__${stat.index}__].date}" min="2000-04-01"
                        max="2026-12-31" />

                    <button type="button" onclick="removeLocation(this)">삭제</button>
                </div>
            </div>

            <button type="button" onclick="addLocationPoint()">POINT 추가</button>
            <button type="button" onclick="addLocationAir()">AIR 추가</button>
        </fieldset>


        <button type="submit" th:text="${tour.id} == null ? '등록' : '수정'">
        </button>
    </form>

    <button th:if="${tour.id != null}" th:onclick="deleteTour([[${tour.id}]])">삭제</button>

    <script>
        let locationIndex = document.querySelectorAll("#locationContainer .location-point").length;

        function createLabel(text) {
            const lbl = document.createElement("label");
            lbl.textContent = text;
            return lbl;
        }

        function createInput(type, name, placeholder = "", attrs = {}) {
            const inp = document.createElement("input");
            inp.type = type;
            inp.name = name;
            if (placeholder) inp.placeholder = placeholder;
            // 추가 속성들 설정 (예: list, min, max)
            Object.entries(attrs).forEach(([k, v]) => inp.setAttribute(k, v));
            return inp;
        }

        function createHidden(name, value) {
            const hid = document.createElement("input");
            hid.type = "hidden";
            hid.name = name;
            hid.value = value;
            return hid;
        }

        function removeLocation(btn) {
            btn.closest(".location-point").remove();
        }

        function addLocationPoint() {
            const idx = locationIndex++;
            const container = document.getElementById("locationContainer");
            const wrapper = document.createElement("div");
            wrapper.className = "location-point";

            // type 히든
            wrapper.appendChild(createHidden(`locations[${idx}].type`, "POINT"));
            // 국가
            wrapper.appendChild(createLabel("국가:"));
            const country = createInput(
                "text",
                `locations[${idx}].country`,
                "국가 입력 (예: KR | South Korea | 대한민국)",
                { list: "countryList" }
            )
            country.setAttribute("onchange", "stripAfterPipe(this)");
            wrapper.appendChild(country);
            // 날짜
            wrapper.appendChild(createLabel("포인트 종료일:"));
            wrapper.appendChild(createInput(
                "date",
                `locations[${idx}].date`,
                "",
                { min: "2000-04-01", max: "2026-12-31" }
            ));
            // 삭제 버튼
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = "삭제";
            btn.addEventListener("click", () => removeLocation(btn));
            wrapper.appendChild(btn);

            container.appendChild(wrapper);
        }

        function addLocationAir() {
            const idx = locationIndex++;
            const container = document.getElementById("locationContainer");
            const wrapper = document.createElement("div");
            wrapper.className = "location-point";

            // type 히든
            wrapper.appendChild(createHidden(`locations[${idx}].type`, "AIR"));

            // 항공편 번호
            wrapper.appendChild(createLabel("항공편 번호:"));
            const airInput = createInput(
                "number",
                `locations[${idx}].air`,
                "항공편 번호 입력"
            )
            airInput.setAttribute("onclick", "searchAir(this)");
            wrapper.appendChild(airInput);

            // 설명
            wrapper.appendChild(createLabel("설명:"));
            wrapper.appendChild(createInput(
                "text",
                `locations[${idx}].description`,
                "설명 입력"
            ));
            // 날짜
            wrapper.appendChild(createLabel("날짜:"));
            wrapper.appendChild(createInput(
                "date",
                `locations[${idx}].date`
            ));
            // 삭제 버튼
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = "삭제";
            btn.addEventListener("click", () => removeLocation(btn));
            wrapper.appendChild(btn);

            container.appendChild(wrapper);
        }

        // 검색 결과중 코드 | 영문 | 한글 중 "코드"만 남기는 함수
        function stripAfterPipe(input) {
            const val = input.value;
            if (val.includes('|')) {
                input.value = val.split('|')[0].trim();
            }
        }

        function searchAir() {

        }

    </script>


    <datalist id="countryList">
        <!-- countryRepo.findAll()으로 받아온 리스트를 순회하면서 옵션 생성 -->
        <option th:each="cc : ${countryCode}" th:value="${cc.code} + ' | ' + ${cc.eng} + ' | ' + ${cc.kor}"></option>
    </datalist>

</div>
