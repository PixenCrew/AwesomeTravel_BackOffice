<div th:fragment="content" class="bg-white rounded-lg shadow-sm">
        <!-- 페이지 헤더 -->
        <div class="px-6 py-4 border-b border-gray-200">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900">회원 정보 관리</h2>
                    <p class="text-sm text-gray-600 mt-1">총 <span th:text="${totalCount}">0</span>명의 회원</p>
                </div>
                <a href="/member/new" 
                   class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors duration-200">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    일반회원 생성
                </a>
            </div>
        </div>

        <!-- 검색 및 필터 -->
        <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
            <form method="get" action="/member" class="flex gap-4 items-end">
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700 mb-1">검색어</label>
                    <input type="text" 
                           name="keyword" 
                           th:value="${param.keyword}"
                           placeholder="이름, 이메일, 전화번호로 검색"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="w-48">
                    <label class="block text-sm font-medium text-gray-700 mb-1">상태</label>
                    <select name="status" 
                            th:value="${param.status}"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">전체</option>
                        <option value="INACTIVE">비활성</option>
                        <option value="ACTIVE">활성</option>
                        <option value="WITHDRAWN">탈퇴</option>
                        <option value="BANNED">차단</option>
                    </select>
                </div>
                <button type="submit" 
                        class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors duration-200">
                    검색
                </button>
                <a href="/member" 
                   class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors duration-200">
                    초기화
                </a>
            </form>
        </div>

        <!-- 회원 목록 테이블 -->
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">회원 정보</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">연락처</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">가입일</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">상태</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">역할</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">액션</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="user : ${users}" class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div>
                                <div class="text-sm font-medium text-gray-900" th:text="${user.name}">홍길동</div>
                                <div class="text-sm text-gray-500" th:text="${user.email}">user@example.com</div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900" th:text="${user.phone}">010-1234-5678</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">2024-01-01</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span th:switch="${user.status?.name()}" 
                                  class="inline-flex px-2 py-1 text-xs font-semibold rounded-full">
                                <span th:case="'INACTIVE'" class="bg-yellow-100 text-yellow-800">비활성</span>
                                <span th:case="'ACTIVE'" class="bg-green-100 text-green-800">활성</span>
                                <span th:case="'WITHDRAWN'" class="bg-gray-100 text-gray-800">탈퇴</span>
                                <span th:case="'BANNED'" class="bg-red-100 text-red-800">차단</span>
                                <span th:case="*" class="bg-gray-100 text-gray-800" th:text="${user.status?.name()}">상태</span>
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span th:switch="${user.role?.name()}" 
                                  class="inline-flex px-2 py-1 text-xs font-semibold rounded-full">
                                <span th:case="'ADMIN'" class="bg-purple-100 text-purple-800">관리자</span>
                                <span th:case="'USER'" class="bg-blue-100 text-blue-800">일반회원</span>
                                <span th:case="*" class="bg-gray-100 text-gray-800" th:text="${user.role?.name()}">역할</span>
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <div class="flex space-x-2">
                                <a th:href="@{/member/{id}(id=${user.id})}" 
                                   class="inline-flex items-center px-3 py-1.5 bg-blue-50 text-blue-700 rounded-md hover:bg-blue-100 transition-colors duration-200 text-xs font-medium"
                                   title="상세보기">
                                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                    </svg>
                                    상세
                                </a>
                                <a th:href="@{/member/edit/{id}(id=${user.id})}" 
                                   class="inline-flex items-center px-3 py-1.5 bg-indigo-50 text-indigo-700 rounded-md hover:bg-indigo-100 transition-colors duration-200 text-xs font-medium"
                                   title="수정">
                                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                    </svg>
                                    수정
                                </a>
                                <form th:action="@{/member/toggle-status/{id}(id=${user.id})}" 
                                      method="post" 
                                      class="inline toggle-status-form"
                                      th:attr="data-is-active=${user.status?.name() == 'ACTIVE'}">
                                    <button type="submit"
                                            th:if="${user.status?.name() == 'ACTIVE'}"
                                            class="inline-flex items-center px-3 py-1.5 bg-yellow-50 text-yellow-700 rounded-md hover:bg-yellow-100 transition-colors duration-200 text-xs font-medium"
                                            title="비활성화">
                                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path>
                                        </svg>
                                        <span>비활성화</span>
                                    </button>
                                    <button type="submit"
                                            th:unless="${user.status?.name() == 'ACTIVE'}"
                                            class="inline-flex items-center px-3 py-1.5 bg-green-50 text-green-700 rounded-md hover:bg-green-100 transition-colors duration-200 text-xs font-medium"
                                            title="활성화">
                                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                        </svg>
                                        <span>활성화</span>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                            <div class="flex flex-col items-center">
                                <svg class="w-12 h-12 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/>
                                </svg>
                                <p class="text-lg font-medium">등록된 회원이 없습니다</p>
                                <p class="text-sm">새로운 회원을 등록해보세요.</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 페이지네이션 -->
        <div th:if="${totalPages > 1}" class="px-6 py-4 border-t border-gray-200">
            <div class="flex items-center justify-between">
                <div class="text-sm text-gray-700">
                    <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span> 페이지
                </div>
                <div class="flex space-x-2">
                    <a th:if="${currentPage > 0}" 
                       th:href="@{/member(page=${currentPage - 1}, keyword=${param.keyword}, status=${param.status})}"
                       class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                        이전
                    </a>
                    
                    <template th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}">
                        <a th:if="${pageNum >= currentPage - 2 and pageNum <= currentPage + 2}"
                           th:href="@{/member(page=${pageNum}, keyword=${param.keyword}, status=${param.status})}"
                           th:class="${pageNum == currentPage ? 'bg-blue-600 text-white' : 'text-gray-500 bg-white hover:bg-gray-50'}"
                           class="px-3 py-2 text-sm font-medium border border-gray-300 rounded-lg"
                           th:text="${pageNum + 1}">1</a>
                    </template>
                    
                    <a th:if="${currentPage < totalPages - 1}" 
                       th:href="@{/member(page=${currentPage + 1}, keyword=${param.keyword}, status=${param.status})}"
                       class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                        다음
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 활성/비활성 토글 폼 처리
        document.addEventListener('DOMContentLoaded', function() {
            const forms = document.querySelectorAll('.toggle-status-form');
            forms.forEach(function(form) {
                form.addEventListener('submit', function(e) {
                    const isActive = form.getAttribute('data-is-active') === 'true';
                    const message = isActive ? '정말 비활성화하시겠습니까?' : '정말 활성화하시겠습니까?';
                    
                    if (!confirm(message)) {
                        e.preventDefault();
                        return false;
                    }
                });
            });
        });
    </script>
</div>
