<div th:fragment="content">
    <div class="space-y-6">
        <!-- 페이지 헤더 -->
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">회원 등급 관리</h2>
                <p class="text-sm text-gray-600 mt-1">총 <span th:text="${totalCount}">0</span>명의 회원</p>
            </div>
        </div>

        <!-- 메시지 표시 -->
        <div th:if="${message}" class="p-4 bg-green-100 text-green-800 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${message}">성공 메시지</span>
            </div>
        </div>
        
        <div th:if="${error}" class="p-4 bg-red-100 text-red-800 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${error}">오류 메시지</span>
            </div>
        </div>

        <!-- 검색 및 필터 -->
        <div class="bg-white rounded-lg shadow-sm p-6">
            <form method="get" th:action="@{/tier}" class="space-y-4">
                <!-- 검색창 -->
                <div class="flex items-center space-x-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-2">회원 검색</label>
                        <div class="relative">
                            <input type="text" 
                                   name="search" 
                                   th:value="${searchKeyword}"
                                   placeholder="이름, 이메일, 전화번호로 검색..."
                                   class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 등급 필터 -->
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <label class="text-sm font-medium text-gray-700">등급 필터:</label>
                        <select name="grade" class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">전체</option>
                            <option th:each="g : ${grades}" 
                                    th:value="${g}" 
                                    th:text="${g}"
                                    th:selected="${selectedGrade == g}"></option>
                        </select>
                    </div>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200">
                        검색
                    </button>
                    <a th:href="@{/tier}" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors duration-200">
                        초기화
                    </a>
                </div>
                
                <!-- 검색 결과 표시 -->
                <div th:if="${searchKeyword}" class="text-sm text-gray-600">
                    <span class="font-medium" th:text="${searchKeyword}">검색어</span>로 검색한 결과: 
                    <span class="font-medium" th:text="${totalCount}">0</span>명
                </div>
            </form>
        </div>

        <!-- 회원 목록 테이블 -->
        <div class="bg-white rounded-lg shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">이름</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">이메일</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">현재 등급</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">등급 변경</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="user : ${users}" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${user.id}">1</td>
                             <td class="px-6 py-4 whitespace-nowrap">
                                 <div class="text-sm font-medium text-gray-900" th:text="${user.name}">홍길동</div>
                             </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${user.email}">hong@example.com</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                 <span th:switch="${user.grade}" 
                                       class="inline-flex px-2 py-1 text-xs font-semibold rounded-full">
                                     <span th:case="GREEN" class="bg-green-100 text-green-800">그린</span>
                                     <span th:case="BLUE" class="bg-blue-100 text-blue-800">블루</span>
                                     <span th:case="PURPLE" class="bg-purple-100 text-purple-800">퍼플</span>
                                     <span th:case="BLACK" class="bg-gray-800 text-white">블랙</span>
                                     <span th:case="*" class="bg-gray-100 text-gray-800" th:text="${user.grade}">등급</span>
                                 </span>
                             </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <form th:action="@{'/tier/' + ${user.id} + '/update'}" method="post" class="flex items-center space-x-2">
                                    <select name="grade" class="border border-gray-300 rounded-lg px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        <option th:each="g : ${grades}" 
                                                th:value="${g}" 
                                                th:text="${g}"
                                                th:selected="${user.grade == g}"></option>
                                    </select>
                                    <button type="submit" class="px-3 py-1 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors duration-200 text-sm">
                                        변경
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                                <div class="flex flex-col items-center">
                                    <svg class="w-12 h-12 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/>
                                    </svg>
                                    <p class="text-lg font-medium">등록된 회원이 없습니다</p>
                                    <p class="text-sm">다른 등급으로 필터링해보세요.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- 페이징 네비게이션 -->
            <div th:if="${totalPages > 1}" class="px-6 py-4 border-t border-gray-200">
                <div class="flex items-center justify-between">
                    <div class="text-sm text-gray-700">
                        <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span> 페이지
                    </div>
                    <div class="flex space-x-2">
                        <!-- 이전 페이지 -->
                        <a th:if="${currentPage > 0}" 
                           th:href="@{/tier(grade=${selectedGrade}, search=${searchKeyword}, page=${currentPage - 1})}"
                           class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                            이전
                        </a>
                        
                        <!-- 페이지 번호들 -->
                        <template th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}">
                            <a th:if="${pageNum >= currentPage - 2 and pageNum <= currentPage + 2}"
                               th:href="@{/tier(grade=${selectedGrade}, search=${searchKeyword}, page=${pageNum})}"
                               th:class="${pageNum == currentPage ? 'bg-purple-600 text-white' : 'text-gray-500 bg-white hover:bg-gray-50'}"
                               class="px-3 py-2 text-sm font-medium border border-gray-300 rounded-lg"
                               th:text="${pageNum + 1}">1</a>
                        </template>
                        
                        <!-- 다음 페이지 -->
                        <a th:if="${currentPage < totalPages - 1}" 
                           th:href="@{/tier(grade=${selectedGrade}, search=${searchKeyword}, page=${currentPage + 1})}"
                           class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                            다음
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
