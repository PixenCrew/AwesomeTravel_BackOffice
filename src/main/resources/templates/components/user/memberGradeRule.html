<div th:fragment="content">
    <div class="space-y-6">

        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold text-gray-900">등급 기준 관리</h2>
        </div>

        <form th:action="@{/tierRule}" th:object="${memberGradeRuleList}" method="post">

            <div class="bg-white rounded-lg shadow-sm">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3">등급</th>
                                <th class="px-6 py-3">최근 1년 이용횟수</th>
                                <th class="px-6 py-3">최근 5년 이용횟수</th>
                                <th class="px-6 py-3">단일 최대 결제금액</th>
                                <th class="px-6 py-3">최근 5년 누적결제</th>
                                <th class="px-6 py-3">우선순위</th>
                                <th class="px-6 py-3">순서 변경</th>
                            </tr>
                        </thead>

                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:each="rule, iterStat : *{memberGradeRules}">

                                <!-- ID -->
                                <input type="hidden"
                                    th:field="*{memberGradeRules[__${iterStat.index}__].id}" />

                                <!-- Grade -->
                                <td class="px-6 py-4">
                                    <input type="hidden"
                                        th:field="*{memberGradeRules[__${iterStat.index}__].grade}" />
                                    <span th:text="${rule.grade}"></span>
                                </td>

                                <!-- 최근 1년 이용 -->
                                <td class="px-6 py-4">
                                    <input type="number"
                                        th:field="*{memberGradeRules[__${iterStat.index}__].minUseCountLast1Year}"
                                        min="0"
                                        step="1"
                                        class="w-32 border rounded px-2 py-1" />
                                </td>

                                <!-- 최근 5년 이용 -->
                                <td class="px-6 py-4">
                                    <input type="number"
                                        th:field="*{memberGradeRules[__${iterStat.index}__].minUseCountLast5Years}"
                                        min="0"
                                        step="1"
                                        class="w-32 border rounded px-2 py-1" />
                                </td>

                                <!-- 단일 최대 결제 -->
                                <td class="px-6 py-4">
                                    <input type="number"
                                        th:field="*{memberGradeRules[__${iterStat.index}__].minMaxPrice}"
                                        min="0"
                                        step="1"
                                        class="w-32 border rounded px-2 py-1" />
                                </td>

                                <!-- 최근 5년 누적 -->
                                <td class="px-6 py-4">
                                    <input type="number"
                                        th:field="*{memberGradeRules[__${iterStat.index}__].minTotalPriceLast5Years}"
                                        min="0"
                                        step="1"
                                        class="w-32 border rounded px-2 py-1" />
                                </td>

                                <!-- 우선순위 (자동 계산, 표시만) -->
                                <td class="px-6 py-4">
                                    <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-purple-100 text-purple-800 font-semibold text-sm priority-display" 
                                          th:attr="data-index=${iterStat.index}">
                                        <span th:text="${iterStat.index + 1}">1</span>
                                    </span>
                                    <input type="hidden"
                                        th:field="*{memberGradeRules[__${iterStat.index}__].priority}"
                                        class="priority-input"
                                        th:attr="data-index=${iterStat.index}" />
                                </td>

                                <!-- 순서 변경 버튼 -->
                                <td class="px-6 py-4">
                                    <div class="flex flex-col space-y-1">
                                        <button type="button"
                                                class="move-up-btn px-2 py-1 bg-blue-50 text-blue-700 rounded hover:bg-blue-100 transition-colors duration-200 text-xs disabled:opacity-50 disabled:cursor-not-allowed"
                                                th:attr="data-index=${iterStat.index}"
                                                th:disabled="${iterStat.first}">
                                            <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                                            </svg>
                                        </button>
                                        <button type="button"
                                                class="move-down-btn px-2 py-1 bg-blue-50 text-blue-700 rounded hover:bg-blue-100 transition-colors duration-200 text-xs disabled:opacity-50 disabled:cursor-not-allowed"
                                                th:attr="data-index=${iterStat.index}"
                                                th:disabled="${iterStat.last}">
                                            <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                            </svg>
                                        </button>
                                    </div>
                                </td>

                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-4 text-right">
                <button type="submit"
                    class="px-5 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                    전체 저장
                </button>
            </div>
        </form>
    </div>

    <script>
        // 우선순위 업데이트 함수
        function updatePriorities() {
            const rows = document.querySelectorAll('tbody tr');
            rows.forEach((row, index) => {
                const priorityDisplay = row.querySelector('.priority-display span');
                const priorityInput = row.querySelector('.priority-input');
                const newPriority = index + 1;
                
                if (priorityDisplay) {
                    priorityDisplay.textContent = newPriority;
                }
                if (priorityInput) {
                    priorityInput.value = newPriority;
                }
                
                // 위/아래 버튼 활성화 상태 업데이트
                const moveUpBtn = row.querySelector('.move-up-btn');
                const moveDownBtn = row.querySelector('.move-down-btn');
                
                if (moveUpBtn) {
                    moveUpBtn.disabled = index === 0;
                }
                if (moveDownBtn) {
                    moveDownBtn.disabled = index === rows.length - 1;
                }
            });
        }

        // 위로 이동
        document.querySelectorAll('.move-up-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const row = this.closest('tr');
                const prevRow = row.previousElementSibling;
                
                if (prevRow) {
                    row.parentNode.insertBefore(row, prevRow);
                    updatePriorities();
                }
            });
        });

        // 아래로 이동
        document.querySelectorAll('.move-down-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const row = this.closest('tr');
                const nextRow = row.nextElementSibling;
                
                if (nextRow) {
                    row.parentNode.insertBefore(nextRow, row);
                    updatePriorities();
                }
            });
        });

        // 초기 우선순위 설정
        document.addEventListener('DOMContentLoaded', function() {
            updatePriorities();
        });

        // 폼 제출 전 음수 값 검증 및 우선순위 최종 업데이트
        document.querySelector('form').addEventListener('submit', function(e) {
            // 우선순위 최종 업데이트
            updatePriorities();
            
            const numberInputs = document.querySelectorAll('input[type="number"]:not(.priority-input)');
            let hasError = false;
            
            numberInputs.forEach(input => {
                const value = parseFloat(input.value);
                if (isNaN(value) || value < 0) {
                    input.classList.add('border-red-500');
                    hasError = true;
                } else {
                    input.classList.remove('border-red-500');
                    // 음수 값이 입력된 경우 0으로 자동 수정
                    if (value < 0) {
                        input.value = 0;
                    }
                }
            });
            
            if (hasError) {
                e.preventDefault();
                alert('0보다 작은 값은 입력할 수 없습니다. 모든 값은 0 이상이어야 합니다.');
                return false;
            }
        });

        // 입력 중 음수 값 방지
        document.querySelectorAll('input[type="number"]:not(.priority-input)').forEach(input => {
            input.addEventListener('input', function() {
                const value = parseFloat(this.value);
                if (!isNaN(value) && value < 0) {
                    this.value = 0;
                    this.classList.add('border-red-500');
                    setTimeout(() => {
                        this.classList.remove('border-red-500');
                    }, 2000);
                } else {
                    this.classList.remove('border-red-500');
                }
            });

            // 포커스 아웃 시 음수 값 자동 수정
            input.addEventListener('blur', function() {
                const value = parseFloat(this.value);
                if (!isNaN(value) && value < 0) {
                    this.value = 0;
                }
            });
        });
    </script>
</div>
