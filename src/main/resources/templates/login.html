<!DOCTYPE html>
<html lang="ko">

<head>
    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'

                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-N2JRTZZQ');</script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>딱좋은여행 관리자 - 로그인</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="apple-touch-icon" th:href="@{/favicon.ico}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#1E40AF',
                        accent: '#F59E0B'
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N2JRTZZQ" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="w-full max-w-md">
        <!-- 로고 및 제목 -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-full mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Awesome Travel</h1>
            <p class="text-gray-600">관리자 로그인</p>
        </div>

        <!-- 로그인 폼 -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <form method="post" action="/login" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">사용자명</label>
                    <input type="text"
                        id="username"
                        name="username"
                        required
                        value="admin"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200 outline-none">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                    <input type="password"
                        id="password"
                        name="password"
                        required
                        value="admin"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200 outline-none">
                </div>

                <!-- 로그인 실패 시 메시지 -->
                <div th:if="${param.error}" class="bg-red-50 border border-red-200 rounded-lg p-4">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 text-red-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                        </svg>
                        <p class="text-red-600 text-sm">잘못된 사용자명 또는 비밀번호입니다.</p>
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-primary hover:bg-secondary text-white font-semibold py-3 px-4 rounded-lg transition duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                    로그인
                </button>
            </form>
            
            <!-- 테스트 계정 생성 버튼 -->
            <div class="mt-4 text-center">
                <button type="button"
                    onclick="openTestAccountModal()"
                    class="text-sm text-gray-600 hover:text-primary transition duration-200 underline">
                    테스트 계정 생성
                </button>
            </div>
        </div>
    </div>

    <!-- 테스트 계정 생성 모달 -->
    <div id="testAccountModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50" onclick="closeTestAccountModal(event)">
        <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-gray-900">테스트 계정 생성</h2>
                <button type="button"
                    onclick="closeTestAccountModal()"
                    class="text-gray-400 hover:text-gray-600 transition duration-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <form method="post" action="/admin" class="space-y-4">
                <div>
                    <label for="test-username" class="block text-sm font-medium text-gray-700 mb-2">사용자명</label>
                    <input type="text"
                        id="test-username"
                        name="id"
                        required
                        value="admin"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200 outline-none">
                </div>

                <div>
                    <label for="test-password" class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                    <input type="password"
                        id="test-password"
                        name="password"
                        required
                        value="admin"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200 outline-none">
                </div>
                
                <div>
                    <label for="test-name" class="block text-sm font-medium text-gray-700 mb-2">이름</label>
                    <input type="text"
                        id="test-name"
                        name="name"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200 outline-none">
                </div>
                
                <div>
                    <label for="test-position" class="block text-sm font-medium text-gray-700 mb-2">직급</label>
                    <input type="text"
                        id="test-position"
                        name="position"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200 outline-none">
                </div>
                
                <div>
                    <label for="test-email" class="block text-sm font-medium text-gray-700 mb-2">이메일</label>
                    <input type="email"
                        id="test-email"
                        name="email"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200 outline-none">
                </div>
                
                <div>
                    <label for="test-number" class="block text-sm font-medium text-gray-700 mb-2">전화</label>
                    <input type="tel"
                        id="test-number"
                        name="number"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200 outline-none">
                </div>
                
                <div>
                    <label for="test-fax" class="block text-sm font-medium text-gray-700 mb-2">팩스</label>
                    <input type="tel"
                        id="test-fax"
                        name="fax"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition duration-200 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">역할</label>
                    <input type="hidden" name="role" value="ADMIN">
                    <div class="px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg">
                        <span class="text-sm text-gray-700">관리자</span>
                    </div>
                </div>

                <div class="flex space-x-3 pt-4">
                    <button type="button"
                        onclick="closeTestAccountModal()"
                        class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg transition duration-200">
                        취소
                    </button>
                    <button type="submit"
                        class="flex-1 bg-accent hover:bg-yellow-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
                        생성
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openTestAccountModal() {
            document.getElementById('testAccountModal').classList.remove('hidden');
            document.getElementById('testAccountModal').classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeTestAccountModal(event) {
            if (event && event.target !== event.currentTarget) {
                return;
            }
            document.getElementById('testAccountModal').classList.add('hidden');
            document.getElementById('testAccountModal').classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeTestAccountModal();
            }
        });
    </script>
</body>

</html>
